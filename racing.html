<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ─── Canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 500;
canvas.width = W; canvas.height = H;

// ─── Road constants ───────────────────────────────────────────────────────────
const ROAD_W   = 2000;   // half-width of road in world units
const SEG_LEN  = 200;    // length of one road segment in world units
const DRAW_DIST= 200;    // how many segments to draw
const CAMERA_H = 1200;   // camera height
const CAMERA_D = 0.84;   // camera depth
const HORIZON  = H * 0.42;

// ─── Track definition ─────────────────────────────────────────────────────────
// Each segment: { curve, hill, color }
const TOTAL_SEGS = 1600;
const track = [];
function addStraight(n=25) { for(let i=0;i<n;i++) track.push({curve:0,hill:0}); }
function addCurve(n=25,c=0.02,h=0) { for(let i=0;i<n;i++) track.push({curve:c,hill:h}); }
function addHill(n=25,h=0.5) { for(let i=0;i<n;i++) track.push({curve:0,hill:h}); }

addStraight(20);
addCurve(30, 0.015); addStraight(15);
addCurve(30,-0.02); addStraight(10);
addHill(20, 0.6); addStraight(20);
addCurve(25, 0.025, 0.3); addStraight(15);
addCurve(25,-0.025,-0.3); addStraight(20);
addHill(15, -0.5); addStraight(15);
addCurve(40, 0.012); addStraight(30);
addCurve(30,-0.015); addStraight(20);
while (track.length < TOTAL_SEGS) addStraight(1);

// Assign alternating road colors
for (let i = 0; i < track.length; i++) {
  const alt = Math.floor(i / 10) % 2 === 0;
  track[i].roadColor  = alt ? '#6b6b6b' : '#7a7a7a';
  track[i].grassColor = alt ? '#16a34a' : '#15803d';
  track[i].rumbleColor= alt ? '#dc2626' : '#fff';
  track[i].fenceColor = alt ? '#fbbf24' : '#fff';
}

// ─── Game state ───────────────────────────────────────────────────────────────
let state = 'title'; // 'title' | 'playing' | 'finish'
let pos = 0;         // position along track (world units)
let speed = 0;
let playerX = 0;     // lateral position -1..1
let curve   = 0;     // accumulated curve offset for camera lean
let lap = 0;
let lapTime = 0;
let bestLap = Infinity;
let totalTime = 0;
let laps = 3;
let finished = false;

const MAX_SPEED  = 8000;
const ACC        = 180;
const BRAKE      = 500;
const DECEL      = 100;
const STEER_SPEED= 0.025;
const OFF_ROAD   = 0.6; // speed penalty

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'Enter') {
    if (state === 'title') startGame();
    else if (state === 'finish') startGame();
  }
  e.preventDefault();
}, false);
window.addEventListener('keyup',  e => { keys[e.code] = false; }, false);

function startGame() {
  state    = 'playing';
  pos      = 0;
  speed    = 0;
  playerX  = 0;
  curve    = 0;
  lap      = 1;
  lapTime  = 0;
  totalTime= 0;
  finished = false;
}

// ─── Segment projection helper ────────────────────────────────────────────────
function project(worldX, worldY, worldZ, cameraX, cameraY, cameraZ) {
  const scale = CAMERA_D / (worldZ - cameraZ);
  const sx = (W/2) + scale * (worldX - cameraX) * W/2;
  const sy = (H/2) - scale * (worldY - cameraY) * H/2;
  const sw = scale * ROAD_W * W/2;
  return { x:sx, y:sy, w:sw, scale };
}

function getSeg(n) { return track[((n % TOTAL_SEGS) + TOTAL_SEGS) % TOTAL_SEGS]; }

// ─── Draw road segment ────────────────────────────────────────────────────────
function drawSegment(p1, p2, seg, screenY1, screenY2, alt) {
  // Grass
  ctx.fillStyle = seg.grassColor;
  ctx.fillRect(0, screenY2, W, screenY1 - screenY2);

  const r = seg.rumbleColor;
  const roadW1 = p1.w, roadW2 = p2.w;
  const cx1 = p1.x, cx2 = p2.x;
  const rumble = roadW1 * 0.1;

  // Rumble strip left
  ctx.fillStyle = r;
  ctx.beginPath();
  ctx.moveTo(cx1 - roadW1 - rumble, screenY1);
  ctx.lineTo(cx2 - roadW2 - rumble, screenY2);
  ctx.lineTo(cx2 - roadW2, screenY2);
  ctx.lineTo(cx1 - roadW1, screenY1);
  ctx.fill();

  // Road surface
  ctx.fillStyle = seg.roadColor;
  ctx.beginPath();
  ctx.moveTo(cx1 - roadW1, screenY1);
  ctx.lineTo(cx2 - roadW2, screenY2);
  ctx.lineTo(cx2 + roadW2, screenY2);
  ctx.lineTo(cx1 + roadW1, screenY1);
  ctx.fill();

  // Center dashed line
  if (alt) {
    const lw1 = roadW1 * 0.015;
    const lw2 = roadW2 * 0.015;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(cx1 - lw1, screenY1);
    ctx.lineTo(cx2 - lw2, screenY2);
    ctx.lineTo(cx2 + lw2, screenY2);
    ctx.lineTo(cx1 + lw1, screenY1);
    ctx.fill();
  }

  // Rumble strip right
  ctx.fillStyle = r;
  ctx.beginPath();
  ctx.moveTo(cx1 + roadW1, screenY1);
  ctx.lineTo(cx2 + roadW2, screenY2);
  ctx.lineTo(cx2 + roadW2 + rumble, screenY2);
  ctx.lineTo(cx1 + roadW1 + rumble, screenY1);
  ctx.fill();

  // Fence posts (every ~10 segments)
  drawFence(cx1, cx2, roadW1, roadW2, rumble, screenY1, screenY2, p1.scale);
}

function drawFence(cx1, cx2, rw1, rw2, rumble, sy1, sy2, scale) {
  const h = scale * 400;
  const fenceH = Math.max(2, h);
  const postW  = Math.max(2, scale * 50);
  const fenceY1 = sy1 - fenceH;

  // Left fence rail
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = Math.max(1, scale * 30);
  ctx.beginPath();
  ctx.moveTo(cx1 - rw1 - rumble - postW/2, sy1);
  ctx.lineTo(cx2 - rw2 - rumble - postW/2, sy2);
  ctx.stroke();

  // Right fence rail
  ctx.beginPath();
  ctx.moveTo(cx1 + rw1 + rumble + postW/2, sy1);
  ctx.lineTo(cx2 + rw2 + rumble + postW/2, sy2);
  ctx.stroke();

  // Left post
  ctx.fillStyle = '#fff';
  ctx.fillRect(cx1 - rw1 - rumble - postW, fenceY1, postW, fenceH);

  // Right post
  ctx.fillRect(cx1 + rw1 + rumble, fenceY1, postW, fenceH);
}

// ─── Draw car ─────────────────────────────────────────────────────────────────
function drawCar(steer) {
  const cx = W / 2 - steer * 60;
  const cy = H - 90;
  const cw = 100, ch = 60;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + ch/2 + 4, cw*0.55, 10, 0, 0, Math.PI*2);
  ctx.fill();

  // Body
  const grad = ctx.createLinearGradient(cx-cw/2, cy-ch/2, cx+cw/2, cy+ch/2);
  grad.addColorStop(0, '#ef4444');
  grad.addColorStop(0.5, '#dc2626');
  grad.addColorStop(1, '#7f1d1d');
  ctx.fillStyle = grad;

  // Main body shape
  ctx.beginPath();
  ctx.moveTo(cx - cw*0.5, cy + ch*0.3);
  ctx.lineTo(cx - cw*0.4, cy - ch*0.1);
  ctx.lineTo(cx - cw*0.2, cy - ch*0.5);
  ctx.lineTo(cx + cw*0.2, cy - ch*0.5);
  ctx.lineTo(cx + cw*0.4, cy - ch*0.1);
  ctx.lineTo(cx + cw*0.5, cy + ch*0.3);
  ctx.closePath();
  ctx.fill();

  // Roof / cockpit
  ctx.fillStyle = '#1e3a8a';
  ctx.beginPath();
  ctx.moveTo(cx - cw*0.18, cy - ch*0.1);
  ctx.lineTo(cx - cw*0.14, cy - ch*0.45);
  ctx.lineTo(cx + cw*0.14, cy - ch*0.45);
  ctx.lineTo(cx + cw*0.18, cy - ch*0.1);
  ctx.closePath();
  ctx.fill();

  // Windscreen
  ctx.fillStyle = 'rgba(147,210,255,0.6)';
  ctx.beginPath();
  ctx.moveTo(cx - cw*0.14, cy - ch*0.12);
  ctx.lineTo(cx - cw*0.11, cy - ch*0.42);
  ctx.lineTo(cx + cw*0.11, cy - ch*0.42);
  ctx.lineTo(cx + cw*0.14, cy - ch*0.12);
  ctx.closePath();
  ctx.fill();

  // Wheels
  ctx.fillStyle = '#1f2937';
  [[cx-cw*0.42, cy+ch*0.22],[cx+cw*0.42, cy+ch*0.22],
   [cx-cw*0.36, cy+ch*0.28],[cx+cw*0.36, cy+ch*0.28]].forEach(([wx,wy]) => {
    ctx.beginPath();
    ctx.ellipse(wx, wy, 15, 9, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#6b7280';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // Number plate
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(cx - 18, cy + ch*0.1, 36, 14);
  ctx.fillStyle = '#111';
  ctx.font = 'bold 10px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('01', cx, cy + ch*0.1 + 10);
}

// ─── Draw logo (title screen) ─────────────────────────────────────────────────
function drawLogo(x, y, size) {
  const s = size / 100;
  ctx.save();
  ctx.translate(x, y);

  // Track circle
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 6*s;
  ctx.beginPath();
  ctx.arc(0, 0, 44*s, 0, Math.PI*2);
  ctx.stroke();

  // Mini car body
  const cw = 50*s, ch = 28*s;
  const cx = 0, cy = 6*s;
  const g = ctx.createLinearGradient(-cw/2, -ch, cw/2, ch);
  g.addColorStop(0, '#ef4444'); g.addColorStop(1, '#7f1d1d');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(cx-cw*0.5, cy+ch*0.3);
  ctx.lineTo(cx-cw*0.4, cy-ch*0.1);
  ctx.lineTo(cx-cw*0.2, cy-ch*0.5);
  ctx.lineTo(cx+cw*0.2, cy-ch*0.5);
  ctx.lineTo(cx+cw*0.4, cy-ch*0.1);
  ctx.lineTo(cx+cw*0.5, cy+ch*0.3);
  ctx.closePath();
  ctx.fill();

  // Cockpit
  ctx.fillStyle = '#1e3a8a';
  ctx.beginPath();
  ctx.moveTo(cx-cw*0.18, cy-ch*0.1);
  ctx.lineTo(cx-cw*0.14, cy-ch*0.5);
  ctx.lineTo(cx+cw*0.14, cy-ch*0.5);
  ctx.lineTo(cx+cw*0.18, cy-ch*0.1);
  ctx.closePath();
  ctx.fill();

  // Wheels
  ctx.fillStyle = '#1f2937';
  [[cx-cw*0.42, cy+ch*0.25],[cx+cw*0.42, cy+ch*0.25]].forEach(([wx,wy]) => {
    ctx.beginPath();
    ctx.ellipse(wx, wy, 8*s, 5*s, 0, 0, Math.PI*2);
    ctx.fill();
  });

  // Speed lines
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 2*s;
  for (let i = 0; i < 4; i++) {
    const lx = -cw*0.5 - 8*s - i*6*s;
    const ly = cy - ch*0.1 + i*4*s - 6*s;
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(lx - 12*s, ly);
    ctx.stroke();
  }

  ctx.restore();
}

// ─── HUD ──────────────────────────────────────────────────────────────────────
function drawHUD() {
  ctx.save();
  // Speed bar
  const spd = Math.round(speed / MAX_SPEED * 320);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.roundRect(16, H-50, 220, 32, 6); ctx.fill();
  const sg = ctx.createLinearGradient(20, 0, 240, 0);
  sg.addColorStop(0,'#22c55e'); sg.addColorStop(0.6,'#eab308'); sg.addColorStop(1,'#ef4444');
  ctx.fillStyle = sg;
  ctx.roundRect(20, H-46, spd, 24, 4); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px Arial';
  ctx.textAlign = 'left';
  ctx.fillText(`${Math.round(speed/MAX_SPEED*320)} km/h`, 24, H-28);

  // Lap counter
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.roundRect(W-130, 12, 118, 36, 6); ctx.fill();
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 20px Arial Black';
  ctx.textAlign = 'right';
  ctx.fillText(`LAP ${lap}/${laps}`, W-20, 38);

  // Lap timer
  const ms = Math.round(lapTime * 1000);
  const s2 = Math.floor(ms/1000), m = Math.floor(s2/60), rem = s2%60, cs = Math.floor((ms%1000)/10);
  const timeStr = `${m}:${String(rem).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.roundRect(W-130, 54, 118, 32, 6); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px Arial';
  ctx.fillText(timeStr, W-20, 76);

  if (bestLap < Infinity) {
    const bs = Math.floor(bestLap), bm = Math.floor(bs/60), br = bs%60, bc = Math.floor((bestLap%1*1000)/10);
    ctx.fillStyle = '#86efac';
    ctx.font = '12px Arial';
    ctx.fillText(`BEST ${bm}:${String(br).padStart(2,'0')}.${String(bc).padStart(2,'0')}`, W-20, 96);
  }

  // Controls hint
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '12px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('← → steer  ↑ gas  ↓ brake', 16, 24);

  ctx.restore();
}

// ─── Title screen ─────────────────────────────────────────────────────────────
function drawTitle() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0f172a'); sky.addColorStop(1,'#1e3a8a');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  // Stars
  ctx.fillStyle = '#fff';
  for (let i=0; i<80; i++) {
    const sx = (i*47+13) % W;
    const sy = (i*31+7)  % (H*0.5);
    ctx.fillRect(sx, sy, i%3===0?2:1, i%3===0?2:1);
  }

  // Road preview at bottom
  ctx.fillStyle = '#374151';
  ctx.beginPath();
  ctx.moveTo(W*0.3, H); ctx.lineTo(W*0.5-20, H*0.6);
  ctx.lineTo(W*0.5+20, H*0.6); ctx.lineTo(W*0.7, H);
  ctx.closePath(); ctx.fill();

  // Logo
  drawLogo(W/2, H*0.28, 110);

  // Title text
  ctx.save();
  ctx.textAlign = 'center';
  ctx.shadowColor = '#fbbf24';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 72px Arial Black';
  ctx.fillText('RACING', W/2, H*0.55);
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.font = 'bold 18px Arial';
  ctx.fillStyle = '#fbbf24';
  ctx.fillText('CHAMPIONSHIP', W/2, H*0.62);

  // Blink
  if (Math.floor(Date.now()/600) % 2 === 0) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('PRESS SPACE TO RACE', W/2, H*0.78);
  }

  // Controls
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '14px Arial';
  ctx.fillText('← → Steer   ↑ Accelerate   ↓ Brake', W/2, H*0.88);

  ctx.restore();
}

// ─── Finish screen ────────────────────────────────────────────────────────────
function drawFinish() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 60px Arial Black';
  ctx.fillText('FINISH!', W/2, H*0.35);

  const ts = Math.floor(totalTime), tm = Math.floor(ts/60), tr = ts%60, tc = Math.floor((totalTime%1*1000)/10);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px Arial';
  ctx.fillText(`Total: ${tm}:${String(tr).padStart(2,'0')}.${String(tc).padStart(2,'0')}`, W/2, H*0.5);

  if (bestLap < Infinity) {
    const bs = Math.floor(bestLap), bm2 = Math.floor(bs/60), br2 = bs%60, bc2 = Math.floor((bestLap%1*1000)/10);
    ctx.fillStyle = '#86efac';
    ctx.font = '20px Arial';
    ctx.fillText(`Best Lap: ${bm2}:${String(br2).padStart(2,'0')}.${String(bc2).padStart(2,'0')}`, W/2, H*0.6);
  }

  if (Math.floor(Date.now()/600) % 2 === 0) {
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('PRESS SPACE TO PLAY AGAIN', W/2, H*0.75);
  }
}

// ─── Sky & horizon ────────────────────────────────────────────────────────────
function drawSky() {
  const sky = ctx.createLinearGradient(0,0,0,HORIZON);
  sky.addColorStop(0,'#0ea5e9');
  sky.addColorStop(1,'#bae6fd');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,HORIZON);

  // Sun
  const sx = W*0.72, sy = HORIZON*0.35;
  const sunG = ctx.createRadialGradient(sx,sy,0,sx,sy,60);
  sunG.addColorStop(0,'#fef3c7');
  sunG.addColorStop(0.4,'#fbbf24');
  sunG.addColorStop(1,'rgba(251,191,36,0)');
  ctx.fillStyle = sunG;
  ctx.beginPath(); ctx.arc(sx,sy,60,0,Math.PI*2); ctx.fill();

  // Mountains
  ctx.fillStyle = '#1d4ed8';
  ctx.beginPath();
  ctx.moveTo(0,HORIZON);
  for (let i=0;i<=20;i++) {
    const mx = i/20*W;
    const mh = 30 + Math.sin(i*1.3)*25 + Math.sin(i*2.7)*15;
    ctx.lineTo(mx, HORIZON - mh);
  }
  ctx.lineTo(W,HORIZON); ctx.closePath(); ctx.fill();
}

// ─── Main render ─────────────────────────────────────────────────────────────
let lastT = 0;
function render(ts) {
  requestAnimationFrame(render);
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;

  if (state === 'title') {
    drawTitle();
    return;
  }
  if (state === 'finish') {
    drawFinish();
    return;
  }

  // ─ Update ─
  const accel = keys['ArrowUp']   || keys['KeyW'];
  const brake = keys['ArrowDown'] || keys['KeyS'];
  const left  = keys['ArrowLeft'] || keys['KeyA'];
  const right = keys['ArrowRight']|| keys['KeyD'];

  if (accel) speed = Math.min(speed + ACC * dt, MAX_SPEED);
  else if (brake) speed = Math.max(speed - BRAKE * dt, 0);
  else speed = Math.max(speed - DECEL * dt, 0);

  // Off-road penalty
  if (Math.abs(playerX) > 1) speed *= 1 - OFF_ROAD * dt;

  const steerAmt = STEER_SPEED * (speed / MAX_SPEED + 0.1);
  if (left)  playerX -= steerAmt;
  if (right) playerX += steerAmt;

  const startSeg = Math.floor(pos / SEG_LEN);
  const seg = getSeg(startSeg);

  // Drift camera with curve
  curve += (seg.curve - curve) * 2 * dt;
  if (left || right) {
    // counter-curve drift
    if (left)  playerX += curve * 0.4 * dt;
    if (right) playerX -= curve * 0.4 * dt;
  } else {
    // natural drift
    playerX -= curve * 0.5 * dt;
  }

  playerX = Math.max(-2, Math.min(2, playerX));

  pos += speed * dt;
  lapTime += dt;

  // Lap detection
  const trackLen = TOTAL_SEGS * SEG_LEN;
  if (pos >= trackLen) {
    pos -= trackLen;
    if (lapTime < bestLap) bestLap = lapTime;
    lapTime = 0;
    lap++;
    if (lap > laps) {
      totalTime += lapTime;
      state = 'finish';
      return;
    }
  }

  // ─ Draw ─
  drawSky();

  // Ground fill below horizon
  ctx.fillStyle = '#16a34a';
  ctx.fillRect(0, HORIZON, W, H - HORIZON);

  // ─ Project segments ─
  let x = 0, dx = 0;
  let maxY = H;
  const basePos = pos;
  const startI  = Math.floor(basePos / SEG_LEN);
  const camH    = CAMERA_H + seg.hill * 300;

  for (let n = 0; n < DRAW_DIST; n++) {
    const segI  = startI + n;
    const s     = getSeg(segI);
    const segZ  = (segI - startI) * SEG_LEN - (basePos % SEG_LEN);

    x  += dx;
    dx += s.curve;

    const scale1 = CAMERA_D / (segZ);
    const scale2 = CAMERA_D / (segZ + SEG_LEN);

    const proj1 = {
      x : (W/2) + (x - playerX * ROAD_W) * scale1 * W,
      y : HORIZON + (1 - camH * scale1) * H,
      w : scale1 * ROAD_W * W
    };
    const proj2 = {
      x : (W/2) + (x + dx*0 - playerX * ROAD_W) * scale2 * W,
      y : HORIZON + (1 - camH * scale2) * H,
      w : scale2 * ROAD_W * W
    };

    if (proj1.y >= maxY) continue; // hidden by previous segment
    maxY = proj1.y;

    const alt = Math.floor(segI / 10) % 2 === 0;
    drawSegment(proj1, proj2, s, proj1.y, proj2.y, alt);
  }

  // Draw car
  const steerLean = (right ? 1 : 0) - (left ? 1 : 0);
  drawCar(steerLean);

  // HUD
  drawHUD();
}

requestAnimationFrame(render);
</script>
</body>
</html>
