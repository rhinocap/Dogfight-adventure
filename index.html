canvas.addEventListener('mousemove', e => {

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) { // left click
    if (gameState === STATE.TITLE) {
      // Check if clicking a color swatch
      let clickedUI = false;
      for (const area of colorPickerAreas) {
        if (e.clientX >= area.x && e.clientX <= area.x + area.w &&
            e.clientY >= area.y && e.clientY <= area.y + area.h) {
          if (area.player === 1) p1ColorIndex = area.colorIndex;
          else p2ColorIndex = area.colorIndex;
          clickedUI = true;
          break;
        }
      }
      // Check if clicking a jet picker area
      if (!clickedUI) {
        for (const area of jetPickerAreas) {
          if (e.clientX >= area.x && e.clientX <= area.x + area.w &&
              e.clientY >= area.y && e.clientY <= area.y + area.h) {
            if (area.player === 1) p1JetIndex = area.jetIndex;
            else p2JetIndex = area.jetIndex;
            clickedUI = true;
            break;
          }
        }
      }
      if (!clickedUI) {
        startGame();
      }
      mouseDown = false;
    } else if (gameState === STATE.GAMEOVER) {
      startGame();
      mouseDown = false;
    } else {
      mouseDown = true;
    }
  }
  if (e.button === 2 && gameState === STATE.PLAYING) { // right click
    fireMissileFor(player);
  }
});

});

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyP' && gameState === STATE.PLAYING) {
    gameState = STATE.PAUSED;
    e.preventDefault();
  } else if (e.code === 'KeyP' && gameState === STATE.PAUSED) {
    gameState = STATE.PLAYING;
    e.preventDefault();
  }
  // P1 Barrel roll: Q = roll left, E = roll right
  if (gameState === STATE.PLAYING && player.alive && player.barrelRollTimer <= 0) {
    if (e.code === 'KeyQ') startBarrelRollFor(player, -1);
    if (e.code === 'KeyE') startBarrelRollFor(player, 1);
  }
  // P2 Barrel roll: R = roll left, T = roll right
  if (gameState === STATE.PLAYING && player2.alive && player2.barrelRollTimer <= 0) {
    if (e.code === 'KeyR') startBarrelRollFor(player2, -1);
    if (e.code === 'KeyT') startBarrelRollFor(player2, 1);
  }
  // P2 missile: F
  if (e.code === 'KeyF' && gameState === STATE.PLAYING && player2.alive) {
    fireMissileFor(player2);
  }
  // Title/gameover start with keyboard too
  if (e.code === 'Space' && (gameState === STATE.TITLE || gameState === STATE.GAMEOVER)) {
    startGame();
  }
});

// ─── Audio System ───────────────────────────────────────────────
let audioCtx = null;
let masterGain = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.3;
  masterGain.connect(audioCtx.destination);
}

function playNoise(duration, freq, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = freq;
  osc.type = type || 'sawtooth';
  osc.frequency.value = freq * 0.5;
  gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playGunSound() {
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * 0.04;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.06;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 800;
  src.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  src.start();
}

function playMissileSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 400;
  filter.Q.value = 2;
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);

  // Noise whoosh
  const bufSize = audioCtx.sampleRate * 0.3;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
  const ns = audioCtx.createBufferSource();
  ns.buffer = buf;
  const ng = audioCtx.createGain();
  ng.gain.value = 0.08;
  const nf = audioCtx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = 1200;
  ns.connect(nf);
  nf.connect(ng);
  ng.connect(masterGain);
  ns.start();
}

function playExplosionSound(big) {
  if (!audioCtx) return;
  const dur = big ? 0.8 : 0.4;
  const bufSize = audioCtx.sampleRate * dur;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) {
    d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.3));
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const gain = audioCtx.createGain();
  gain.gain.value = big ? 0.2 : 0.12;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(big ? 600 : 900, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + dur);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  src.start();

  // Sub bass
  const osc = audioCtx.createOscillator();
  const og = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(80, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + dur);
  og.gain.setValueAtTime(big ? 0.25 : 0.12, audioCtx.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(og);
  og.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function playPowerupSound() {
  if (!audioCtx) return;
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f;
    gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.06);
    gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + i * 0.06 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.06 + 0.15);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(audioCtx.currentTime + i * 0.06);
    osc.stop(audioCtx.currentTime + i * 0.06 + 0.15);
  });
}

    osc.start(t);

// Engine hum (looping)
let engineOsc = null;
function startEngineHum() {
  if (!audioCtx || engineOsc) return;
  engineOsc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 55;
  filter.type = 'lowpass';
  filter.frequency.value = 120;
  gain.gain.value = 0.03;
  engineOsc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  engineOsc.start();
}

// ─── Barrel Roll ────────────────────────────────────────────────
const BARREL_ROLL_DURATION = 24; // frames (~0.4s)
const BARREL_ROLL_COOLDOWN = 40; // frames cooldown after roll

function startBarrelRollFor(p, dir) {
  if (p.barrelRollCooldown > 0) return;
  p.barrelRollTimer = BARREL_ROLL_DURATION;
  p.barrelRollDir = dir;
  p.barrelRollAngle = 0;
  p.barrelRollCooldown = BARREL_ROLL_DURATION + BARREL_ROLL_COOLDOWN;
  p.invulnTimer = Math.max(p.invulnTimer, BARREL_ROLL_DURATION); // invulnerable during roll
  playBarrelRollSound();
}

function updateBarrelRollFor(p) {
  if (p.barrelRollCooldown > 0) p.barrelRollCooldown--;
  if (p.barrelRollTimer > 0) {
    p.barrelRollTimer--;
    const progress = 1 - (p.barrelRollTimer / BARREL_ROLL_DURATION);
    p.barrelRollAngle = p.barrelRollDir * progress * TAU;

    // Lateral dodge boost during roll
    p.vx += p.barrelRollDir * 3.5;

    // Sparkle trail during roll
    for (let i = 0; i < 3; i++) {
      spawnParticle(
        p.x + (Math.random() - 0.5) * 30,
        p.y + (Math.random() - 0.5) * 30,
        (Math.random() - 0.5) * 2,
        Math.random() * 2 + 1,
        `hsl(${200 + Math.random() * 60}, 100%, ${70 + Math.random() * 30}%)`,
        2 + Math.random() * 3,
        10 + Math.random() * 8
      );
    }
  } else {
    p.barrelRollAngle = 0;
  }
}

function playTakeoffSound() {
  if (!audioCtx) return;
  // Rising turbine whine over ~5 seconds
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(80, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 1.3);
  osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 3.5);
  osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 5.5);
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(200, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 3.5);
  filter.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 5.5);
  gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 1.3);
  gain.gain.linearRampToValueAtTime(0.09, audioCtx.currentTime + 3.5);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 5.5);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 5.5);
}

function playBarrelRollSound() {
  if (!audioCtx) return;
  // Swoosh: filtered noise sweep
  const bufferSize = audioCtx.sampleRate * 0.35;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(400, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 0.15);
  filter.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.35);
  filter.Q.value = 3;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.2);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  src.start();
  src.stop(audioCtx.currentTime + 0.35);
}

// ─── Wave System ────────────────────────────────────────────────
function startWave(n) {
  wave = n;
  const isBoss = n % 5 === 0;
  if (isBoss) {
    waveEnemiesLeft = 1;
    gameState = STATE.BOSS_INTRO;
    introTimer = 180;
    bossWarningTimer = 180;
    playBossWarning();
  } else {
    const baseCount = 4 + Math.floor(n * 1.5);
    waveEnemiesLeft = Math.min(baseCount, 25);
    gameState = STATE.WAVE_INTRO;
    introTimer = 120;
  }
  waveSpawnTimer = 0;
}

function spawnWaveEnemy() {
  if (waveEnemiesLeft <= 0) return;
  waveEnemiesLeft--;

  const isBoss = wave % 5 === 0;
  if (isBoss) {
    spawnEnemy('boss');
    return;
  }

  // Pick enemy type based on wave
  const types = ['scout', 'fighter'];
  if (wave >= 2) types.push('bomber');
  if (wave >= 3) types.push('ace');
  // Weight toward harder enemies in later waves
  const r = Math.random();
  let type;
  if (wave < 3) {
    type = r < 0.5 ? 'scout' : 'fighter';
  } else if (wave < 6) {
    type = r < 0.3 ? 'scout' : r < 0.6 ? 'fighter' : r < 0.8 ? 'bomber' : 'ace';
  } else {
    type = r < 0.2 ? 'scout' : r < 0.45 ? 'fighter' : r < 0.7 ? 'bomber' : 'ace';
  }
  spawnEnemy(type);
}

function spawnEnemy(type) {
  const e = {
    type,
    x: 60 + Math.random() * (W - 120),
    y: -60,
    vx: 0, vy: 0,
    w: 0, h: 0,
    hp: 0, maxHp: 0,
    fireTimer: 60 + Math.random() * 60,
    fireRate: 60,
    phase: Math.random() * TAU,
    age: 0,
    scoreValue: 0,
    smoking: false
  };

  switch (type) {
    case 'scout':
      e.w = 22; e.h = 26;
      e.hp = e.maxHp = 2 + Math.floor(wave * 0.3);
      e.vy = 2.5 + Math.random() * 1;
      e.fireRate = 80;
      e.scoreValue = 100;
      break;
    case 'fighter':
      e.w = 28; e.h = 34;
      e.hp = e.maxHp = 4 + Math.floor(wave * 0.5);
      e.vy = 1.8 + Math.random() * 0.8;
      e.fireRate = 50;
      e.scoreValue = 200;
      break;
    case 'bomber':
      e.w = 40; e.h = 46;
      e.hp = e.maxHp = 10 + wave;
      e.vy = 1 + Math.random() * 0.5;
      e.fireRate = 100;
      e.scoreValue = 350;
      break;
    case 'ace':
      e.w = 26; e.h = 32;
      e.hp = e.maxHp = 6 + Math.floor(wave * 0.5);
      e.vy = 2 + Math.random() * 1;
      e.fireRate = 70;
      e.scoreValue = 500;
      break;
    case 'zombie':
      e.w = 28; e.h = 34;
      e.hp = e.maxHp = 3 + Math.floor(wave * 0.3);
      e.vy = 1.5 + Math.random() * 1;
      e.fireRate = 9999; // zombies don't shoot
      e.scoreValue = 150;
      e.wobblePhase = Math.random() * TAU;
      // Spawn from top, left, or right edges
      const edge = Math.random();
      if (edge < 0.5) {
        // top
        e.x = 60 + Math.random() * (W - 120);
        e.y = -60;
      } else if (edge < 0.75) {
        // left
        e.x = -40;
        e.y = 60 + Math.random() * (H * 0.5);
        e.vx = 1.5 + Math.random() * 1;
      } else {
        // right
        e.x = W + 40;
        e.y = 60 + Math.random() * (H * 0.5);
        e.vx = -(1.5 + Math.random() * 1);
      }
      break;
    case 'boss':
      e.w = 80; e.h = 90;
      e.hp = e.maxHp = 60 + wave * 15;
      e.vy = 1;
      e.fireRate = 30;
      e.scoreValue = 2000 + wave * 500;
      e.x = W / 2;
      e.bossPhase = 0;
      e.bossTimer = 0;
      e.targetY = 100;
      break;
  }
  enemies.push(e);
}

  bullets.push({
    x: p.x - 8, y: p.y - p.h / 2 - 4,
    vx: -spread * 0.3, vy: -10, w: 3, h: 10,
    damage: 1, isMissile: false
  });
  bullets.push({
    x: p.x + 8, y: p.y - p.h / 2 - 4,
    vx: spread * 0.3, vy: -10, w: 3, h: 10,
    damage: 1, isMissile: false
  });
  if (rapidFireTimer > 0) {
    bullets.push({
      x: p.x, y: p.y - p.h / 2 - 8,
      vx: 0, vy: -12, w: 3, h: 10,
      damage: 1, isMissile: false
    });
  }
  playGunSound();

  // Bullet casing particles
  for (let i = 0; i < 2; i++) {
    spawnParticle(p.x + (i === 0 ? -10 : 10), p.y - 5,
      (Math.random() - 0.5) * 3 + (i === 0 ? -1 : 1), Math.random() * 2,
      '#c8a84e', 2, 15);
  }
}

function fireMissileFor(p) {
  if (p.missiles <= 0 || bullets.length >= POOL_MAX_BULLETS) return;
  p.missiles--;

  // Find nearest enemy
  let target = null;
  let minDist = Infinity;
  for (const e of enemies) {
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d < minDist) { minDist = d; target = e; }
  }

  bullets.push({
    x: p.x, y: p.y - p.h / 2,
    vx: 0, vy: -6, w: 5, h: 16,
    damage: 8, isMissile: true,
    target, turnRate: 0.08, speed: 7
  });
  playMissileSound();
}

// Helper to find the nearest alive player to an enemy (for AI targeting)
function nearestAlivePlayer(ex, ey) {
  let best = null;
  let bestDist = Infinity;
  if (player.alive) {
    const d = Math.hypot(player.x - ex, player.y - ey);
    if (d < bestDist) { bestDist = d; best = player; }
  }
  if (player2.alive) {
    const d = Math.hypot(player2.x - ex, player2.y - ey);
    if (d < bestDist) { bestDist = d; best = player2; }
  }
  return best || player; // fallback to player1 position even if dead
}
