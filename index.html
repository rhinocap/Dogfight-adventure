  if (e.button === 2 && gameState === STATE.PLAYING) fireMissileFor(player);

// ─── Audio ──────────────────────────────────────────────────────
let audioCtx = null, masterGain = null;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain(); masterGain.gain.value = 0.3; masterGain.connect(audioCtx.destination);
}
function playGunSound() {
  if (!audioCtx) return;
  const n = audioCtx.sampleRate * 0.04, buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(n*0.15));
  const s=audioCtx.createBufferSource(); s.buffer=buf;
  const g=audioCtx.createGain(); g.gain.value=0.06;
  const f=audioCtx.createBiquadFilter(); f.type='highpass'; f.frequency.value=800;
  s.connect(f); f.connect(g); g.connect(masterGain); s.start();
}
function playMissileSound() {
  if (!audioCtx) return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type='sawtooth';
  o.frequency.setValueAtTime(200,audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(800,audioCtx.currentTime+0.3);
  g.gain.setValueAtTime(0.1,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.4);
  const f=audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=400; f.Q.value=2;
  o.connect(f); f.connect(g); g.connect(masterGain); o.start(); o.stop(audioCtx.currentTime+0.4);
}
function playExplosionSound(big) {
  if (!audioCtx) return;
  const dur=big?0.8:0.4, n=audioCtx.sampleRate*dur, buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(n*0.3));
  const s=audioCtx.createBufferSource(); s.buffer=buf;
  const g=audioCtx.createGain(); g.gain.value=big?0.2:0.12;
  const f=audioCtx.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(big?600:900,audioCtx.currentTime); f.frequency.exponentialRampToValueAtTime(100,audioCtx.currentTime+dur);
  s.connect(f); f.connect(g); g.connect(masterGain); s.start();
  const o=audioCtx.createOscillator(),og=audioCtx.createGain(); o.type='sine';
  o.frequency.setValueAtTime(80,audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(20,audioCtx.currentTime+dur);
  og.gain.setValueAtTime(big?0.25:0.12,audioCtx.currentTime); og.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(og); og.connect(masterGain); o.start(); o.stop(audioCtx.currentTime+dur);
}
function playPowerupSound() {
  if (!audioCtx) return;
  [523,659,784,1047].forEach((freq,i) => {
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0,audioCtx.currentTime+i*0.06);
    g.gain.linearRampToValueAtTime(0.08,audioCtx.currentTime+i*0.06+0.02);

    o.connect(g); g.connect(masterGain); o.start(audioCtx.currentTime+i*0.06); o.stop(audioCtx.currentTime+i*0.06+0.15);
  });
}

}
function playBossWarning() {

  const t=audioCtx.currentTime+i*0.25; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.1,t+0.05);
  g.gain.setValueAtTime(0.1,t+0.15); g.gain.linearRampToValueAtTime(0,t+0.25);
  o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+0.25);}
}
function playBarrelRollSound() {
  if (!audioCtx) return;
  const n=audioCtx.sampleRate*0.35, buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=audioCtx.createBufferSource(); s.buffer=buf;
  const f=audioCtx.createBiquadFilter(); f.type='bandpass';
  f.frequency.setValueAtTime(400,audioCtx.currentTime); f.frequency.exponentialRampToValueAtTime(2000,audioCtx.currentTime+0.15);
  f.frequency.exponentialRampToValueAtTime(300,audioCtx.currentTime+0.35); f.Q.value=3;
  const g=audioCtx.createGain(); g.gain.setValueAtTime(0.15,audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0.08,audioCtx.currentTime+0.2); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.35);
  s.connect(f); f.connect(g); g.connect(masterGain); s.start(); s.stop(audioCtx.currentTime+0.35);
}
function playTakeoffSound() {
  if (!audioCtx) return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter(); o.type='sawtooth';
  o.frequency.setValueAtTime(80,audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(300,audioCtx.currentTime+1.3);
  o.frequency.exponentialRampToValueAtTime(500,audioCtx.currentTime+3.5); o.frequency.exponentialRampToValueAtTime(200,audioCtx.currentTime+5.5);
  f.type='lowpass'; f.frequency.setValueAtTime(200,audioCtx.currentTime); f.frequency.exponentialRampToValueAtTime(2000,audioCtx.currentTime+3.5);
  f.frequency.exponentialRampToValueAtTime(400,audioCtx.currentTime+5.5);
  g.gain.setValueAtTime(0.01,audioCtx.currentTime); g.gain.linearRampToValueAtTime(0.06,audioCtx.currentTime+1.3);
  g.gain.linearRampToValueAtTime(0.09,audioCtx.currentTime+3.5); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+5.5);
  o.connect(f); f.connect(g); g.connect(masterGain); o.start(); o.stop(audioCtx.currentTime+5.5);
}
function playNightTransitionSound() {

  g.gain.setValueAtTime(0.1,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1.5);
  o.connect(g); g.connect(masterGain); o.start(); o.stop(audioCtx.currentTime+1.5);
}
function playDawnTransitionSound() {
  if (!audioCtx) return;
  [262,330,392,523].forEach((freq,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type='sine'; o.frequency.value=freq;
  const t=audioCtx.currentTime+i*0.15; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.08,t+0.05);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.4); o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+0.4);});
}
let engineOsc = null;
function startEngineHum() {
  if (!audioCtx||engineOsc) return; engineOsc=audioCtx.createOscillator();
  const g=audioCtx.createGain(),f=audioCtx.createBiquadFilter(); engineOsc.type='sawtooth'; engineOsc.frequency.value=55;
  f.type='lowpass'; f.frequency.value=120; g.gain.value=0.03;
  engineOsc.connect(f); f.connect(g); g.connect(masterGain); engineOsc.start();
}

// ─── Barrel Roll ────────────────────────────────────────────────
const BARREL_ROLL_DURATION = 24, BARREL_ROLL_COOLDOWN = 40;
function startBarrelRollFor(p, dir) {
  if (p.barrelRollCooldown > 0) return;
  p.barrelRollTimer=BARREL_ROLL_DURATION; p.barrelRollDir=dir; p.barrelRollAngle=0;
  p.barrelRollCooldown=BARREL_ROLL_DURATION+BARREL_ROLL_COOLDOWN;
  p.invulnTimer=Math.max(p.invulnTimer,BARREL_ROLL_DURATION); playBarrelRollSound();
}
function updateBarrelRollFor(p) {
  if (p.barrelRollCooldown>0) p.barrelRollCooldown--;
  if (p.barrelRollTimer>0) { p.barrelRollTimer--; p.barrelRollAngle=p.barrelRollDir*(1-p.barrelRollTimer/BARREL_ROLL_DURATION)*TAU; }
  else p.barrelRollAngle=0;
}

// ─── Procedural noise for terrain ───────────────────────────────
function hash2(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function smoothNoise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
const a=hash2(ix,iy),b=hash2(ix+1,iy),c=hash2(ix,iy+1),d=hash2(ix+1,iy+1);
return a+(b-a)*sx+(c-a)*sy+(d-a-c-b+a+b)*sx*sy;}
function fbm(x,y,oct){let v=0,amp=1,freq=1,max=0;
for(let i=0;i<oct;i++){v+=smoothNoise(x*freq,y*freq)*amp;max+=amp;amp*=0.5;freq*=2;}return v/max;}

// ─── 3D Scene ───────────────────────────────────────────────────
scene.fog = new THREE.FogExp2(0x9bb8d4, 0.00006);

// Lighting — hemisphere for natural sky/ground fill + directional sun
const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3a6a2a, 0.6);
scene.add(hemiLight);
const ambientLight = new THREE.AmbientLight(0x8899aa, 0.3); scene.add(ambientLight);
const sunLight = new THREE.DirectionalLight(0xfff5e0, 2.0);
sunLight.position.set(500, 800, 300); sunLight.castShadow = true;
sunLight.shadow.mapSize.set(4096,4096);
sunLight.shadow.bias = -0.0002;
sunLight.shadow.normalBias = 0.02;
const sc=sunLight.shadow.camera; sc.near=10;sc.far=5000;sc.left=-2000;sc.right=2000;sc.top=2000;sc.bottom=-2000;
scene.add(sunLight);

// Sky — Rayleigh scattering with Mie for sun glow, stars at night
const skyMat = new THREE.ShaderMaterial({
  uniforms:{nightBlend:{value:0},sunPosition:{value:new THREE.Vector3(500,800,300)}},
  vertexShader:`varying vec3 vWP;varying vec3 vPos;void main(){vWP=(modelMatrix*vec4(position,1.0)).xyz;vPos=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
  uniform float nightBlend;uniform vec3 sunPosition;varying vec3 vWP;varying vec3 vPos;
  float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
  void main(){
    vec3 dir=normalize(vWP);float y=dir.y;
    // Rayleigh sky
    vec3 betaR=vec3(5.5e-6,13.0e-6,22.4e-6);
    float zenith=max(y,0.01);
    vec3 dayTop=vec3(0.05,0.2,0.55);vec3 dayHorizon=vec3(0.6,0.75,0.92);
    vec3 day=mix(dayHorizon,dayTop,pow(max(y,0.),0.4));
    // Sun glow (Mie)
    vec3 sd=normalize(sunPosition);float cosA=max(dot(dir,sd),0.);
    float mie=pow(cosA,256.)*3.0+pow(cosA,32.)*.5+pow(cosA,8.)*.15;
    day+=vec3(1.,.92,.7)*mie*(1.-nightBlend);
    // Sunset horizon glow
    float haze=pow(1.-abs(y),6.);
    vec3 sunsetCol=mix(vec3(.95,.55,.25),vec3(.85,.35,.15),haze);
    float sunsetFactor=pow(max(dot(normalize(vec3(sd.x,0.,sd.z)),normalize(vec3(dir.x,0.,dir.z))),0.),4.)*haze;
    day=mix(day,sunsetCol,sunsetFactor*0.4*(1.-nightBlend));
    // Horizon haze
    day=mix(day,vec3(.78,.85,.95),haze*0.35);
    // Night
    vec3 nightTop=vec3(0.01,0.02,0.06);vec3 nightHorizon=vec3(0.04,0.05,0.12);
    vec3 night=mix(nightHorizon,nightTop,pow(max(y,0.),0.3));
    // Stars
    vec3 sp=normalize(vPos)*300.;float star=hash(floor(sp));
    star=step(0.998,star)*pow(hash(floor(sp*1.1)),8.);
    night+=vec3(star)*nightBlend;
    vec3 c=mix(day,night,nightBlend);
    gl_FragColor=vec4(c,1.);}`,
  side:THREE.BackSide,depthWrite:false
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(15000,64,32),skyMat));

// Ground — terrain with procedural vertex displacement and vertex colors
const groundGeo=new THREE.PlaneGeometry(30000,30000,256,256);
groundGeo.rotateX(-PI/2);
const gPos=groundGeo.attributes.position;
const gColors=new Float32Array(gPos.count*3);
for(let i=0;i<gPos.count;i++){
  const x=gPos.getX(i),z=gPos.getZ(i);
  // Terrain height from fbm noise
  const nx=x*0.0003,nz=z*0.0003;
  let h=fbm(nx,nz,6)*120-20;
  // Flatten near runway
  const rwDist=Math.abs(x);const rwZDist=Math.abs(z);
  const rwFlatten=Math.max(0,1-rwDist/200)*Math.max(0,1-Math.max(0,rwZDist-1200)/300);
  h*=(1-rwFlatten);
  if(h<-5&&rwFlatten<0.3)h=Math.max(h,-8); // subtle water basins
  gPos.setY(i,h);
  // Vertex color — vary grass tone
  const gv=fbm(nx*3+10,nz*3+10,3);
  const darkGrass=[0.18,0.35,0.12],lightGrass=[0.32,0.52,0.18],dirtTone=[0.35,0.28,0.15];
  let r,g,b;
  if(h<-3){r=0.15;g=0.25;b=0.35;} // water-ish low areas
  else if(h>60){const t=Math.min(1,(h-60)/40);r=0.35+t*0.3;g=0.3+t*0.3;b=0.25+t*0.3;} // rocky high areas
  else{const t=gv;r=darkGrass[0]+(lightGrass[0]-darkGrass[0])*t;g=darkGrass[1]+(lightGrass[1]-darkGrass[1])*t;b=darkGrass[2]+(lightGrass[2]-darkGrass[2])*t;
  // Dirt patches
  const dirt=fbm(nx*8+50,nz*8+50,2);if(dirt>0.6){const dt=(dirt-0.6)*2.5;r+=(dirtTone[0]-r)*dt;g+=(dirtTone[1]-g)*dt;b+=(dirtTone[2]-b)*dt;}}
  gColors[i*3]=r;gColors[i*3+1]=g;gColors[i*3+2]=b;
}
groundGeo.setAttribute('color',new THREE.BufferAttribute(gColors,3));
groundGeo.computeVertexNormals();
const ground=new THREE.Mesh(groundGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.9,metalness:0.0}));
ground.receiveShadow=true;scene.add(ground);

// Water plane
const waterGeo=new THREE.PlaneGeometry(30000,30000);
waterGeo.rotateX(-PI/2);
const waterMat=new THREE.MeshStandardMaterial({color:0x1a5276,roughness:0.15,metalness:0.3,transparent:true,opacity:0.7});
const water=new THREE.Mesh(waterGeo,waterMat);water.position.y=-4;water.receiveShadow=true;scene.add(water);

// Runway — concrete with PBR
const rwMat=new THREE.MeshStandardMaterial({color:0x555555,roughness:0.85,metalness:0.05});
const rwMesh=new THREE.Mesh(new THREE.PlaneGeometry(40,2000),rwMat);
rwMesh.rotation.x=-PI/2; rwMesh.position.y=0.15; rwMesh.receiveShadow=true; scene.add(rwMesh);
// Runway shoulder (lighter concrete)
const rwShoulderMat=new THREE.MeshStandardMaterial({color:0x666666,roughness:0.9,metalness:0.02});
for(let s=-1;s<=1;s+=2){const sh=new THREE.Mesh(new THREE.PlaneGeometry(12,2000),rwShoulderMat);sh.rotation.x=-PI/2;sh.position.set(s*26,0.12,0);sh.receiveShadow=true;scene.add(sh);}

// ─── Jet Model — smooth, PBR ───────────────────────────────────
function createJetModel(color) {
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color,roughness:0.25,metalness:0.7});
  const dk=new THREE.MeshStandardMaterial({color:new THREE.Color(color).multiplyScalar(0.5),roughness:0.35,metalness:0.6});
  const gl=new THREE.MeshStandardMaterial({color:0x88ccee,transparent:true,opacity:0.6,roughness:0.05,metalness:0.9});
  // Fuselage — smooth cylinder
  const f=new THREE.Mesh(new THREE.CylinderGeometry(1.2,2,14,24),mat);f.rotation.x=PI/2;g.add(f);
  // Nose cone
  const n=new THREE.Mesh(new THREE.ConeGeometry(1.2,6,24),dk);n.rotation.x=-PI/2;n.position.z=-10;g.add(n);
  // Canopy
  const c=new THREE.Mesh(new THREE.SphereGeometry(1.3,16,12,0,TAU,0,PI/2),gl);c.position.set(0,1.2,-4);c.scale.set(1,0.6,1.5);g.add(c);
  // Wings — beveled extrude
  const ws=new THREE.Shape();ws.moveTo(0,0);ws.lineTo(9,2);ws.lineTo(7,4.5);ws.lineTo(0,2.2);
  const wg=new THREE.ExtrudeGeometry(ws,{depth:0.35,bevelEnabled:true,bevelThickness:0.1,bevelSize:0.1,bevelSegments:3});
  const wl=new THREE.Mesh(wg,mat);wl.position.set(1,-0.2,-1);wl.rotation.y=PI/2;wl.rotation.x=-0.05;g.add(wl);
  const wr=wl.clone();wr.position.set(-1,-0.2,-1);wr.scale.x=-1;g.add(wr);
  // Tail fin
  const ts=new THREE.Shape();ts.moveTo(0,0);ts.lineTo(0,4.5);ts.lineTo(1.8,1);ts.lineTo(1.8,0);
  const tg2=new THREE.ExtrudeGeometry(ts,{depth:0.25,bevelEnabled:true,bevelThickness:0.08,bevelSize:0.08,bevelSegments:2});
  const t=new THREE.Mesh(tg2,dk);t.position.set(-0.1,1,5);g.add(t);
  // Horizontal stabilizers
  const ss=new THREE.Shape();ss.moveTo(0,0);ss.lineTo(4.5,0.5);ss.lineTo(3.5,1.8);ss.lineTo(0,1.2);
  const sg=new THREE.ExtrudeGeometry(ss,{depth:0.18,bevelEnabled:true,bevelThickness:0.06,bevelSize:0.06,bevelSegments:2});
  const sl=new THREE.Mesh(sg,mat);sl.position.set(0.5,0,5);sl.rotation.x=-0.1;g.add(sl);
  const sr=sl.clone();sr.position.set(-0.5,0,5);sr.scale.x=-1;g.add(sr);
  // Engine nozzles — detailed
  const nzMat=new THREE.MeshStandardMaterial({color:0x222222,roughness:0.3,metalness:0.9});
  const nzInner=new THREE.MeshStandardMaterial({color:0x444444,roughness:0.2,metalness:0.8,emissive:0x331100,emissiveIntensity:0.3});
  for(let s=-1;s<=1;s+=2){
    const outer=new THREE.Mesh(new THREE.CylinderGeometry(0.85,1.1,2.5,16),nzMat);outer.rotation.x=PI/2;outer.position.set(s*1.5,0,7.5);g.add(outer);
    const inner=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.8,1,16),nzInner);inner.rotation.x=PI/2;inner.position.set(s*1.5,0,8.2);g.add(inner);
  }
  // Intake scoops
  const intakeMat=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.2,metalness:0.8});
  for(let s=-1;s<=1;s+=2){
    const intake=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.9,3,16),intakeMat);intake.rotation.x=PI/2;intake.position.set(s*2.2,-0.3,-2);g.add(intake);
  }
  g.traverse(ch=>{if(ch.isMesh){ch.castShadow=true;ch.receiveShadow=true;}});
  return g;
}
function createEnemyJetModel(type) {
  let color,scale;
  switch(type){case'scout':color=0x8b2020;scale=0.7;break;case'fighter':color=0x701818;scale=0.9;break;
  case'bomber':color=0x3a3a3a;scale=1.4;break;case'ace':color=0x4a1a6a;scale=0.85;break;
  case'zombie':color=0x2a4a2a;scale=0.9;break;case'megabomber':color=0x4a5a6a;scale=2.5;break;
  case'boss':color=0x440000;scale=2.0;break;default:color=0x880000;scale=1.0;}
  const m=createJetModel(color);m.scale.setScalar(scale);return m;
}

const MAX_P=3000;
const pPos=new Float32Array(MAX_P*3),pCol=new Float32Array(MAX_P*3),pSiz=new Float32Array(MAX_P);
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
pGeo.setAttribute('size',new THREE.BufferAttribute(pSiz,1));
scene.add(new THREE.Points(pGeo,new THREE.PointsMaterial({size:4,vertexColors:true,transparent:true,opacity:0.85,depthWrite:false,sizeAttenuation:true})));
const pPool=[];
function spawnP(x,y,z,vx,vy,vz,r,g,b,sz,life){if(pPool.length>=MAX_P)return;pPool.push({x,y,z,vx,vy,vz,r,g,b,size:sz,life,maxLife:life});}
function updateP(){
  for(let i=pPool.length-1;i>=0;i--){const p=pPool[i];p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;p.vx*=.97;p.vy*=.97;p.vz*=.97;p.life--;if(p.life<=0)pPool.splice(i,1);}
  for(let i=0;i<MAX_P;i++){if(i<pPool.length){const p=pPool[i],a=p.life/p.maxLife;
  pPos[i*3]=p.x;pPos[i*3+1]=p.y;pPos[i*3+2]=p.z;pCol[i*3]=p.r*a;pCol[i*3+1]=p.g*a;pCol[i*3+2]=p.b*a;pSiz[i]=p.size*a;}
  else{pPos[i*3+1]=-10000;pSiz[i]=0;}}
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;pGeo.attributes.size.needsUpdate=true;
}
function explode3D(x,y,z,size){
  playExplosionSound(size>30); shakeAmount=Math.min(shakeAmount+size*0.3,20);
  for(let i=0;i<size*2;i++){const a=Math.random()*TAU,el=(Math.random()-.5)*PI,sp=.5+Math.random()*size*0.06;
  const cs=[[1,.4,.13],[1,.27,0],[1,.67,0],[1,.87,.27],[1,.13,0],[1,1,.8]],c=cs[Math.floor(Math.random()*cs.length)];
  spawnP(x,y,z,Math.cos(a)*Math.cos(el)*sp,Math.sin(el)*sp,Math.sin(a)*Math.cos(el)*sp,c[0],c[1],c[2],3+Math.random()*size*0.12,25+Math.random()*35);}
}

function startWave(n){wave=n;

  else{waveEnemiesLeft=Math.min(4+Math.floor(n*1.5),25);gameState=STATE.WAVE_INTRO;introTimer=120;}
  waveSpawnTimer=0;
}
function spawnWaveEnemy(){if(waveEnemiesLeft<=0)return;waveEnemiesLeft--;
  if(wave%5===0){spawnEnemy('boss');return;}
  const r=Math.random();let t;
  if(wave<3)t=r<.5?'scout':'fighter';
  else if(wave<6)t=r<.3?'scout':r<.6?'fighter':r<.8?'bomber':'ace';
  else t=r<.2?'scout':r<.45?'fighter':r<.7?'bomber':'ace';
  spawnEnemy(t);
}
function spawnEnemy(type){
  const e={type,position:new THREE.Vector3(),velocity:new THREE.Vector3(),hp:0,maxHp:0,

    case'zombie':e.hp=e.maxHp=3+Math.floor(wave*.3);e.fireRate=9999;e.scoreValue=150;e.radius=8;e.position.set(sx,100+Math.random()*300,sz);break;

function firePlayerBullet(){
  if(bullets.length>=200)return;
  const dir=new THREE.Vector3(0,0,-1); dir.applyEuler(new THREE.Euler(player.pitch,player.yaw,0,'YXZ'));
  const spread=rapidFireTimer>0?0.02:0, count=rapidFireTimer>0?3:2;
  for(let i=0;i<count;i++){
    const off=new THREE.Vector3((i-1)*2,0,0); off.applyEuler(new THREE.Euler(0,player.yaw,0,'YXZ'));
    const bd=dir.clone(); bd.x+=(Math.random()-.5)*spread; bd.y+=(Math.random()-.5)*spread; bd.normalize();
    const mesh=new THREE.Mesh(bGeo,bMat); const pos=player.position.clone().add(off);
    mesh.position.copy(pos); scene.add(mesh);
    bullets.push({position:pos,velocity:bd.multiplyScalar(15),damage:1,isMissile:false,mesh,life:180});
  }
  playGunSound();
}
function fireMissileFor(p){
  if(p.missiles<=0||bullets.length>=200)return; p.missiles--;
  let target=null,minD=Infinity;
  for(const e of enemies){const d=e.position.distanceTo(p.position);if(d<minD){minD=d;target=e;}}
  const dir=new THREE.Vector3(0,0,-1); dir.applyEuler(new THREE.Euler(p.pitch,p.yaw,0,'YXZ'));
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(.3,.5,3,12),mMat2); mesh.rotation.x=PI/2;
  const pos=p.position.clone(); mesh.position.copy(pos); scene.add(mesh);
  bullets.push({position:pos,velocity:dir.multiplyScalar(8),damage:8,isMissile:true,target,turnRate:.06,speed:10,mesh,life:300});
  playMissileSound();
}

function damagePlayer(amt){
  if(player.shield>0){player.shield--;spawnFT('BLOCKED','#44ddff',60);return;}
  player.hp-=amt; shakeAmount=Math.min(shakeAmount+5,15); player.invulnTimer=15;
  explode3D(player.position.x,player.position.y,player.position.z,8);
  if(player.hp<=0){player.alive=false;explode3D(player.position.x,player.position.y,player.position.z,50);

  setTimeout(()=>{if(gameState===STATE.PLAYING){if(score>highScore){highScore=score;localStorage.setItem('dogfight_highscore',String(highScore));}gameState=STATE.GAMEOVER;}},3000);}

function maybeDropPowerup(pos){
  if(Math.random()>.25)return;
  const types=['health','rapidfire','missile','shield','multiplier'],w=[.3,.2,.25,.15,.1];
  let r=Math.random(),type,cum=0;
  for(let i=0;i<types.length;i++){cum+=w[i];if(r<cum){type=types[i];break;}} if(!type)type='health';
  const mesh=createPowerupModel(type); mesh.position.copy(pos); scene.add(mesh);
  powerups.push({position:pos.clone(),type,mesh,life:600,age:0});
}

function updateTakeoff(){
  takeoffTimer++;gameTime++;
  if(takeoffPhase===0){takeoffSpeed=0;shakeAmount=Math.min(takeoffTimer*.04,2.5);player.afterburner=takeoffTimer/80;
  camera.position.set(0,8,895);camera.rotation.set(0,PI,0);if(takeoffTimer>=80){takeoffPhase=1;takeoffTimer=0;}}
  else if(takeoffPhase===1){const t=takeoffTimer/120;takeoffSpeed=t*t*6;player.position.z-=takeoffSpeed;shakeAmount=2.5-t*1.5;
  player.afterburner=.8+t*.2;camera.position.set(0,8,player.position.z-5);camera.rotation.set(0,PI,0);
  if(takeoffTimer>=120){takeoffPhase=2;takeoffTimer=0;}}
  else if(takeoffPhase===2){const t=takeoffTimer/60;takeoffSpeed=6+t*2;player.position.z-=takeoffSpeed;player.position.y+=t*3;
  player.afterburner=1;shakeAmount=Math.max(0,1-t*2);camera.position.set(0,player.position.y+3,player.position.z-5);
  camera.rotation.set(-t*.15,PI,0);if(takeoffTimer>=60){takeoffPhase=3;takeoffTimer=0;}}
  else if(takeoffPhase===3){const t=takeoffTimer/90;takeoffSpeed=8-t*4;player.position.z-=takeoffSpeed;
  player.position.y+=(300-player.position.y)*.03;player.afterburner=1-t*.6;
  camera.position.set(0,player.position.y+3,player.position.z-5);camera.rotation.x+=(0-camera.rotation.x)*.05;camera.rotation.y=PI;
  if(takeoffTimer>=90){player.yaw=PI;player.pitch=0;gameState=STATE.WAVE_INTRO;introTimer=120;startWave(1);shakeAmount=0;canvas3d.requestPointerLock();}}
  if(player.afterburner>.3)for(let i=0;i<3;i++)spawnP(player.position.x+(Math.random()-.5)*3,player.position.y-1,player.position.z+5,
  (Math.random()-.5)*.3,-.2,.5+Math.random()*.5,1,.5,.1,2+Math.random()*2,15+Math.random()*10);
}

// ─── Main Update ────────────────────────────────────────────────
function update(){
  gameTime++;
  if(shakeAmount>.5)shakeAmount*=shakeDecay;else shakeAmount=0;
  for(const c of cloudGroup.children){c.position.x+=c.userData.speed*.02;if(c.position.x>6000)c.position.x=-6000;}
  if(gameState===STATE.TAKEOFF){updateTakeoff();updateP();return;}
  if(comboTimer>0){comboTimer--;if(comboTimer<=0)comboCount=0;}
  if(multiplierTimer>0){multiplierTimer--;if(multiplierTimer<=0)scoreMultiplier=1;}
  if(rapidFireTimer>0)rapidFireTimer--;
  if(gameState===STATE.WAVE_INTRO||gameState===STATE.BOSS_INTRO){introTimer--;if(introTimer<=0){gameState=STATE.PLAYING;if(!isNightMode)roundTimer=1200;}}

  // Day/Night
  if(gameState===STATE.PLAYING){roundTimer--;nightBlend+=((isNightMode?1:0)-nightBlend)*.04;
  if(nightAnnouncementTimer>0)nightAnnouncementTimer--;
  if(roundTimer<=0){if(!isNightMode){if(wave%5===0||wave<4)roundTimer=1200;else{
  for(let i=enemies.length-1;i>=0;i--){if(enemies[i].type!=='boss'){explode3D(enemies[i].position.x,enemies[i].position.y,enemies[i].position.z,10);scene.remove(enemies[i].model);enemies.splice(i,1);}}
  isNightMode=true;roundTimer=1200;waveEnemiesLeft=0;nightAnnouncementTimer=120;nightAnnouncementText='NIGHT FALLS...';nightAnnouncementColor='#44ff44';shakeAmount=8;playNightTransitionSound();}}
  else{
  isNightMode=false;roundTimer=1200;nightAnnouncementTimer=120;nightAnnouncementText='DAWN BREAKS...';nightAnnouncementColor='#ffdd44';playDawnTransitionSound();startWave(wave+1);}}
}
  else nightBlend+=((isNightMode?1:0)-nightBlend)*.04;

  skyMat.uniforms.nightBlend.value=nightBlend;
  hemiLight.intensity=0.6*(1-nightBlend*0.7);
  ambientLight.intensity=.3+(.08-.3)*nightBlend;
  ambientLight.color.setHex(nightBlend>.5?0x223344:0x8899aa);
  sunLight.intensity=2.0*(1-nightBlend*.85);
  const fc=new THREE.Color().lerpColors(new THREE.Color(0x9bb8d4),new THREE.Color(0x0a1228),nightBlend);
  scene.fog.color=fc; renderer.setClearColor(fc);
  // Water color shift
  waterMat.color.lerpColors(new THREE.Color(0x1a5276),new THREE.Color(0x0a1a2a),nightBlend);

  // Player
  if(player.alive){updateBarrelRollFor(player);
  player.yaw-=mouseDX*.002; player.pitch-=mouseDY*.002;
  player.pitch=Math.max(-PI/2.5,Math.min(PI/2.5,player.pitch)); mouseDX=0;mouseDY=0;
  let ti=0;if(keys['KeyW'])ti=1;if(keys['KeyS'])ti=-1;player.throttle+=(ti-player.throttle)*.05;
  let ri=0;if(keys['KeyA'])ri=-1;if(keys['KeyD'])ri=1;player.roll+=(ri*.8-player.roll)*.08;
  const fwd=new THREE.Vector3(0,0,-1);fwd.applyEuler(new THREE.Euler(player.pitch,player.yaw,0,'YXZ'));
  const cs=player.speed*(.5+player.throttle*.5)*.016;
  player.afterburner=.3+player.throttle*.7; player.velocity.copy(fwd.multiplyScalar(cs));
  if(player.position.y>10)player.velocity.y-=.02;
  player.position.add(player.velocity);
  if(player.position.y<10){player.position.y=10;if(player.velocity.y<0)player.velocity.y=0;}
  if(player.position.y>2000)player.position.y=2000;
  camera.position.copy(player.position);camera.rotation.set(player.pitch,player.yaw,player.roll+player.barrelRollAngle,'YXZ');
  if(shakeAmount>.5){camera.position.x+=(Math.random()-.5)*shakeAmount*.3;camera.position.y+=(Math.random()-.5)*shakeAmount*.3;}
  if(gameTime%2===0&&player.afterburner>.3){const bk=new THREE.Vector3(0,0,1);bk.applyEuler(new THREE.Euler(player.pitch,player.yaw,0,'YXZ'));
  spawnP(player.position.x+bk.x*8,player.position.y+bk.y*8-1,player.position.z+bk.z*8,bk.x*.5+(Math.random()-.5)*.2,bk.y*.5-.1,bk.z*.5+(Math.random()-.5)*.2,1,.5,.1,2,15);}
  if(player.fireTimer>0)player.fireTimer--;
  const rate=rapidFireTimer>0?Math.max(3,player.fireRate-4):player.fireRate;
  if(mouseDown&&player.fireTimer<=0){firePlayerBullet();player.fireTimer=rate;}
  if(player.invulnTimer>0)player.invulnTimer--;}
  else{if(player.respawnTimer>0){player.respawnTimer--;if(player.respawnTimer<=0){respawnPlayer();spawnFT('RESPAWNED!','#44ff44',60);}}}

  // Bullets
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.life--;
  if(b.isMissile&&b.target&&b.target.hp>0){const d=b.target.position.clone().sub(b.position).normalize();
  const c=b.velocity.clone().normalize();c.lerp(d,b.turnRate);c.normalize();b.velocity.copy(c.multiplyScalar(b.speed));
  spawnP(b.position.x,b.position.y,b.position.z,(Math.random()-.5)*.3,(Math.random()-.5)*.3,(Math.random()-.5)*.3,1,.67,0,1.5,10);}
  b.position.add(b.velocity);b.mesh.position.copy(b.position);
  if(b.life<=0){scene.remove(b.mesh);bullets.splice(i,1);}}

  for(let i=enemyBullets.length-1;i>=0;i--){const b=enemyBullets[i];b.life--;
  if(b.isHoming&&player.alive){const d=player.position.clone().sub(b.position).normalize();
  const c=b.velocity.clone().normalize();c.lerp(d,b.turnRate);c.normalize();b.velocity.copy(c.multiplyScalar(b.speed));}
  b.position.add(b.velocity);b.mesh.position.copy(b.position);
  if(b.life<=0||b.position.y<0){scene.remove(b.mesh);enemyBullets.splice(i,1);}}

  // Enemy AI
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.age++;
  const toP=player.position.clone().sub(e.position),dP=toP.length();
  switch(e.type){
    case'scout':e.velocity.x=Math.sin(e.age*.03+e.phase)*2;e.velocity.z=Math.cos(e.age*.02+e.phase)*2;
    if(dP>200)e.velocity.add(toP.normalize().multiplyScalar(.5));e.fireTimer--;
    if(e.fireTimer<=0&&dP<800){fireEnemyBullet3D(e,player.position);e.fireTimer=e.fireRate;}break;
    case'fighter':e.velocity.x+=Math.sin(e.age*.02+e.phase)*.1;e.velocity.z+=Math.cos(e.age*.015+e.phase)*.1;
    if(dP>150)e.velocity.add(toP.normalize().multiplyScalar(.8));e.velocity.multiplyScalar(.95);e.fireTimer--;
    if(e.fireTimer<=0&&dP<700){for(let b=0;b<3;b++)setTimeout(()=>{if(e.hp>0)fireEnemyBullet3D(e,player.position);},b*80);e.fireTimer=e.fireRate;}break;
    case'bomber':e.velocity.x+=Math.sin(e.age*.01+e.phase)*.05;e.velocity.z+=Math.cos(e.age*.008+e.phase)*.05;
    if(dP>300)e.velocity.add(toP.normalize().multiplyScalar(.3));e.velocity.multiplyScalar(.97);e.fireTimer--;
    if(e.fireTimer<=0&&dP<900){for(let a=-2;a<=2;a++)fireEnemyBullet3D(e,player.position.clone().add(new THREE.Vector3(a*30,0,a*30)));e.fireTimer=e.fireRate;}break;
    case'ace':{let dv=new THREE.Vector3();for(const b of bullets)if(b.position.distanceTo(e.position)<60)dv.add(e.position.clone().sub(b.position).normalize().multiplyScalar(2));
    e.velocity.add(dv.multiplyScalar(.3));if(dP>100)e.velocity.add(toP.normalize());
    e.velocity.x+=Math.sin(e.age*.04+e.phase)*.3;e.velocity.z+=Math.cos(e.age*.03+e.phase)*.3;e.velocity.multiplyScalar(.95);e.fireTimer--;
    if(e.fireTimer<=0&&dP<800){fireHomingMissile3D(e);e.fireTimer=e.fireRate;}break;}
    case'megabomber':case'boss':{e.bossTimer=(e.bossTimer||0)+1;const oa=e.bossTimer*.005+e.phase,od=e.type==='boss'?400:500;
    const tp=new THREE.Vector3(player.position.x+Math.cos(oa)*od,player.position.y+50+Math.sin(oa*.5)*50,player.position.z+Math.sin(oa)*od);
    e.velocity.add(tp.sub(e.position).multiplyScalar(.01));e.velocity.multiplyScalar(.95);
    const ph=Math.floor(e.bossTimer/180)%3;
    if(ph===0&&e.bossTimer%15===0)for(let a=-3;a<=3;a++)fireEnemyBullet3D(e,player.position.clone().add(new THREE.Vector3(a*20,0,a*20)));
    else if(ph===1&&e.bossTimer%8===0)fireEnemyBullet3D(e,player.position);
    else if(ph===2&&e.bossTimer%40===0)for(let a=0;a<8;a++){const ag=a*TAU/8+e.bossTimer*.01;fireEnemyBullet3D(e,e.position.clone().add(new THREE.Vector3(Math.cos(ag)*100,0,Math.sin(ag)*100)));}
    if(e.bossTimer%90===0)fireHomingMissile3D(e);break;}
  }
  e.position.add(e.velocity);if(e.position.y<20)e.position.y=20;
  e.model.position.copy(e.position);
  if(dP>1){const lt=e.position.clone().add(e.velocity.clone().normalize());e.model.lookAt(lt);}
  if(e.position.distanceTo(player.position)>3000){scene.remove(e.model);enemies.splice(i,1);}}

  // Bullet-Enemy collisions
  for(let bi=bullets.length-1;bi>=0;bi--){const b=bullets[bi];
  for(let ei=enemies.length-1;ei>=0;ei--){const e=enemies[ei];
  if(b.position.distanceTo(e.position)<e.radius){e.hp-=b.damage;scene.remove(b.mesh);bullets.splice(bi,1);playHitSound();
  if(e.hp<=0){const pts=e.scoreValue*scoreMultiplier;score+=pts;totalKills++;killsSinceLastMegabomber++;
  if(killsSinceLastMegabomber>=10&&e.type!=='megabomber'){killsSinceLastMegabomber=0;spawnEnemy('megabomber');spawnFT('MEGA-BOMBER INCOMING!','#ff4400',90);playBossWarning();}
  comboCount++;comboTimer=90;if(comboCount>=3)spawnFT(`x${comboCount} COMBO!`,'#ffdd00',60);
  spawnFT(`+${pts}`,'#fff',40);
  explode3D(e.position.x,e.position.y,e.position.z,e.type==='boss'?60:e.type==='megabomber'?50:e.type==='bomber'?35:20);
  maybeDropPowerup(e.position);scene.remove(e.model);enemies.splice(ei,1);
  if(!isNightMode&&enemies.length===0&&waveEnemiesLeft<=0)waveTimer=120;}break;}}}

  // Enemy bullet-player
  if(player.alive&&player.invulnTimer<=0){
  for(let i=enemyBullets.length-1;i>=0;i--){const b=enemyBullets[i];
  if(b.position.distanceTo(player.position)<8){scene.remove(b.mesh);enemyBullets.splice(i,1);damagePlayer(b.isHoming?15:8);}}
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];
  if(e.position.distanceTo(player.position)<e.radius+5){damagePlayer(20);player.invulnTimer=30;
  e.hp-=5;shakeAmount=10;
  explode3D((player.position.x+e.position.x)/2,(player.position.y+e.position.y)/2,(player.position.z+e.position.z)/2,15);
  if(e.hp<=0){explode3D(e.position.x,e.position.y,e.position.z,20);totalKills++;score+=e.scoreValue;scene.remove(e.model);enemies.splice(i,1);}}}}

  // Powerups
  for(let i=powerups.length-1;i>=0;i--){const pw=powerups[i];pw.age++;pw.life--;
  pw.mesh.rotation.y+=.03;pw.mesh.position.y+=Math.sin(pw.age*.05)*.1;
  if(pw.life<=0){scene.remove(pw.mesh);powerups.splice(i,1);continue;}
  if(player.alive&&pw.position.distanceTo(player.position)<20){playPowerupSound();
  switch(pw.type){case'health':player.hp=Math.min(player.maxHp,player.hp+30);spawnFT('+30 HP','#44ff44',60);break;
  case'rapidfire':rapidFireTimer=480;spawnFT('RAPID FIRE!','#44aaff',60);break;
  case'missile':player.missiles+=3;spawnFT('+3 MISSILES','#ff4444',60);break;
  case'shield':player.shield=3;spawnFT('SHIELD x3','#44ddff',60);break;
  case'multiplier':scoreMultiplier=2;multiplierTimer=600;spawnFT('SCORE x2!','#ddaa00',60);break;}
  scene.remove(pw.mesh);powerups.splice(i,1);}}

  for(let i=floatingTexts.length-1;i>=0;i--){floatingTexts[i].life--;floatingTexts[i].y-=1;if(floatingTexts[i].life<=0)floatingTexts.splice(i,1);}
  if(gameState===STATE.PLAYING&&waveEnemiesLeft>0){waveSpawnTimer--;if(waveSpawnTimer<=0){spawnWaveEnemy();waveSpawnTimer=wave%5===0?10:30+Math.random()*40;}}
  if(gameState===STATE.PLAYING&&!isNightMode&&enemies.length===0&&waveEnemiesLeft<=0&&waveTimer>0){waveTimer--;if(waveTimer<=0)startWave(wave+1);}
  updateP();
}

// ─── HUD ────────────────────────────────────────────────────────
function worldToScreen(wp){const v=wp.clone().project(camera);if(v.z>1)return{x:W/2-v.x*W,y:H/2+v.y*H};return{x:(v.x*.5+.5)*W,y:(-v.y*.5+.5)*H};}

function drawTape(x,val,label){
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(x,H/2-80,70,160);
  ctx.strokeStyle='rgba(0,255,100,0.3)';ctx.lineWidth=1;ctx.strokeRect(x,H/2-80,70,160);
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(x,H/2-12,70,24);
  ctx.strokeStyle='#0f0';ctx.lineWidth=1.5;ctx.strokeRect(x,H/2-12,70,24);
  ctx.fillStyle='#0f0';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText(val,x+35,H/2+5);
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='9px monospace';ctx.fillText(label,x+35,H/2-68);
}
function drawCockpit(){
  ctx.fillStyle='rgba(20,20,20,0.7)';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,H*.04);ctx.quadraticCurveTo(W*.5,0,0,H*.04);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W*.03,0);ctx.lineTo(W*.02,H*.7);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W*.97,0);ctx.lineTo(W*.98,H*.7);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(40,40,40,0.4)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.02,H*.3);ctx.quadraticCurveTo(W*.5,H*.01,W*.98,H*.3);ctx.stroke();
  const dT=H*.82,dG=ctx.createLinearGradient(0,dT,0,H);dG.addColorStop(0,'rgba(28,28,28,0.9)');dG.addColorStop(1,'rgba(14,14,14,0.95)');
  ctx.fillStyle=dG;ctx.beginPath();ctx.moveTo(0,dT+20);ctx.quadraticCurveTo(W*.5,dT-5,W,dT+20);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(80,80,80,0.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,dT+20);ctx.quadraticCurveTo(W*.5,dT-5,W,dT+20);ctx.stroke();
  ctx.fillStyle='rgba(0,255,100,0.015)';ctx.fillRect(W*.1,H*.03,W*.8,H*.75);
}

function drawRadar(){
  const rr=70,rx=rr+15,ry=rr+15;
  // Background
  ctx.save();
  ctx.beginPath();ctx.arc(rx,ry,rr,0,TAU);ctx.closePath();
  ctx.fillStyle='rgba(0,10,0,0.7)';ctx.fill();
  ctx.strokeStyle='rgba(0,255,100,0.4)';ctx.lineWidth=1.5;ctx.stroke();
  // Range rings
  ctx.strokeStyle='rgba(0,255,100,0.12)';ctx.lineWidth=0.5;
  for(let i=1;i<=3;i++){ctx.beginPath();ctx.arc(rx,ry,rr*i/3,0,TAU);ctx.stroke();}
  // Cross lines
  ctx.beginPath();ctx.moveTo(rx-rr,ry);ctx.lineTo(rx+rr,ry);ctx.moveTo(rx,ry-rr);ctx.lineTo(rx,ry+rr);ctx.stroke();
  // Sweep line
  const sweep=gameTime*0.04;
  ctx.strokeStyle='rgba(0,255,100,0.25)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx+Math.cos(sweep)*rr,ry+Math.sin(sweep)*rr);ctx.stroke();
  // Sweep trail
  const sg=ctx.createConicalGradient?null:null;
  ctx.fillStyle='rgba(0,255,80,0.06)';
  ctx.beginPath();ctx.moveTo(rx,ry);ctx.arc(rx,ry,rr,sweep-0.6,sweep);ctx.closePath();ctx.fill();
  // Player dot (center)
  ctx.fillStyle='#0f0';ctx.beginPath();ctx.arc(rx,ry,2.5,0,TAU);ctx.fill();
  // Player heading indicator
  const hx=Math.sin(player.yaw),hz=-Math.cos(player.yaw);
  ctx.strokeStyle='rgba(0,255,100,0.6)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx+hx*12,ry+hz*12);ctx.stroke();
  // Enemies
  const radarRange=2000;
  ctx.beginPath();ctx.arc(rx,ry,rr,0,TAU);ctx.clip();
  for(const e of enemies){
    const dx=e.position.x-player.position.x,dz=e.position.z-player.position.z;
    const dist=Math.sqrt(dx*dx+dz*dz);
    if(dist>radarRange)continue;
    const px=rx+(dx/radarRange)*rr,py=ry+(dz/radarRange)*rr;
    const isBig=e.type==='boss'||e.type==='megabomber';
    ctx.fillStyle=isBig?'#ff2222':'#ff4444';
    const ds=isBig?3.5:2;
    ctx.beginPath();ctx.arc(px,py,ds,0,TAU);ctx.fill();
  }
  ctx.restore();
  // Label
  ctx.fillStyle='rgba(0,255,100,0.4)';ctx.font='bold 9px monospace';ctx.textAlign='center';
  ctx.fillText('RADAR',rx,ry+rr+12);
}

function drawHUD(){
  ctx.clearRect(0,0,W,H);
  if(gameState===STATE.TITLE){drawTitle();return;}
  if(gameState===STATE.GAMEOVER){drawGameOver();return;}
  if(gameState===STATE.PAUSED){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 48px monospace';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2);ctx.font='18px monospace';ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillText('Press P to resume',W/2,H/2+40);return;}
  drawCockpit();
  drawRadar();
  // Crosshair
  const cx=W/2,cy=H/2;ctx.strokeStyle='rgba(0,255,100,0.6)';ctx.lineWidth=1.5;ctx.beginPath();
  ctx.moveTo(cx-20,cy);ctx.lineTo(cx-8,cy);ctx.moveTo(cx+8,cy);ctx.lineTo(cx+20,cy);
  ctx.moveTo(cx,cy-20);ctx.lineTo(cx,cy-8);ctx.moveTo(cx,cy+8);ctx.lineTo(cx,cy+20);ctx.stroke();
  ctx.fillStyle='rgba(0,255,100,0.8)';ctx.beginPath();ctx.arc(cx,cy,2,0,TAU);ctx.fill();

  const spd=Math.round(player.velocity.length()*60),alt=Math.round(player.position.y);
  drawTape(30,spd,'KTS');drawTape(W-100,alt,'ALT FT');
  const hdg=Math.round(((player.yaw*180/PI)%360+360)%360);
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(W/2-40,15,80,24);ctx.strokeStyle='rgba(0,255,100,0.3)';ctx.lineWidth=1;ctx.strokeRect(W/2-40,15,80,24);
  ctx.fillStyle='#0f0';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.fillText(`HDG ${String(hdg).padStart(3,'0')}`,W/2,33);

  // HP
  const hp=player.hp/player.maxHp,hpW=200,hpX=W/2-hpW/2,hpY=H-60;
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(hpX-2,hpY-2,hpW+4,16);
  ctx.fillStyle=hp>.5?'#0f0':hp>.25?'#ff0':'#f00';ctx.fillRect(hpX,hpY,hpW*hp,12);
  ctx.strokeStyle='rgba(0,255,100,0.3)';ctx.strokeRect(hpX-2,hpY-2,hpW+4,16);
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText(`HP ${player.hp}/${player.maxHp}`,W/2,hpY-4);

  ctx.fillStyle='#fff';ctx.font='bold 20px monospace';ctx.textAlign='right';ctx.fillText(`${score}`,W-20,30);
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px monospace';ctx.fillText(`HI: ${highScore}`,W-20,48);
  ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.textAlign='left';ctx.fillText(`WAVE ${wave}`,20,170);
  ctx.fillStyle='#ff4444';ctx.font='14px monospace';ctx.fillText(`MSL: ${player.missiles}`,20,192);
  if(player.shield>0){ctx.fillStyle='#44ddff';ctx.fillText(`SHIELD: ${player.shield}`,20,210);}
  if(scoreMultiplier>1){ctx.fillStyle='#ddaa00';ctx.font='bold 14px monospace';ctx.fillText(`SCORE x${scoreMultiplier}`,20,228);}
  if(rapidFireTimer>0){ctx.fillStyle='#44aaff';ctx.font='14px monospace';ctx.fillText('RAPID FIRE',20,246);}
  if(comboCount>=3){ctx.fillStyle='#ffdd00';ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.fillText(`x${comboCount} COMBO`,W/2,H-90);}

  // Enemy indicators
  for(const e of enemies){const sp=worldToScreen(e.position),d=e.position.distanceTo(player.position);
  const on=sp.x>50&&sp.x<W-50&&sp.y>50&&sp.y<H-50;
  const col=(e.type==='boss'||e.type==='megabomber')?'#ff2222':'#ff4444';
  if(on){const s=Math.max(8,20-d/80);ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();
  ctx.moveTo(sp.x,sp.y-s);ctx.lineTo(sp.x+s*.7,sp.y);ctx.lineTo(sp.x,sp.y+s);ctx.lineTo(sp.x-s*.7,sp.y);ctx.closePath();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText(`${Math.round(d)}m`,sp.x,sp.y+s+12);
  if(e.type==='boss'||e.type==='megabomber'){const bw=40,hp2=e.hp/e.maxHp;ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(sp.x-bw/2,sp.y-s-10,bw,4);
  ctx.fillStyle=hp2>.5?'#0f0':hp2>.25?'#ff0':'#f00';ctx.fillRect(sp.x-bw/2,sp.y-s-10,bw*hp2,4);}}
  else{const a=Math.atan2(sp.y-H/2,sp.x-W/2),ex=W/2+Math.cos(a)*(W/2-40),ey=H/2+Math.sin(a)*(H/2-40);
  ctx.save();ctx.translate(ex,ey);ctx.rotate(a);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-5,-6);ctx.lineTo(-5,6);ctx.closePath();ctx.fill();ctx.restore();}}

  if(gameState===STATE.WAVE_INTRO){ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='bold 36px monospace';ctx.textAlign='center';ctx.fillText(`WAVE ${wave}`,W/2,H/2-60);}
  if(gameState===STATE.BOSS_INTRO){ctx.fillStyle='#ff2200';ctx.font='bold 42px monospace';ctx.textAlign='center';ctx.globalAlpha=Math.sin(gameTime*.15)>0?1:.4;ctx.fillText('WARNING',W/2,H/2-60);ctx.globalAlpha=1;ctx.font='20px monospace';ctx.fillStyle='#ff4444';ctx.fillText('BOSS APPROACHING',W/2,H/2-25);}
  if(nightAnnouncementTimer>0){ctx.fillStyle=nightAnnouncementColor;ctx.globalAlpha=nightAnnouncementTimer/120;ctx.font='bold 36px monospace';ctx.textAlign='center';ctx.fillText(nightAnnouncementText,W/2,H/2-120);ctx.globalAlpha=1;}
  for(const ft of floatingTexts){ctx.fillStyle=ft.color;ctx.globalAlpha=ft.life/ft.maxLife;ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.fillText(ft.text,W/2,H/2+ft.y);ctx.globalAlpha=1;}
  if(gameState===STATE.TAKEOFF){drawTape(30,Math.round(takeoffSpeed*25),'KTS');drawTape(W-100,Math.round(Math.max(0,player.position.y)),'ALT FT');
  ctx.strokeStyle='rgba(0,255,0,0.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(W/2-30,H/2);ctx.lineTo(W/2-10,H/2);ctx.moveTo(W/2+10,H/2);ctx.lineTo(W/2+30,H/2);ctx.moveTo(W/2,H/2-10);ctx.lineTo(W/2,H/2+10);ctx.stroke();
  const labels=['ENGINE SPOOL-UP','ROLLING','ROTATE — PULL UP','GEAR UP — AIRBORNE'];ctx.fillStyle=takeoffPhase>=2?'rgba(0,255,150,0.9)':'rgba(255,255,255,0.6)';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText(labels[takeoffPhase],W/2,H-25);}
  if(player.hp<player.maxHp*.4){const int=1-(player.hp/(player.maxHp*.4)),pulse=.5+Math.sin(gameTime*.1)*.2;
  const vg=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.7);vg.addColorStop(0,'rgba(255,0,0,0)');vg.addColorStop(1,`rgba(255,0,0,${int*pulse*.3})`);ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);}
}

function drawTitle(){
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 56px monospace';ctx.textAlign='center';ctx.fillText('DOGFIGHT',W/2,H*.18);
  ctx.fillStyle='#ff4444';ctx.font='bold 28px monospace';ctx.fillText('ADVENTURES',W/2,H*.24);
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px monospace';ctx.fillText('FIRST PERSON 3D',W/2,H*.28);
  ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.fillText('SELECT JET',W/2,H*.36);
  jetPickerAreas=[];
  const jY=H*.39,jW=130,tjW=JET_TYPES.length*(jW+10),jSX=W/2-tjW/2;
  for(let i=0;i<JET_TYPES.length;i++){const x=jSX+i*(jW+10),sel=i===p1JetIndex;
  ctx.fillStyle=sel?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.05)';ctx.fillRect(x,jY,jW,70);
  if(sel){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(x,jY,jW,70);}
  ctx.fillStyle=sel?'#fff':'rgba(255,255,255,0.6)';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText(JET_TYPES[i].name,x+jW/2,jY+18);
  ctx.font='9px monospace';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fillText(JET_TYPES[i].desc,x+jW/2,jY+33);
  ctx.fillText(`SPD:${JET_TYPES[i].speed} HP:${JET_TYPES[i].maxHp}`,x+jW/2,jY+48);
  ctx.fillText(`MSL:${JET_TYPES[i].missiles} RATE:${JET_TYPES[i].fireRate}`,x+jW/2,jY+60);
  jetPickerAreas.push({x,y:jY,w:jW,h:70,colorIndex:i,jetIndex:i});}
  ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText('SELECT COLOR',W/2,H*.58);
  colorPickerAreas=[];
  const cY=H*.61,sS=36,tcW=JET_COLORS.length*(sS+8),cSX=W/2-tcW/2;
  for(let i=0;i<JET_COLORS.length;i++){const x=cSX+i*(sS+8),sel=i===p1ColorIndex;
  ctx.fillStyle=JET_COLORS[i].swatch;ctx.fillRect(x,cY,sS,sS);
  if(sel){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(x-2,cY-2,sS+4,sS+4);}
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(JET_COLORS[i].name,x+sS/2,cY+sS+14);
  colorPickerAreas.push({x,y:cY,w:sS,h:sS,colorIndex:i});}
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px monospace';ctx.textAlign='center';
  ctx.fillText('WASD — Throttle & Roll  |  Mouse — Look/Aim',W/2,H*.76);
  ctx.fillText('Left Click — Gun  |  Right Click/F — Missile',W/2,H*.76+22);
  ctx.fillText('Q/E — Barrel Roll  |  P — Pause',W/2,H*.76+44);
  const fl=.5+Math.sin(gameTime*.08)*.5;ctx.fillStyle=`rgba(255,255,255,${fl})`;ctx.font='bold 22px monospace';ctx.fillText('CLICK or SPACE to START',W/2,H*.92);
  if(highScore>0){ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='14px monospace';ctx.fillText(`HIGH SCORE: ${highScore}`,W/2,H*.96);}
}
function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ff2222';ctx.font='bold 48px monospace';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H*.35);
  ctx.fillStyle='#fff';ctx.font='bold 28px monospace';ctx.fillText(`SCORE: ${score}`,W/2,H*.45);
  if(score>=highScore){ctx.fillStyle='#ffdd00';ctx.font='bold 20px monospace';ctx.fillText('NEW HIGH SCORE!',W/2,H*.52);}
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='16px monospace';ctx.fillText(`Wave ${wave} | Kills: ${totalKills}`,W/2,H*.58);
  const fl=.5+Math.sin(gameTime*.08)*.5;ctx.fillStyle=`rgba(255,255,255,${fl})`;ctx.font='bold 20px monospace';ctx.fillText('CLICK or SPACE to RETRY',W/2,H*.72);
}

// ─── Game Loop ──────────────────────────────────────────────────
function gameLoop(time){
  requestAnimationFrame(gameLoop);
  dt=Math.min((time-lastTime)/1000,.05);lastTime=time;
  if(gameState!==STATE.PAUSED)update();else gameTime++;
  renderer.render(scene,camera);drawHUD();
}
lastTime=performance.now();requestAnimationFrame(gameLoop);
</script>
</body>
