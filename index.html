// ─── Power-up Spawning ──────────────────────────────────────────
function maybeDropPowerup(x, y) {
  const r = Math.random();
  if (r > 0.25) return; // 25% drop rate
  const types = ['health', 'rapidfire', 'missile', 'shield', 'multiplier'];
  const weights = [0.3, 0.2, 0.25, 0.15, 0.1];
  let roll = Math.random(), type;
  let cumulative = 0;
  for (let i = 0; i < types.length; i++) {
    cumulative += weights[i];
    if (roll < cumulative) { type = types[i]; break; }
  }
  if (!type) type = 'health';
  powerups.push({ x, y, type, vy: 1.5, life: 600, size: 14, pulse: 0 });
}

// ─── Collision ──────────────────────────────────────────────────
function rectCollide(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax - aw / 2 < bx + bw / 2 && ax + aw / 2 > bx - bw / 2 &&
         ay - ah / 2 < by + bh / 2 && ay + ah / 2 > by - bh / 2;
}

// ─── Player damage/death helper ─────────────────────────────────
function damagePlayer(p, isP2, amount) {
  if (p.shield > 0) {
    p.shield--;
    spawnFloatingText(p.x, p.y - 30, 'BLOCKED', '#44ddff', 16);
    for (let k = 0; k < 8; k++) {
      spawnParticle(p.x + (Math.random() - 0.5) * 20, p.y + (Math.random() - 0.5) * 20,
        (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3, '#44ddff', 3, 15);
    }
    return;
  }
  p.hp -= amount;
  shakeAmount = Math.min(shakeAmount + 5, 15);
  p.invulnTimer = 15;
  spawnExplosion(p.x + (Math.random() - 0.5) * 10, p.y, 8, 6);
  if (p.hp <= 0) {
    p.alive = false;
    spawnExplosion(p.x, p.y, 50, 50);
    p.respawnTimer = 300; // 5 seconds to respawn
    const label = isP2 ? 'P2' : 'P1';
    spawnFloatingText(p.x, p.y - 40, label + ' DOWN!', '#ff4444', 24);
    // Check if both dead -> game over
    if (bothPlayersDead()) {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('dogfight_highscore', String(highScore));
      }
      setTimeout(() => { gameState = STATE.GAMEOVER; }, 1500);
    }
  }
}

// ─── Takeoff Sequence ───────────────────────────────────────────
function updateTakeoff() {
  takeoffTimer++;
  gameTime++;

  // Phase 0: Engine spool-up (0-80 frames, ~1.3s) -- jet shakes, engines get loud
  if (takeoffPhase === 0) {
    takeoffSpeed = 0;
    // Vibration increases
    shakeAmount = Math.min(takeoffTimer * 0.04, 2.5);
    player.afterburner = takeoffTimer / 80;
    player2.afterburner = takeoffTimer / 80;
    spawnEngineTrail(player.x - 6, player.y + player.h / 2, player.afterburner);
    spawnEngineTrail(player.x + 6, player.y + player.h / 2, player.afterburner);
    spawnEngineTrail(player2.x - 6, player2.y + player2.h / 2, player2.afterburner);
    spawnEngineTrail(player2.x + 6, player2.y + player2.h / 2, player2.afterburner);
    if (takeoffTimer >= 80) {
      takeoffPhase = 1;
      takeoffTimer = 0;
    }
  }

  // Phase 1: Runway roll (0-120 frames, ~2s) -- accelerating down the runway
  else if (takeoffPhase === 1) {
    const t = takeoffTimer / 120;
    takeoffSpeed = t * t * 18; // quadratic acceleration
    runwayY += takeoffSpeed;
    shakeAmount = 2.5 - t * 1.5; // vibration decreases as speed picks up
    player.afterburner = 0.8 + t * 0.2;
    player2.afterburner = 0.8 + t * 0.2;
    // Heavy engine trails
    spawnEngineTrail(player.x - 6, player.y + player.h / 2, 1);
    spawnEngineTrail(player.x + 6, player.y + player.h / 2, 1);
    spawnEngineTrail(player2.x - 6, player2.y + player2.h / 2, 1);
    spawnEngineTrail(player2.x + 6, player2.y + player2.h / 2, 1);
    if (takeoffTimer >= 120) {
      takeoffPhase = 2;
      takeoffTimer = 0;
    }
  }

  // Phase 2: Rotate -- nose pitches up, wheels leave ground (0-40 frames)
  else if (takeoffPhase === 2) {
    const t = takeoffTimer / 40;
    takeoffSpeed = 18 + t * 4;
    runwayY += takeoffSpeed;
    player.y -= t * 2.5; // jet lifts off screen center
    player2.y -= t * 2.5;
    player.afterburner = 1;
    player2.afterburner = 1;
    shakeAmount = Math.max(0, 1 - t * 2);
    spawnEngineTrail(player.x - 6, player.y + player.h / 2, 1);
    spawnEngineTrail(player.x + 6, player.y + player.h / 2, 1);
    spawnEngineTrail(player2.x - 6, player2.y + player2.h / 2, 1);
    spawnEngineTrail(player2.x + 6, player2.y + player2.h / 2, 1);
    // Spray particles from wheels lifting
    if (takeoffTimer < 10) {
      for (let i = 0; i < 2; i++) {
        spawnParticle(
          player.x + (Math.random() - 0.5) * 20,
          player.y + player.h / 2 + 5,
          (Math.random() - 0.5) * 3, Math.random() * 2 + 1,
          'rgba(200,200,200,0.5)', 2 + Math.random() * 2, 15
        );
        spawnParticle(
          player2.x + (Math.random() - 0.5) * 20,
          player2.y + player2.h / 2 + 5,
          (Math.random() - 0.5) * 3, Math.random() * 2 + 1,
          'rgba(200,200,200,0.5)', 2 + Math.random() * 2, 15
        );
      }
    }
    if (takeoffTimer >= 40) {
      takeoffPhase = 3;
      takeoffTimer = 0;
    }
  }

  // Phase 3: Climb -- runway shrinks away, transition to gameplay (0-90 frames)
  else if (takeoffPhase === 3) {
    const t = takeoffTimer / 90;
    takeoffSpeed = 22 - t * 18; // decelerate to cruise
    runwayY += takeoffSpeed;
    // Jet moves to gameplay position
    const targetY = H - 120;
    player.y += (targetY - player.y) * 0.04;
    player2.y += (targetY - player2.y) * 0.04;
    const targetX1 = W / 2 - 25;
    const targetX2 = W / 2 + 25;
    player.x += (targetX1 - player.x) * 0.04;
    player2.x += (targetX2 - player2.x) * 0.04;
    player.afterburner = 1 - t * 0.6;
    player2.afterburner = 1 - t * 0.6;
    spawnEngineTrail(player.x - 6, player.y + player.h / 2, player.afterburner);
    spawnEngineTrail(player.x + 6, player.y + player.h / 2, player.afterburner);
    spawnEngineTrail(player2.x - 6, player2.y + player2.h / 2, player2.afterburner);
    spawnEngineTrail(player2.x + 6, player2.y + player2.h / 2, player2.afterburner);
    if (takeoffTimer >= 90) {
      // Transition to gameplay
      mouseX = player.x;
      mouseY = player.y;
      gameState = STATE.WAVE_INTRO;
      introTimer = 120;
      startWave(1);
      shakeAmount = 0;
    }
  }

  // Update particles during takeoff
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// Perspective helper: maps a world-space Z distance to screen Y and a horizontal scale factor
function perspProject(worldZ, vanishY, bottomY) {
  const depth = Math.max(worldZ, 0.1);
  const maxDepth = 6000;
  const t = Math.min(depth / maxDepth, 1);
  const screenY = bottomY - (1 - t) * (bottomY - vanishY);
  const scale = 1 - t;
  return { screenY, scale };
}

function drawRunway() {
  const cx = W / 2;
  const horizonY = H * 0.22;
  const vanishY = horizonY;
  const bottomY = H + 60;
  const rwHalfWidth = 150;
  const perspectiveFade = Math.max(0, 1 - runwayY / 4000);

  if (perspectiveFade <= 0.01) return;

  ctx.save();
  ctx.globalAlpha = perspectiveFade;

  // ── Horizon mountains/treeline ──
  ctx.fillStyle = '#1a5c10';
  ctx.beginPath();
  ctx.moveTo(0, horizonY);
  for (let x = 0; x <= W; x += 8) {
    const h = Math.sin(x * 0.005) * 12 + Math.sin(x * 0.013) * 8 + Math.sin(x * 0.031) * 4;
    ctx.lineTo(x, horizonY - 15 - h);
  }
  ctx.lineTo(W, horizonY);
  ctx.closePath();
  ctx.fill();
  // Lighter distant treeline
  ctx.fillStyle = '#2a7a20';
  ctx.beginPath();
  ctx.moveTo(0, horizonY);
  for (let x = 0; x <= W; x += 6) {
    const h = Math.sin(x * 0.008 + 1) * 8 + Math.sin(x * 0.02 + 2) * 5;
    ctx.lineTo(x, horizonY - 6 - h);
  }
  ctx.lineTo(W, horizonY);
  ctx.closePath();
  ctx.fill();

  // ── Ground plane: grass field ──
  const grassGrad = ctx.createLinearGradient(0, horizonY, 0, bottomY);
  grassGrad.addColorStop(0, '#2d6b1e');
  grassGrad.addColorStop(0.15, '#358024');
  grassGrad.addColorStop(0.4, '#3f9028');
  grassGrad.addColorStop(0.7, '#48a030');
  grassGrad.addColorStop(1, '#50aa35');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, horizonY, W, bottomY - horizonY);

  // Grass mowing stripes (darker/lighter alternating)
  for (let i = 0; i < 30; i++) {
    const z = i * 200;
    const p = perspProject(z, vanishY, bottomY);
    const p2 = perspProject(z + 100, vanishY, bottomY);
    if (p.screenY < vanishY) continue;
    if (i % 2 === 0) {
      ctx.fillStyle = `rgba(30, 70, 15, ${0.08 * p.scale})`;
      ctx.fillRect(0, p2.screenY, W, p.screenY - p2.screenY);
    }
  }

  // ── Parallel taxiway (right side) ──
  for (let z = 0; z < 6000; z += 30) {
    const p1 = perspProject(z, vanishY, bottomY);
    const p2 = perspProject(z + 30, vanishY, bottomY);
    if (p1.screenY < vanishY || p1.scale < 0.01) break;
    const taxiCenterX = cx + (rwHalfWidth + 180) * p1.scale;
    const taxiW = 50 * p1.scale;
    const taxiCenterX2 = cx + (rwHalfWidth + 180) * p2.scale;
    const taxiW2 = 50 * p2.scale;
    ctx.fillStyle = `rgba(55, 55, 55, ${p1.scale * 0.7})`;
    ctx.beginPath();
    ctx.moveTo(taxiCenterX - taxiW, p1.screenY);
    ctx.lineTo(taxiCenterX + taxiW, p1.screenY);
    ctx.lineTo(taxiCenterX2 + taxiW2, p2.screenY);
    ctx.lineTo(taxiCenterX2 - taxiW2, p2.screenY);
    ctx.closePath();
    ctx.fill();
  }
  // Taxiway yellow centerline
  const taxiDash = 100;
  for (let i = 0; i < 50; i++) {
    const z = i * taxiDash - ((runwayY * 0.1) % taxiDash);
    if (z < 0) continue;
    const p = perspProject(z, vanishY, bottomY);
    if (p.screenY < vanishY || p.scale < 0.02) continue;
    const tx = cx + (rwHalfWidth + 180) * p.scale;
    ctx.fillStyle = `rgba(220,180,30,${0.6 * p.scale})`;
    ctx.fillRect(tx - p.scale, p.screenY, 2 * p.scale, Math.max(1, 2 * p.scale));
  }

  // ── Buildings/hangars (right side, far) ──
  const structures = [
    { z: 1200, xOff: 350, w: 120, h: 40, color: '#556677' },
    { z: 1500, xOff: 380, w: 80, h: 55, color: '#667788' },
    { z: 2000, xOff: 330, w: 100, h: 35, color: '#4a5a6a' },
    { z: 800, xOff: -320, w: 90, h: 30, color: '#5a6a7a' },
    { z: 1800, xOff: -360, w: 70, h: 45, color: '#4d5d6d' },
  ];
  for (const s of structures) {
    const sz = s.z - runwayY * 0.05;
    if (sz < 0 || sz > 5000) continue;
    const p = perspProject(sz, vanishY, bottomY);
    if (p.screenY < vanishY || p.scale < 0.03) continue;
    const bx = cx + s.xOff * p.scale;
    const bw = s.w * p.scale;
    const bh = s.h * p.scale;
    // Building body
    ctx.fillStyle = s.color;
    ctx.fillRect(bx - bw / 2, p.screenY - bh, bw, bh);
    // Roof line
    ctx.fillStyle = `rgba(40,40,40,${p.scale * 0.5})`;
    ctx.fillRect(bx - bw / 2, p.screenY - bh, bw, bh * 0.15);
    // Windows
    ctx.fillStyle = `rgba(180,210,240,${p.scale * 0.5})`;
    const winCount = Math.max(1, Math.floor(bw / (12 * p.scale)));
    for (let wi = 0; wi < winCount; wi++) {
      const wx = bx - bw / 2 + (wi + 0.5) * (bw / winCount);
      ctx.fillRect(wx - 2 * p.scale, p.screenY - bh * 0.65, 4 * p.scale, bh * 0.25);
    }
  }

  // ── Control tower (left side) ──
  const towerZ = 1000 - runwayY * 0.05;
  if (towerZ > 0 && towerZ < 4000) {
    const p = perspProject(towerZ, vanishY, bottomY);
    if (p.screenY > vanishY && p.scale > 0.03) {
      const tx = cx - (rwHalfWidth + 260) * p.scale;
      const tw = 18 * p.scale;
      const th = 90 * p.scale;
      // Tower shaft
      ctx.fillStyle = `rgba(160,160,170,${p.scale})`;
      ctx.fillRect(tx - tw / 2, p.screenY - th, tw, th);
      // Cab (wider glass room at top)
      const cabW = 32 * p.scale;
      const cabH = 16 * p.scale;
      ctx.fillStyle = `rgba(80,90,100,${p.scale})`;
      ctx.fillRect(tx - cabW / 2, p.screenY - th - cabH, cabW, cabH);
      // Glass windows
      ctx.fillStyle = `rgba(140,200,220,${p.scale * 0.7})`;
      ctx.fillRect(tx - cabW / 2 + 2 * p.scale, p.screenY - th - cabH + 3 * p.scale, cabW - 4 * p.scale, cabH * 0.6);
      // Antenna
      ctx.strokeStyle = `rgba(100,100,100,${p.scale})`;
      ctx.lineWidth = Math.max(0.5, p.scale);
      ctx.beginPath();
      ctx.moveTo(tx, p.screenY - th - cabH);
      ctx.lineTo(tx, p.screenY - th - cabH - 15 * p.scale);
      ctx.stroke();
      // Red beacon
      const beacon = 0.5 + Math.sin(gameTime * 0.15) * 0.5;
      ctx.fillStyle = `rgba(255,30,30,${beacon * p.scale})`;
      ctx.beginPath();
      ctx.arc(tx, p.screenY - th - cabH - 15 * p.scale, 2 * p.scale, 0, TAU);
      ctx.fill();
    }
  }

  // ── Runway shoulder (worn dirt strip) ──
  for (let z = 0; z < 6000; z += 60) {
    const p = perspProject(z, vanishY, bottomY);
    const p2 = perspProject(z + 60, vanishY, bottomY);
    if (p.screenY < vanishY || p.scale < 0.01) break;
    const sW = 14 * p.scale;
    ctx.fillStyle = `rgba(130, 110, 70, ${0.4 * p.scale})`;
    ctx.fillRect(cx - (rwHalfWidth + sW) * p.scale, p2.screenY, sW * 2 * p.scale, p.screenY - p2.screenY + 1);
    ctx.fillRect(cx + (rwHalfWidth - sW * 0.3) * p.scale, p2.screenY, sW * 2 * p.scale, p.screenY - p2.screenY + 1);
  }

  // ── Runway surface (asphalt) ──
  ctx.beginPath();
  const pBot = perspProject(0, vanishY, bottomY);
  const pTop = perspProject(6000, vanishY, bottomY);
  ctx.moveTo(cx - rwHalfWidth * pBot.scale, pBot.screenY);
  ctx.lineTo(cx + rwHalfWidth * pBot.scale, pBot.screenY);
  ctx.lineTo(cx + rwHalfWidth * pTop.scale, pTop.screenY);
  ctx.lineTo(cx - rwHalfWidth * pTop.scale, pTop.screenY);
  ctx.closePath();
  const asphaltGrad = ctx.createLinearGradient(0, vanishY, 0, bottomY);
  asphaltGrad.addColorStop(0, '#2c2c2c');
  asphaltGrad.addColorStop(0.2, '#333');
  asphaltGrad.addColorStop(0.5, '#3a3a3a');
  asphaltGrad.addColorStop(0.8, '#424242');
  asphaltGrad.addColorStop(1, '#484848');
  ctx.fillStyle = asphaltGrad;
  ctx.fill();

  // Asphalt texture -- cracks and wear
  for (let i = 0; i < 90; i++) {
    const z = i * 65 - (runwayY * 0.5 % 65);
    if (z < 0) continue;
    const p = perspProject(z, vanishY, bottomY);
    if (p.screenY < vanishY) continue;
    const hw = rwHalfWidth * p.scale;
    // Horizontal surface variation
    ctx.strokeStyle = `rgba(${45 + (i % 4) * 8}, ${45 + (i % 4) * 8}, ${45 + (i % 4) * 8}, ${0.12 * p.scale})`;
    ctx.lineWidth = Math.max(0.5, p.scale * 0.8);
    ctx.beginPath();
    ctx.moveTo(cx - hw * 0.97, p.screenY);
    ctx.lineTo(cx + hw * 0.97, p.screenY);
    ctx.stroke();
  }

  // Rubber tire marks (dark streaks near touchdown zone)
  const rubberZ = 350 - runwayY;
  if (rubberZ > -200 && rubberZ < 3000) {
    for (let r = 0; r < 6; r++) {
      const rz = rubberZ + r * 15;
      if (rz < 0) continue;
      const p = perspProject(rz, vanishY, bottomY);
      if (p.screenY < vanishY || p.scale < 0.02) continue;
      ctx.fillStyle = `rgba(15,15,15,${0.25 * p.scale})`;
      // Two parallel tire marks
      ctx.fillRect(cx - 20 * p.scale, p.screenY, 8 * p.scale, Math.max(1, 2 * p.scale));
      ctx.fillRect(cx + 12 * p.scale, p.screenY, 8 * p.scale, Math.max(1, 2 * p.scale));
    }
  }

  // ── Runway edge lines (solid white, thick) ──
  for (let z = 0; z < 6000; z += 25) {
    const p1 = perspProject(z, vanishY, bottomY);
    const p2 = perspProject(z + 25, vanishY, bottomY);
    if (p1.screenY < vanishY) break;
    ctx.fillStyle = `rgba(255,255,255,${0.85 * p1.scale})`;
    const lw = Math.max(1, 5 * p1.scale);
    // Left edge
    ctx.fillRect(cx - (rwHalfWidth - 2) * p1.scale - lw, p2.screenY, lw, p1.screenY - p2.screenY + 1);
    // Right edge
    ctx.fillRect(cx + (rwHalfWidth - 2) * p1.scale, p2.screenY, lw, p1.screenY - p2.screenY + 1);
  }

  // ── Centerline dashes ──
  const dashWorldLen = 60;
  const dashGap = 40;
  const dashCycle = dashWorldLen + dashGap;
  for (let i = -1; i < 60; i++) {
    const zStart = i * dashCycle - (runwayY % dashCycle);
    const zEnd = zStart + dashWorldLen;
    if (zEnd < 0 || zStart > 6000) continue;
    const p1 = perspProject(Math.max(zStart, 0), vanishY, bottomY);
    const p2 = perspProject(Math.min(zEnd, 6000), vanishY, bottomY);
    if (p1.screenY < vanishY) continue;
    const lineW = Math.max(1, 3.5 * p1.scale);
    ctx.fillStyle = `rgba(255,255,255,${0.75 * p1.scale})`;
    ctx.fillRect(cx - lineW / 2, p2.screenY, lineW, p1.screenY - p2.screenY);
  }

  // ── Touchdown zone markings ──
  const tdzOffset = 500 - runwayY;
  for (let row = 0; row < 4; row++) {
    const z = tdzOffset + row * 220;
    if (z < -50 || z > 5000) continue;
    const p = perspProject(z, vanishY, bottomY);
    const p2 = perspProject(z + 45, vanishY, bottomY);
    if (p.screenY < vanishY || p.scale < 0.02) continue;
    const barH = p.screenY - p2.screenY;
    const barsCount = 4 - row;
    ctx.fillStyle = `rgba(255,255,255,${0.7 * p.scale})`;
    for (let b = 0; b < barsCount; b++) {
      const offset = (32 + b * 20) * p.scale;
      const barW = 13 * p.scale;
      ctx.fillRect(cx - offset - barW / 2, p2.screenY, barW, barH);
      ctx.fillRect(cx + offset - barW / 2, p2.screenY, barW, barH);
    }
  }

  // ── Aiming point markers (bold rectangles 1000ft from threshold) ──
  const aimZ = 700 - runwayY;
  if (aimZ > -100 && aimZ < 4000) {
    const p = perspProject(Math.max(aimZ, 0), vanishY, bottomY);
    const p2 = perspProject(Math.max(aimZ + 80, 0), vanishY, bottomY);
    if (p.screenY > vanishY && p.scale > 0.02) {
      ctx.fillStyle = `rgba(255,255,255,${0.8 * p.scale})`;
      const barH = p.screenY - p2.screenY;
      ctx.fillRect(cx - 55 * p.scale, p2.screenY, 22 * p.scale, barH);
      ctx.fillRect(cx + 33 * p.scale, p2.screenY, 22 * p.scale, barH);
    }
  }

  // ── Threshold bars (piano keys) ──
  const threshZ = 100 - runwayY;
  if (threshZ > -150 && threshZ < 3000) {
    const p = perspProject(Math.max(threshZ, 0), vanishY, bottomY);
    const p2 = perspProject(Math.max(threshZ + 70, 0), vanishY, bottomY);
    if (p.screenY > vanishY && p.scale > 0.02) {
      ctx.fillStyle = `rgba(255,255,255,${0.85 * p.scale})`;
      const barH = p.screenY - p2.screenY;
      for (let b = -6; b <= 6; b++) {
        if (b === 0) continue;
        const bx = cx + b * 15 * p.scale;
        ctx.fillRect(bx - 4 * p.scale, p2.screenY, 8 * p.scale, barH);
      }
    }
  }

  // ── Runway designation "27L" ──
  const numZ = 220 - runwayY;
  if (numZ > -150 && numZ < 2500) {
    const p = perspProject(Math.max(numZ, 0), vanishY, bottomY);
    if (p.screenY > vanishY && p.scale > 0.04) {
      ctx.fillStyle = `rgba(255,255,255,${0.85 * p.scale})`;
      ctx.font = `bold ${Math.max(8, Math.round(55 * p.scale))}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText('27L', cx, p.screenY);
    }
  }

  // ── Edge lights ──
  const lightSpacing = 100;
  for (let i = 0; i < 55; i++) {
    const z = i * lightSpacing - (runwayY % lightSpacing);
    if (z < 0) continue;
    const p = perspProject(z, vanishY, bottomY);
    if (p.screenY < vanishY || p.scale < 0.015) continue;
    const lx = (rwHalfWidth + 6) * p.scale;
    const r = Math.max(1.2, 3.5 * p.scale);
    const isYellow = (i % 5 === 0);
    // Left
    ctx.fillStyle = isYellow ? `rgba(255,200,50,${0.25 * p.scale})` : `rgba(255,255,255,${0.15 * p.scale})`;
    ctx.beginPath(); ctx.arc(cx - lx, p.screenY, r * 3, 0, TAU); ctx.fill();
    ctx.fillStyle = isYellow ? `rgba(255,220,80,${0.9 * p.scale})` : `rgba(255,255,240,${0.8 * p.scale})`;
    ctx.beginPath(); ctx.arc(cx - lx, p.screenY, r, 0, TAU); ctx.fill();
    // Right
    ctx.fillStyle = isYellow ? `rgba(255,200,50,${0.25 * p.scale})` : `rgba(255,255,255,${0.15 * p.scale})`;
    ctx.beginPath(); ctx.arc(cx + lx, p.screenY, r * 3, 0, TAU); ctx.fill();
    ctx.fillStyle = isYellow ? `rgba(255,220,80,${0.9 * p.scale})` : `rgba(255,255,240,${0.8 * p.scale})`;
    ctx.beginPath(); ctx.arc(cx + lx, p.screenY, r, 0, TAU); ctx.fill();
  }

  // ── PAPI lights (left side, near touchdown) ──
  const papiZ = 600 - runwayY;
  if (papiZ > 0 && papiZ < 2500) {
    const p = perspProject(papiZ, vanishY, bottomY);
    if (p.screenY > vanishY && p.scale > 0.03) {
      const px = cx - (rwHalfWidth + 35) * p.scale;
      for (let li = 0; li < 4; li++) {
        const ly = p.screenY - li * 5 * p.scale;
        const isRed = li < 2; // 2 red 2 white = on glideslope
        const color = isRed ? `rgba(255,40,30,${p.scale})` : `rgba(255,255,255,${p.scale})`;
        const glow = isRed ? `rgba(255,40,30,${0.3 * p.scale})` : `rgba(255,255,220,${0.25 * p.scale})`;
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(px + li * 8 * p.scale, ly, 4 * p.scale, 0, TAU); ctx.fill();
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(px + li * 8 * p.scale, ly, 2 * p.scale, 0, TAU); ctx.fill();
      }
    }
  }

  // ── Approach lights (before threshold, centerline strobes) ──
  const approachStart = 20 - runwayY;
  if (approachStart > -200 && approachStart < 1500) {
    for (let al = 0; al < 6; al++) {
      const az = approachStart - al * 80;
      if (az < 0 || az > 5000) continue;
      const p = perspProject(az, vanishY, bottomY);
      if (p.screenY < vanishY || p.scale < 0.02) continue;
      // Strobe flash
      const flash = Math.sin(gameTime * 0.3 + al * 1.5) > 0.6 ? 1 : 0.3;
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.3 * p.scale})`;
      ctx.beginPath(); ctx.arc(cx, p.screenY, 6 * p.scale, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(255,255,240,${flash * p.scale})`;
      ctx.beginPath(); ctx.arc(cx, p.screenY, 2.5 * p.scale, 0, TAU); ctx.fill();
      // Crossbar at first two
      if (al < 2) {
        ctx.fillStyle = `rgba(255,255,240,${0.6 * p.scale})`;
        ctx.fillRect(cx - 25 * p.scale, p.screenY - p.scale, 50 * p.scale, 2 * p.scale);
      }
    }
  }

  // ── Taxiway signs ──
  const signs = [
    { z: 300, xOff: -1, label: 'A3', bg: '#cc9900' },
    { z: 900, xOff: 1, label: 'B1', bg: '#cc9900' },
    { z: 1600, xOff: -1, label: 'RWY 27L', bg: '#cc0000' },
  ];
  for (const s of signs) {
    const sz = s.z - runwayY * 0.1;
    if (sz < 0 || sz > 2500) continue;
    const p = perspProject(sz, vanishY, bottomY);
    if (p.screenY < vanishY || p.scale < 0.04) continue;
    const sx = cx + s.xOff * (rwHalfWidth + 45) * p.scale;
    const sw = (s.label.length * 8 + 12) * p.scale;
    const sh = 14 * p.scale;
    // Sign
    ctx.fillStyle = s.bg;
    ctx.globalAlpha = perspectiveFade * p.scale;
    ctx.fillRect(sx - sw / 2, p.screenY - sh - 4 * p.scale, sw, sh);
    // Border
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = Math.max(0.5, p.scale);
    ctx.strokeRect(sx - sw / 2, p.screenY - sh - 4 * p.scale, sw, sh);
    // Text
    ctx.fillStyle = s.bg === '#cc0000' ? '#fff' : '#000';
    ctx.font = `bold ${Math.max(5, Math.round(10 * p.scale))}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(s.label, sx, p.screenY - 5 * p.scale);
    // Post
    ctx.fillStyle = `rgba(90,90,90,${p.scale})`;
    ctx.fillRect(sx - p.scale, p.screenY - sh - 4 * p.scale, 2 * p.scale, sh + 8 * p.scale);
    ctx.globalAlpha = perspectiveFade;
  }

  // ── Windsock (right side near threshold) ──
  const wsZ = 250 - runwayY * 0.08;
  if (wsZ > 0 && wsZ < 2000) {
    const p = perspProject(wsZ, vanishY, bottomY);
    if (p.screenY > vanishY && p.scale > 0.04) {
      const wx = cx + (rwHalfWidth + 80) * p.scale;
      const poleH = 25 * p.scale;
      // Pole
      ctx.strokeStyle = `rgba(180,180,180,${p.scale})`;
      ctx.lineWidth = Math.max(1, 2 * p.scale);
      ctx.beginPath();
      ctx.moveTo(wx, p.screenY);
      ctx.lineTo(wx, p.screenY - poleH);
      ctx.stroke();
      // Sock (animated)
      const sockLen = 18 * p.scale;
      const wave1 = Math.sin(gameTime * 0.08) * 3 * p.scale;
      const wave2 = Math.sin(gameTime * 0.12 + 1) * 2 * p.scale;
      ctx.beginPath();
      ctx.moveTo(wx, p.screenY - poleH);
      ctx.quadraticCurveTo(wx + sockLen * 0.5 + wave1, p.screenY - poleH + 2 * p.scale, wx + sockLen + wave2, p.screenY - poleH + 4 * p.scale);
      ctx.lineTo(wx + sockLen + wave2, p.screenY - poleH + 8 * p.scale);
      ctx.quadraticCurveTo(wx + sockLen * 0.5 + wave1, p.screenY - poleH + 6 * p.scale, wx, p.screenY - poleH + 4 * p.scale);
      ctx.closePath();
      // Orange/white stripes
      ctx.fillStyle = `rgba(255,100,20,${p.scale})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(255,255,255,${p.scale * 0.7})`;
      ctx.lineWidth = Math.max(0.5, p.scale);
      ctx.stroke();
    }
  }

  // ── Heat shimmer (subtle during spool/roll phases) ──
  if (takeoffPhase <= 1 && takeoffSpeed < 12) {
    const shimmerIntensity = 0.03 + takeoffSpeed * 0.005;
    for (let sy = horizonY + 20; sy < H - 100; sy += 12) {
      const offset = Math.sin(sy * 0.1 + gameTime * 0.15) * 2 * shimmerIntensity;
      ctx.drawImage(canvas, 0, sy, W, 4, offset, sy + Math.sin(gameTime * 0.2 + sy * 0.05) * 0.5, W, 4);
    }
  }

  ctx.restore();
}

function drawCockpitView() {
  ctx.save();

  // ── Cockpit shake during spool/roll ──
  const shk = shakeAmount * 0.5;
  if (shk > 0.3) {
    ctx.translate((Math.random() - 0.5) * shk, (Math.random() - 0.5) * shk);
  }

  // ── Canopy frame — dark silhouette around edges ──
  // This creates the feeling of sitting inside the jet looking through the canopy

  // Top canopy arch
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(W, 0);
  ctx.lineTo(W, H * 0.08);
  ctx.quadraticCurveTo(W * 0.5, H * 0.02, 0, H * 0.08);
  ctx.closePath();
  ctx.fill();

  // Left canopy frame
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(W * 0.06, 0);
  ctx.lineTo(W * 0.04, H * 0.7);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  // Right canopy frame
  ctx.beginPath();
  ctx.moveTo(W, 0);
  ctx.lineTo(W * 0.94, 0);
  ctx.lineTo(W * 0.96, H * 0.7);
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  // ── Canopy struts (three thin metal ribs) ──
  ctx.strokeStyle = 'rgba(40, 40, 40, 0.6)';
  ctx.lineWidth = 3;
  // Left strut
  ctx.beginPath();
  ctx.moveTo(W * 0.05, H * 0.06);
  ctx.quadraticCurveTo(W * 0.18, H * 0.04, W * 0.32, H * 0.03);
  ctx.stroke();
  // Right strut
  ctx.beginPath();
  ctx.moveTo(W * 0.95, H * 0.06);
  ctx.quadraticCurveTo(W * 0.82, H * 0.04, W * 0.68, H * 0.03);
  ctx.stroke();
  // Center bow
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(W * 0.04, H * 0.35);
  ctx.quadraticCurveTo(W * 0.5, H * 0.02, W * 0.96, H * 0.35);
  ctx.stroke();

  // ── Dashboard / instrument panel (bottom) ──
  const dashTop = H * 0.72;
  const dashGrad = ctx.createLinearGradient(0, dashTop, 0, H);
  dashGrad.addColorStop(0, '#1c1c1c');
  dashGrad.addColorStop(0.15, '#222222');
  dashGrad.addColorStop(0.5, '#191919');
  dashGrad.addColorStop(1, '#0e0e0e');
  ctx.fillStyle = dashGrad;
  ctx.beginPath();
  ctx.moveTo(0, dashTop + 30);
  ctx.quadraticCurveTo(W * 0.5, dashTop - 10, W, dashTop + 30);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  // Dashboard top edge highlight
  ctx.strokeStyle = 'rgba(80, 80, 80, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, dashTop + 30);
  ctx.quadraticCurveTo(W * 0.5, dashTop - 10, W, dashTop + 30);
  ctx.stroke();

  // ── Instrument bezels on dashboard ──
  // Left MFD (multi-function display)
  const mfdSize = Math.min(100, W * 0.08);
  const mfdY = dashTop + 50;

  // Left MFD
  ctx.fillStyle = '#0a0a0a';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.fillRect(W * 0.15 - mfdSize / 2, mfdY, mfdSize, mfdSize * 0.8);
  ctx.strokeRect(W * 0.15 - mfdSize / 2, mfdY, mfdSize, mfdSize * 0.8);
  // MFD screen glow
  ctx.fillStyle = 'rgba(0, 80, 0, 0.3)';
  ctx.fillRect(W * 0.15 - mfdSize / 2 + 4, mfdY + 4, mfdSize - 8, mfdSize * 0.8 - 8);
  // Attitude lines on MFD
  ctx.strokeStyle = 'rgba(0, 200, 0, 0.4)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 5; i++) {
    const ly = mfdY + 8 + i * (mfdSize * 0.8 - 16) / 5;
    ctx.beginPath();
    ctx.moveTo(W * 0.15 - mfdSize / 4, ly);
    ctx.lineTo(W * 0.15 + mfdSize / 4, ly);
    ctx.stroke();
  }

  // Right MFD
  ctx.fillStyle = '#0a0a0a';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.fillRect(W * 0.85 - mfdSize / 2, mfdY, mfdSize, mfdSize * 0.8);
  ctx.strokeRect(W * 0.85 - mfdSize / 2, mfdY, mfdSize, mfdSize * 0.8);
  ctx.fillStyle = 'rgba(0, 80, 0, 0.3)';
  ctx.fillRect(W * 0.85 - mfdSize / 2 + 4, mfdY + 4, mfdSize - 8, mfdSize * 0.8 - 8);

  // Center console — throttle quadrant area
  ctx.fillStyle = '#111';
  ctx.fillRect(W * 0.5 - 35, mfdY + 10, 70, mfdSize * 0.6);
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 1;
  ctx.strokeRect(W * 0.5 - 35, mfdY + 10, 70, mfdSize * 0.6);

  // Throttle position indicator (moves with takeoff progress)
  const throttlePos = takeoffPhase === 0 ? takeoffTimer / 80 :
                      takeoffPhase >= 1 ? 1 : 0;
  const throttleY = mfdY + 10 + (mfdSize * 0.6) * (1 - throttlePos);
  ctx.fillStyle = '#555';
  ctx.fillRect(W * 0.5 - 8, throttleY, 16, 12);
  ctx.fillStyle = throttlePos > 0.9 ? '#ff4400' : '#888';
  ctx.fillRect(W * 0.5 - 6, throttleY + 2, 12, 8);
  // MIL/AB label
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('MIL', W * 0.5, mfdY + 18);
  ctx.fillText('AB', W * 0.5, mfdY + 10 + mfdSize * 0.6 - 4);

  // ── Warning lights on glareshield ──
  const glareY = dashTop + 18;
  // Master caution (amber, blinks during spool)
  if (takeoffPhase === 0 && Math.floor(gameTime / 15) % 2 === 0) {
    ctx.fillStyle = 'rgba(255, 180, 0, 0.8)';
    ctx.fillRect(W * 0.42, glareY, 32, 12);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('MSTR', W * 0.42 + 16, glareY + 9);
  }
  // Config OK (green once rolling)
  if (takeoffPhase >= 1) {
    ctx.fillStyle = 'rgba(0, 200, 0, 0.7)';
    ctx.fillRect(W * 0.54, glareY, 32, 12);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('T/O', W * 0.54 + 16, glareY + 9);
  }
  // Gear indicator
  if (takeoffPhase < 3) {
    ctx.fillStyle = 'rgba(0, 200, 0, 0.6)';
    ctx.beginPath();
    ctx.arc(W * 0.38, glareY + 6, 4, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '6px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GEAR', W * 0.38, glareY + 16);
  } else {
    // Gear up — indicator off
    ctx.fillStyle = 'rgba(80, 80, 80, 0.5)';
    ctx.beginPath();
    ctx.arc(W * 0.38, glareY + 6, 4, 0, TAU);
    ctx.fill();
  }

  // ── Canopy glass reflections ──
  // Subtle diagonal light streaks on the canopy
  ctx.globalAlpha = 0.04 + Math.sin(gameTime * 0.02) * 0.01;
  const reflGrad = ctx.createLinearGradient(W * 0.2, 0, W * 0.6, H * 0.5);
  reflGrad.addColorStop(0, 'rgba(255,255,255,0)');
  reflGrad.addColorStop(0.3, 'rgba(255,255,255,0.5)');
  reflGrad.addColorStop(0.5, 'rgba(255,255,255,0.8)');
  reflGrad.addColorStop(0.7, 'rgba(255,255,255,0.5)');
  reflGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = reflGrad;
  ctx.beginPath();
  ctx.moveTo(W * 0.1, 0);
  ctx.lineTo(W * 0.35, 0);
  ctx.lineTo(W * 0.2, H * 0.5);
  ctx.lineTo(W * 0.05, H * 0.3);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  // Second reflection (right side, fainter)
  ctx.globalAlpha = 0.025;
  ctx.fillStyle = reflGrad;
  ctx.beginPath();
  ctx.moveTo(W * 0.6, 0);
  ctx.lineTo(W * 0.75, 0);
  ctx.lineTo(W * 0.65, H * 0.35);
  ctx.lineTo(W * 0.55, H * 0.2);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  // ── HUD combiner glass (the transparent green-tinted panel) ──
  ctx.fillStyle = 'rgba(0, 255, 100, 0.02)';
  ctx.fillRect(W * 0.25, H * 0.05, W * 0.5, H * 0.55);
  // HUD glass edge
  ctx.strokeStyle = 'rgba(0, 255, 100, 0.06)';
  ctx.lineWidth = 1;
  ctx.strokeRect(W * 0.25, H * 0.05, W * 0.5, H * 0.55);

  // ── Side console details (left) ──
  ctx.fillStyle = '#151515';
  ctx.fillRect(W * 0.01, H * 0.5, W * 0.035, H * 0.2);
  // Toggle switches
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = '#444';
    ctx.fillRect(W * 0.015 + i * 8, H * 0.52, 5, 10);
    ctx.fillStyle = i < 3 ? '#0a0' : '#a00';
    ctx.fillRect(W * 0.016 + i * 8, H * 0.52, 3, 4);
  }

  // ── Side console details (right) ──
  ctx.fillStyle = '#151515';
  ctx.fillRect(W * 0.955, H * 0.5, W * 0.035, H * 0.2);

  // ── Nose visible below dashboard (gives depth) ──
  if (takeoffPhase < 2) {
    // Slight nose-up visible below dashboard center
    ctx.fillStyle = '#e81010';
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.ellipse(W * 0.5, dashTop + 25, 60, 8, 0, 0, PI);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ── G-force / vibration vignette (stronger during high speed) ──
  const vignetteIntensity = takeoffPhase === 1 ? 0.15 + takeoffSpeed * 0.01 :
                            takeoffPhase === 2 ? 0.3 :
                            takeoffPhase === 3 ? 0.3 - (takeoffTimer / 90) * 0.2 : 0.05;
  const vigGrad = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(0.7, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(1, `rgba(0,0,0,${vignetteIntensity})`);
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.restore();
}

function drawTakeoffHUD() {
  ctx.save();
  ctx.textAlign = 'center';

  const speedKnots = Math.round(takeoffSpeed * 15);
  const altitude = Math.max(0, Math.round((H - 80 - player.y) * 2.5));

  // Airspeed tape (left side)
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(30, H / 2 - 100, 80, 200);
  ctx.strokeStyle = 'rgba(100,200,255,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(30, H / 2 - 100, 80, 200);
  // Speed readout
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(30, H / 2 - 14, 80, 28);
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(30, H / 2 - 14, 80, 28);
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(speedKnots, 70, H / 2 + 6);
  // Label
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '10px monospace';
  ctx.fillText('KTS', 70, H / 2 - 90);
  // Speed ticks
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '10px monospace';
  for (let s = -4; s <= 4; s++) {
    if (s === 0) continue;
    const tickY = H / 2 + s * 22;
    const tickVal = speedKnots - s * 10;
    if (tickVal < 0) continue;
    ctx.beginPath(); ctx.moveTo(90, tickY); ctx.lineTo(110, tickY); ctx.stroke();
    ctx.textAlign = 'right';
    ctx.fillText(tickVal, 108, tickY + 3);
  }

  // V-speeds
  const v1 = 130, vr = 155, v2 = 170;
  ctx.font = 'bold 10px monospace';
  for (const vs of [{ label: 'V1', val: v1, color: '#ff0' }, { label: 'VR', val: vr, color: '#0ff' }, { label: 'V2', val: v2, color: '#0f0' }]) {
    const tickOffset = (speedKnots - vs.val) / 10 * 22;
    const ty = H / 2 + tickOffset;
    if (ty > H / 2 - 95 && ty < H / 2 + 95) {
      ctx.fillStyle = vs.color;
      ctx.textAlign = 'left';
      ctx.fillText(vs.label, 33, ty + 3);
      ctx.strokeStyle = vs.color;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(30, ty); ctx.lineTo(110, ty); ctx.stroke();
    }
  }

  // Altitude tape (right side)
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W - 110, H / 2 - 100, 80, 200);
  ctx.strokeStyle = 'rgba(100,200,255,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(W - 110, H / 2 - 100, 80, 200);
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(W - 110, H / 2 - 14, 80, 28);
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(W - 110, H / 2 - 14, 80, 28);
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(altitude, W - 70, H / 2 + 6);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '10px monospace';
  ctx.fillText('ALT FT', W - 70, H / 2 - 90);

  // Heading
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W / 2 - 50, 15, 100, 28);
  ctx.strokeStyle = 'rgba(100,200,255,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(W / 2 - 50, 15, 100, 28);
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('HDG 270', W / 2, 35);

  // Flight director crosshair
  ctx.strokeStyle = 'rgba(0,255,0,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 40, H / 2);
  ctx.lineTo(W / 2 - 12, H / 2);
  ctx.moveTo(W / 2 + 12, H / 2);
  ctx.lineTo(W / 2 + 40, H / 2);
  ctx.moveTo(W / 2, H / 2 - 12);
  ctx.lineTo(W / 2, H / 2 + 12);
  ctx.stroke();

  // Phase text
  const phaseLabels = ['ENGINE SPOOL-UP', 'ROLLING', 'ROTATE \u2014 PULL UP', 'GEAR UP \u2014 AIRBORNE'];
  ctx.fillStyle = takeoffPhase >= 2 ? 'rgba(0,255,150,0.9)' : 'rgba(255,255,255,0.6)';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(phaseLabels[takeoffPhase], W / 2, H - 25);

  ctx.restore();
}

// ─── Update ─────────────────────────────────────────────────────
function update() {
  gameTime++;
  if (shakeAmount > 0.5) shakeAmount *= shakeDecay;
  else shakeAmount = 0;

  // Drift clouds
  for (const c of clouds) c.x += c.speed;
  for (const c of puffyClouds) c.x += c.speed;

  // ── Takeoff ──
  if (gameState === STATE.TAKEOFF) {
    updateTakeoff();
    return; // skip normal gameplay update
  }

  // Timers
  if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) comboCount = 0; }
  if (multiplierTimer > 0) { multiplierTimer--; if (multiplierTimer <= 0) scoreMultiplier = 1; }
  if (rapidFireTimer > 0) rapidFireTimer--;

  // ── Wave intro ──
  if (gameState === STATE.WAVE_INTRO || gameState === STATE.BOSS_INTRO) {
    introTimer--;
    if (introTimer <= 0) {
      gameState = STATE.PLAYING;
      if (!isNightMode) roundTimer = 1200; // reset round timer when day wave starts
    }
    // Still let players move during intro
  }

  // ── Day/Night round timer ──
  if (gameState === STATE.PLAYING) {
    roundTimer--;

    // Night blend lerp (smooth transition over ~60 frames)
    const targetBlend = isNightMode ? 1 : 0;
    nightBlend += (targetBlend - nightBlend) * 0.04;
    if (Math.abs(nightBlend - targetBlend) < 0.005) nightBlend = targetBlend;

    // Green lightning during night
    if (isNightMode) {
      greenLightningTimer--;
      if (greenLightningTimer <= 0) {
        greenLightningAlpha = 0.15 + Math.random() * 0.1;
        greenLightningTimer = 120 + Math.floor(Math.random() * 180);
      }
      if (greenLightningAlpha > 0) {
        greenLightningAlpha *= 0.85;
        if (greenLightningAlpha < 0.01) greenLightningAlpha = 0;
      }
    } else {
      greenLightningAlpha = 0;
    }

    // Night announcement timer
    if (nightAnnouncementTimer > 0) nightAnnouncementTimer--;

    if (roundTimer <= 0) {
      if (!isNightMode) {
        // ── Day ends -> Night begins ──
        // Don't enter night during boss waves
        if (wave % 5 === 0) {
          // Boss wave: just restart the timer, no night mode
          roundTimer = 1200;
        } else {
          // Kill remaining regular enemies (they flee/despawn)
          for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (e.type !== 'boss') {
              spawnExplosion(e.x, e.y, 10, 8);
              enemies.splice(i, 1);
            }
          }
          isNightMode = true;
          roundTimer = 1200;
          waveEnemiesLeft = 0; // stop normal wave spawning
          nightAnnouncementTimer = 120;
          nightAnnouncementText = 'NIGHT FALLS...';
          nightAnnouncementColor = '#44ff44';
          shakeAmount = 8;
          playNightTransitionSound();
        }
      } else {
        // ── Night ends -> Dawn ──
        // Kill remaining zombie enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
          if (enemies[i].type === 'zombie') {
            spawnGreenExplosion(enemies[i].x, enemies[i].y, 10, 8);
            enemies.splice(i, 1);
          }
        }
        isNightMode = false;
        roundTimer = 1200;
        nightAnnouncementTimer = 120;
        nightAnnouncementText = 'DAWN BREAKS...';
        nightAnnouncementColor = '#ffdd44';
        playDawnTransitionSound();
        // Advance to next wave
        startWave(wave + 1);
      }
    }

    // ── Zombie spawning during night ──
    if (isNightMode && wave % 5 !== 0) {
      // Spawn rate ramps from 1 every 40 frames to 1 every 15 frames
      const nightProgress = 1 - (roundTimer / 1200); // 0 -> 1 over 20 seconds
      const spawnInterval = Math.floor(40 - nightProgress * 25); // 40 -> 15
      if (gameTime % spawnInterval === 0) {
        spawnEnemy('zombie');
      }
    }
  } else {
    // Still lerp nightBlend during non-PLAYING states
    const targetBlend = isNightMode ? 1 : 0;
    nightBlend += (targetBlend - nightBlend) * 0.04;
    if (Math.abs(nightBlend - targetBlend) < 0.005) nightBlend = targetBlend;
  }

  // ── Player 1 ──
  inputFrame++;
  if (player.alive) {
    updateBarrelRollFor(player);

    // Mouse-driven movement: smooth follow cursor
    const dx = mouseX - player.x;
    const dy = mouseY - player.y;
    const dist = Math.hypot(dx, dy);
    const followSpeed = 0.12; // lerp factor -- smooth but responsive

    if (dist > 2) {
      player.vx = dx * followSpeed;
      player.vy = dy * followSpeed;
    } else {
      player.vx *= 0.8;
      player.vy *= 0.8;
    }

    player.x += player.vx;
    player.y += player.vy;

    // Clamp to screen
    player.x = Math.max(player.w, Math.min(W - player.w, player.x));
    player.y = Math.max(player.h, Math.min(H - player.h, player.y));

    // Bank angle based on horizontal velocity
    const targetBank = -player.vx * 4 * DEG;
    player.bankAngle += (targetBank - player.bankAngle) * 0.15;

    // Afterburner -- more intense when moving fast
    const moveMag = Math.hypot(player.vx, player.vy);
    player.afterburner += ((0.3 + moveMag * 0.08) - player.afterburner) * 0.1;

    // Engine trail
    spawnEngineTrail(player.x - 6, player.y + player.h / 2, player.afterburner);
    spawnEngineTrail(player.x + 6, player.y + player.h / 2, player.afterburner);

    // Fire -- hold left mouse button to shoot
    if (player.fireTimer > 0) player.fireTimer--;
    const rate = rapidFireTimer > 0 ? Math.max(3, player.fireRate - 4) : player.fireRate;
    if (mouseDown && player.fireTimer <= 0) {
      firePlayerBulletFor(player);
      player.fireTimer = rate;
    }

    if (player.invulnTimer > 0) player.invulnTimer--;
  } else {
    // P1 respawn timer
    if (player.respawnTimer > 0) {
      player.respawnTimer--;
      if (player.respawnTimer <= 0 && !bothPlayersDead()) {
        respawnPlayerObj(player, false);
        spawnFloatingText(player.x, player.y - 30, 'P1 BACK!', JET_COLORS[p1ColorIndex].swatch, 20);
      }
    }
  }

  // ── Player 2 ──
  if (player2.alive) {
    updateBarrelRollFor(player2);

    // WASD movement
    let p2dx = 0, p2dy = 0;
    if (keys['KeyW']) p2dy -= 1;
    if (keys['KeyS']) p2dy += 1;
    if (keys['KeyA']) p2dx -= 1;
    if (keys['KeyD']) p2dx += 1;

    // Normalize diagonal
    const p2mag = Math.hypot(p2dx, p2dy);
    if (p2mag > 0) {
      p2dx /= p2mag;
      p2dy /= p2mag;
    }

    const p2speed = player2.speed;
    const targetVx = p2dx * p2speed;
    const targetVy = p2dy * p2speed;

    // Smooth acceleration
    player2.vx += (targetVx - player2.vx) * 0.15;
    player2.vy += (targetVy - player2.vy) * 0.15;

    // Friction when no input
    if (p2mag === 0) {
      player2.vx *= 0.9;
      player2.vy *= 0.9;
    }

    player2.x += player2.vx;
    player2.y += player2.vy;

    // Clamp to screen
    player2.x = Math.max(player2.w, Math.min(W - player2.w, player2.x));
    player2.y = Math.max(player2.h, Math.min(H - player2.h, player2.y));

    // Bank angle
    const targetBank2 = -player2.vx * 4 * DEG;
    player2.bankAngle += (targetBank2 - player2.bankAngle) * 0.15;

    // Afterburner
    const moveMag2 = Math.hypot(player2.vx, player2.vy);
    player2.afterburner += ((0.3 + moveMag2 * 0.08) - player2.afterburner) * 0.1;

    // Engine trail
    spawnEngineTrail(player2.x - 6, player2.y + player2.h / 2, player2.afterburner);
    spawnEngineTrail(player2.x + 6, player2.y + player2.h / 2, player2.afterburner);

    // Fire -- Space to shoot
    if (player2.fireTimer > 0) player2.fireTimer--;
    const rate2 = rapidFireTimer > 0 ? Math.max(3, player2.fireRate - 4) : player2.fireRate;
    if (keys['Space'] && player2.fireTimer <= 0) {
      firePlayerBulletFor(player2);
      player2.fireTimer = rate2;
    }

    if (player2.invulnTimer > 0) player2.invulnTimer--;
  } else {
    // P2 respawn timer
    if (player2.respawnTimer > 0) {
      player2.respawnTimer--;
      if (player2.respawnTimer <= 0 && !bothPlayersDead()) {
        respawnPlayerObj(player2, true);
        spawnFloatingText(player2.x, player2.y - 30, 'P2 BACK!', JET_COLORS[p2ColorIndex].swatch, 20);
      }
    }
  }

  // ── Bullets ──
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.isMissile && b.target && b.target.hp > 0) {
      const dx = b.target.x - b.x;
      const dy = b.target.y - b.y;
      const angle = Math.atan2(dy, dx);
      const curAngle = Math.atan2(b.vy, b.vx);
      let diff = angle - curAngle;
      while (diff > PI) diff -= TAU;
      while (diff < -PI) diff += TAU;
      const turn = Math.sign(diff) * Math.min(Math.abs(diff), b.turnRate);
      const newAngle = curAngle + turn;
      b.vx = Math.cos(newAngle) * b.speed;
      b.vy = Math.sin(newAngle) * b.speed;
      // Missile trail
      spawnParticle(b.x, b.y, (Math.random() - 0.5) * 0.5, 1, '#ffaa00', 2, 10);
    }
    b.x += b.vx;
    b.y += b.vy;
    if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) {
      bullets.splice(i, 1);
    }
  }

  // ── Enemy Bullets ──
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    if (b.isHoming) {
      b.life--;
      if (b.life <= 0) {
        spawnExplosion(b.x, b.y, 10, 5);
        enemyBullets.splice(i, 1);
        continue;
      }
      // Home toward nearest alive player
      const tgt = nearestAlivePlayer(b.x, b.y);
      const dx = tgt.x - b.x;
      const dy = tgt.y - b.y;
      const angle = Math.atan2(dy, dx);
      const curAngle = Math.atan2(b.vy, b.vx);
      let diff = angle - curAngle;
      while (diff > PI) diff -= TAU;
      while (diff < -PI) diff += TAU;
      const turn = Math.sign(diff) * Math.min(Math.abs(diff), b.turnRate);
      const newAngle = curAngle + turn;
      b.vx = Math.cos(newAngle) * b.speed;
      b.vy = Math.sin(newAngle) * b.speed;
      spawnParticle(b.x, b.y, (Math.random() - 0.5) * 0.3, -0.5, '#ff4444', 2, 8);
    }
    b.x += b.vx;
    b.y += b.vy;
    if (b.y > H + 20 || b.y < -20 || b.x < -40 || b.x > W + 40) {
      enemyBullets.splice(i, 1);
    }
  }

  // ── Enemies ──
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.age++;

    // Find nearest alive player for targeting
    const tgt = nearestAlivePlayer(e.x, e.y);

    // AI per type
    switch (e.type) {
      case 'scout':
        e.vx = Math.sin(e.age * 0.05 + e.phase) * 3;
        e.x += e.vx;
        e.y += e.vy;
        e.fireTimer--;
        if (e.fireTimer <= 0 && e.y > 0) {
          fireEnemyBullet(e, 0, 3.5);
          e.fireTimer = e.fireRate;
        }
        break;

      case 'fighter':
        e.x += Math.sin(e.age * 0.03 + e.phase) * 1;
        e.y += e.vy;
        e.fireTimer--;
        if (e.fireTimer <= 0 && e.y > 0) {
          // Burst fire -- aim at nearest player
          const aimDx = tgt.x - e.x;
          const aimDy = tgt.y - e.y;
          const aimAngle = Math.atan2(aimDx, aimDy);
          for (let b = 0; b < 3; b++) {
            setTimeout(() => {
              if (e.hp > 0) {
                fireEnemyBullet(e, aimAngle + (b - 1) * 0.05, 4);
              }
            }, b * 80);
          }
          e.fireTimer = e.fireRate;
        }
        break;

      case 'bomber':
        e.x += Math.sin(e.age * 0.02 + e.phase) * 0.5;
        e.y += e.vy;
        e.fireTimer--;
        if (e.fireTimer <= 0 && e.y > 0) {
          // Area bombs - spread aimed downward
          const baseAngle = Math.atan2(tgt.x - e.x, tgt.y - e.y);
          for (let a = -2; a <= 2; a++) {
            fireEnemyBullet(e, baseAngle + a * 0.25, 2.5);
          }
          e.fireTimer = e.fireRate;
        }
        break;

      case 'ace': {
        // Dodge bullets
        let dodgeX = 0;
        for (const b of bullets) {
          if (Math.abs(b.x - e.x) < 40 && b.y < e.y && b.y > e.y - 120) {
            dodgeX += (b.x < e.x ? 3 : -3);
          }
        }
        e.vx = Math.sin(e.age * 0.04 + e.phase) * 2.5 + dodgeX * 0.3;
        e.x += e.vx;
        e.y += e.vy;
        e.fireTimer--;
        if (e.fireTimer <= 0 && e.y > 0) {
          fireHomingMissile(e);
          e.fireTimer = e.fireRate;
        }
        break;
      }

      case 'zombie': {
        // Relentless homing toward nearest player
        const zdx = tgt.x - e.x;
        const zdy = tgt.y - e.y;
        const zdist = Math.hypot(zdx, zdy) || 1;
        // Adjust velocity toward player
        e.vx += (zdx / zdist) * 0.08;
        e.vy += (zdy / zdist) * 0.08;
        // Cap speed
        const zspeed = Math.hypot(e.vx, e.vy);
        const zmaxSpeed = 2.5;
        if (zspeed > zmaxSpeed) {
          e.vx = (e.vx / zspeed) * zmaxSpeed;
          e.vy = (e.vy / zspeed) * zmaxSpeed;
        }
        // Wobble animation
        e.wobblePhase = (e.wobblePhase || 0) + 0.1;
        e.x += e.vx + Math.sin(e.wobblePhase) * 0.8;
        e.y += e.vy;
        // Green smoke trail
        if (gameTime % 3 === 0) {
          spawnParticle(
            e.x + (Math.random() - 0.5) * 10,
            e.y + e.h / 2,
            (Math.random() - 0.5) * 0.5,
            1 + Math.random(),
            Math.random() > 0.5 ? '#44ff44' : '#22aa22',
            2 + Math.random() * 3,
            15 + Math.random() * 10
          );
        }
        break;
      }

      case 'boss': {
        // Move to target Y
        if (e.y < e.targetY) {
          e.y += e.vy;
        } else {
          e.vy = 0;
          e.bossTimer++;

          // Phase patterns
          const phase = Math.floor(e.bossTimer / 180) % 3;
          switch (phase) {
            case 0: // Sweep
              e.x += Math.sin(e.bossTimer * 0.02) * 3;
              if (e.bossTimer % 15 === 0) {
                for (let a = -3; a <= 3; a++) {
                  fireEnemyBullet(e, a * 0.15, 3);
                }
              }
              break;
            case 1: // Track nearest player
              e.x += (tgt.x - e.x) * 0.02;
              if (e.bossTimer % 8 === 0) {
                const a = Math.atan2(tgt.x - e.x, tgt.y - e.y);
                fireEnemyBullet(e, a, 5);
              }
              break;
            case 2: // Burst + homing
              e.x += Math.sin(e.bossTimer * 0.015) * 2;
              if (e.bossTimer % 40 === 0) {
                for (let a = 0; a < 12; a++) {
                  fireEnemyBullet(e, a * TAU / 12 + e.bossTimer * 0.01, 2.5);
                }
              }
              if (e.bossTimer % 90 === 0) {
                fireHomingMissile(e);
              }
              break;
          }
        }
        e.x = Math.max(e.w, Math.min(W - e.w, e.x));

        // Boss smoke when damaged
        if (e.hp < e.maxHp * 0.5) {
          if (gameTime % 3 === 0) spawnSmokeTrail(e.x + (Math.random() - 0.5) * e.w, e.y);
        }

        // Engine trail
        if (gameTime % 2 === 0) {
          spawnEngineTrail(e.x - 20, e.y + e.h / 2, 0.5);
          spawnEngineTrail(e.x + 20, e.y + e.h / 2, 0.5);
        }
        break;
      }
    }

    // Clamp X (not for zombies — they enter from sides)
    if (e.type !== 'zombie') {
      e.x = Math.max(e.w / 2, Math.min(W - e.w / 2, e.x));
    }

    // Engine trails for non-boss, non-zombie (zombies have green smoke)
    if (e.type !== 'boss' && e.type !== 'zombie' && gameTime % 3 === 0) {
      spawnEngineTrail(e.x, e.y + e.h / 2, 0.3);
    }

    // Smoking when damaged
    if (e.hp < e.maxHp * 0.4 && !e.smoking) e.smoking = true;
    if (e.smoking && gameTime % 4 === 0) {
      spawnSmokeTrail(e.x + (Math.random() - 0.5) * e.w * 0.5, e.y);
    }

    // Remove if offscreen (zombies can come from sides, use wider bounds)
    if (e.y > H + 100 || e.y < -200 || e.x < -200 || e.x > W + 200) {
      enemies.splice(i, 1);
    }
  }

  // ── Bullet-Enemy Collisions ──
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (rectCollide(b.x, b.y, b.w, b.h, e.x, e.y, e.w, e.h)) {
        e.hp -= b.damage;
        bullets.splice(bi, 1);
        playHitSound();

        // Hit flash particle
        for (let p = 0; p < 3; p++) {
          spawnParticle(b.x, b.y, (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3,
            '#ffff88', 2, 5);
        }

        if (e.hp <= 0) {
          const pts = e.scoreValue * scoreMultiplier;
          score += pts;
          totalKills++;
          comboCount++;
          comboTimer = 90;

          if (comboCount >= 3) {
            spawnFloatingText(e.x, e.y - 20, `x${comboCount} COMBO!`, '#ffdd00', 22);
          }
          spawnFloatingText(e.x, e.y, `+${pts}`, '#fff', 16);

          const explosionSize = e.type === 'boss' ? 60 : e.type === 'bomber' ? 35 : 20;
          if (e.type === 'zombie') {
            spawnGreenExplosion(e.x, e.y, explosionSize, 20);
          } else {
            spawnExplosion(e.x, e.y, explosionSize, e.type === 'boss' ? 60 : 25);
          }
          maybeDropPowerup(e.x, e.y);

          enemies.splice(ei, 1);

          // Check wave clear (only if not night mode — night has its own timer)
          if (!isNightMode && enemies.length === 0 && waveEnemiesLeft <= 0) {
            waveTimer = 120; // Calm before next wave
          }
        }
        break;
      }
    }
  }

  // ── Enemy Bullet-Player Collisions (both players) ──
  const playersToCheck = [];
  if (player.alive && player.invulnTimer <= 0) playersToCheck.push({ p: player, isP2: false });
  if (player2.alive && player2.invulnTimer <= 0) playersToCheck.push({ p: player2, isP2: true });

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    let hit = false;
    for (const { p, isP2 } of playersToCheck) {
      if (rectCollide(b.x, b.y, b.w, b.h, p.x, p.y, p.w * 0.6, p.h * 0.6)) {
        enemyBullets.splice(i, 1);
        damagePlayer(p, isP2, b.isHoming ? 15 : 8);
        hit = true;
        break;
      }
    }
    if (hit) continue;
  }

  // ── Enemy-Player Collision (both players) ──
  for (const { p, isP2 } of playersToCheck) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (rectCollide(p.x, p.y, p.w * 0.5, p.h * 0.5, e.x, e.y, e.w * 0.5, e.h * 0.5)) {
        const ramDmg = e.type === 'zombie' ? 25 : 20; // zombies hit harder on ram
        damagePlayer(p, isP2, ramDmg);
        p.invulnTimer = 30;
        e.hp -= (e.type === 'zombie' ? e.hp : 5); // zombies die on ram
        shakeAmount = 10;
        if (e.type === 'zombie') {
          spawnGreenExplosion((p.x + e.x) / 2, (p.y + e.y) / 2, 15, 10);
        } else {
          spawnExplosion((p.x + e.x) / 2, (p.y + e.y) / 2, 15, 10);
        }
        if (e.hp <= 0) {
          if (e.type === 'zombie') {
            spawnGreenExplosion(e.x, e.y, 20, 15);
          } else {
            spawnExplosion(e.x, e.y, 20, 15);
          }
          totalKills++;
          score += e.scoreValue;
          enemies.splice(i, 1);
        }
      }
    }
  }

  // ── Power-ups (both players can collect) ──
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pw = powerups[i];
    pw.y += pw.vy;
    pw.pulse += 0.08;
    pw.life--;
    if (pw.life <= 0 || pw.y > H + 20) {
      powerups.splice(i, 1);
      continue;
    }
    let collected = false;
    const collectors = [];
    if (player.alive) collectors.push(player);
    if (player2.alive) collectors.push(player2);
    for (const p of collectors) {
      if (rectCollide(p.x, p.y, p.w, p.h, pw.x, pw.y, pw.size * 2, pw.size * 2)) {
        playPowerupSound();
        switch (pw.type) {
          case 'health':
            p.hp = Math.min(p.maxHp, p.hp + 30);
            spawnFloatingText(pw.x, pw.y, '+30 HP', '#44ff44', 18);
            break;
          case 'rapidfire':
            rapidFireTimer = 480;
            spawnFloatingText(pw.x, pw.y, 'RAPID FIRE!', '#44aaff', 18);
            break;
          case 'missile':
            p.missiles += 3;
            spawnFloatingText(pw.x, pw.y, '+3 MISSILES', '#ff4444', 18);
            break;
          case 'shield':
            p.shield = 3;
            spawnFloatingText(pw.x, pw.y, 'SHIELD x3', '#44ddff', 18);
            break;
          case 'multiplier':
            scoreMultiplier = 2;
            multiplierTimer = 600;
            spawnFloatingText(pw.x, pw.y, 'SCORE x2!', '#ddaa00', 18);
            break;
        }
        powerups.splice(i, 1);
        collected = true;
        break;
      }
    }
    if (collected) continue;
  }

  // ── Particles ──
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // ── Explosions (shockwaves) ──
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i];
    e.life--;
    e.radius += (e.maxRadius - e.radius) * 0.15;
    e.alpha = (e.life / e.maxLife) * 0.6;
    if (e.life <= 0) explosions.splice(i, 1);
  }

  // ── Floating Texts ──
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y += t.vy;
    t.life--;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }

  // ── Wave spawning ──
  if (gameState === STATE.PLAYING && waveEnemiesLeft > 0) {
    waveSpawnTimer--;
    if (waveSpawnTimer <= 0) {
      spawnWaveEnemy();
      waveSpawnTimer = wave % 5 === 0 ? 10 : 30 + Math.random() * 40;
    }
  }

  // ── Wave completion (day mode only — night mode uses roundTimer) ──
  if (gameState === STATE.PLAYING && !isNightMode && enemies.length === 0 && waveEnemiesLeft <= 0 && waveTimer > 0) {
    waveTimer--;
    if (waveTimer <= 0) {
      startWave(wave + 1);
    }
  }

  // ── Background scrolling ──
  for (const s of stars) {
    s.y += s.speed;
    s.twinkle += 0.05;
    if (s.y > H + 10) { s.y = -10; s.x = Math.random() * W; }
  }
  for (const c of clouds) {
    c.y += c.speed;
    if (c.y > H + 100) { c.y = -c.h - 50; c.x = Math.random() * W - 100; }
  }
}

// ─── Drawing Functions ──────────────────────────────────────────

function lerpColor(r1,g1,b1, r2,g2,b2, t) {
  return [
    Math.round(r1 + (r2 - r1) * t),
    Math.round(g1 + (g2 - g1) * t),
    Math.round(b1 + (b2 - b1) * t)
  ];
}

function rgbStr(r,g,b) { return `rgb(${r},${g},${b})`; }

function drawBackground() {
  const nb = nightBlend; // 0 = day, 1 = night

  // Sky gradient colors: lerp between day and night
  // Day:   #1a6dd4 -> #3a8ee6 -> #62aaf0 -> #8ec5f6 -> #c4dff7
  // Night: #050a18 -> #0a1228 -> #101830 -> #141e38 -> #1a2440
  const skyStops = [
    lerpColor(0x1a,0x6d,0xd4, 0x05,0x0a,0x18, nb),
    lerpColor(0x3a,0x8e,0xe6, 0x0a,0x12,0x28, nb),
    lerpColor(0x62,0xaa,0xf0, 0x10,0x18,0x30, nb),
    lerpColor(0x8e,0xc5,0xf6, 0x14,0x1e,0x38, nb),
    lerpColor(0xc4,0xdf,0xf7, 0x1a,0x24,0x40, nb),
  ];

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, rgbStr(...skyStops[0]));
  grad.addColorStop(0.25, rgbStr(...skyStops[1]));
  grad.addColorStop(0.5, rgbStr(...skyStops[2]));
  grad.addColorStop(0.75, rgbStr(...skyStops[3]));
  grad.addColorStop(1, rgbStr(...skyStops[4]));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars (only visible at night)
  if (nb > 0.1) {
    const starAlpha = Math.max(0, (nb - 0.1) / 0.9);
    for (const s of stars) {
      const twinkle = 0.5 + Math.sin(s.twinkle) * 0.5;
      ctx.fillStyle = `rgba(255, 255, 255, ${starAlpha * s.brightness * twinkle})`;
      ctx.beginPath();
      ctx.arc(s.x % W, s.y % H, s.size * 0.8, 0, TAU);
      ctx.fill();
    }
  }

  // Sun (fades out during night) / Moon (fades in during night)
  const sunX = W * 0.78;
  const sunY = H * 0.08;
  const sunAlpha = 1 - nb;
  const moonX = W * 0.22;
  const moonY = H * 0.1;
  const moonAlpha = nb;

  if (sunAlpha > 0.01) {
    // Sun glow
    const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, H * 0.4);
    sunGlow.addColorStop(0, `rgba(255, 255, 230, ${0.9 * sunAlpha})`);
    sunGlow.addColorStop(0.05, `rgba(255, 250, 200, ${0.5 * sunAlpha})`);
    sunGlow.addColorStop(0.15, `rgba(255, 240, 180, ${0.15 * sunAlpha})`);
    sunGlow.addColorStop(0.4, `rgba(255, 230, 160, ${0.04 * sunAlpha})`);
    sunGlow.addColorStop(1, 'rgba(255, 230, 160, 0)');
    ctx.fillStyle = sunGlow;
    ctx.fillRect(0, 0, W, H);

    // Sun disc
    ctx.fillStyle = `rgba(255, 255, 240, ${0.95 * sunAlpha})`;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 18, 0, TAU);
    ctx.fill();
  }

  if (moonAlpha > 0.01) {
    // Moon glow (silvery)
    const moonGlow = ctx.createRadialGradient(moonX, moonY, 8, moonX, moonY, H * 0.3);
    moonGlow.addColorStop(0, `rgba(200, 210, 255, ${0.6 * moonAlpha})`);
    moonGlow.addColorStop(0.05, `rgba(180, 195, 240, ${0.3 * moonAlpha})`);
    moonGlow.addColorStop(0.15, `rgba(150, 170, 220, ${0.08 * moonAlpha})`);
    moonGlow.addColorStop(0.4, `rgba(120, 140, 200, ${0.02 * moonAlpha})`);
    moonGlow.addColorStop(1, 'rgba(120, 140, 200, 0)');
    ctx.fillStyle = moonGlow;
    ctx.fillRect(0, 0, W, H);

    // Moon disc
    ctx.fillStyle = `rgba(220, 225, 245, ${0.9 * moonAlpha})`;
    ctx.beginPath();
    ctx.arc(moonX, moonY, 14, 0, TAU);
    ctx.fill();
    // Moon craters (subtle)
    ctx.fillStyle = `rgba(180, 185, 210, ${0.5 * moonAlpha})`;
    ctx.beginPath();
    ctx.arc(moonX - 3, moonY - 2, 3, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(moonX + 4, moonY + 3, 2, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(moonX - 1, moonY + 5, 1.5, 0, TAU);
    ctx.fill();

    // Eerie green/purple atmospheric glow at bottom
    const eerieGlow = ctx.createLinearGradient(0, H * 0.7, 0, H);
    eerieGlow.addColorStop(0, `rgba(20, 80, 40, 0)`);
    eerieGlow.addColorStop(0.5, `rgba(20, 80, 40, ${0.06 * moonAlpha})`);
    eerieGlow.addColorStop(1, `rgba(40, 20, 60, ${0.1 * moonAlpha})`);
    ctx.fillStyle = eerieGlow;
    ctx.fillRect(0, 0, W, H);
  }

  // Old wispy clouds (background layer) - darken during night
  for (const c of clouds) {
    const cloudR = Math.round(255 - nb * 195); // 255 -> 60
    const cloudG = Math.round(255 - nb * 195);
    const cloudB = Math.round(255 - nb * 185); // 255 -> 70
    ctx.fillStyle = `rgba(${cloudR}, ${cloudG}, ${cloudB}, ${c.alpha * 0.5})`;
    ctx.beginPath();
    ctx.ellipse(c.x % (W + 400), c.y % (H + 200), c.w / 2, c.h / 2, 0, 0, TAU);
    ctx.fill();
  }

  // Puffy cumulus clouds - dark grey silhouettes at night
  for (const c of puffyClouds) {
    const bx = c.x % (W + 500) - 100;
    const by = c.y;
    const a = c.alpha;

    // Shadow layer
    const shR = Math.round(160 - nb * 130);
    const shG = Math.round(175 - nb * 145);
    const shB = Math.round(195 - nb * 155);
    for (const p of c.puffs) {
      ctx.fillStyle = `rgba(${shR}, ${shG}, ${shB}, ${a * 0.3})`;
      ctx.beginPath();
      ctx.ellipse(bx + p.ox + 4, by + p.oy + 3, p.rw / 2, p.rh / 2, 0, 0, TAU);
      ctx.fill();
    }
    // Main body
    const mainR = Math.round(255 - nb * 215);
    const mainG = Math.round(255 - nb * 215);
    const mainB = Math.round(255 - nb * 205);
    for (const p of c.puffs) {
      ctx.fillStyle = `rgba(${mainR}, ${mainG}, ${mainB}, ${a * 0.85})`;
      ctx.beginPath();
      ctx.ellipse(bx + p.ox, by + p.oy, p.rw / 2, p.rh / 2, 0, 0, TAU);
      ctx.fill();
    }
    // Highlight (top-left lit by sun/moon)
    const hiR = Math.round(255 - nb * 195);
    const hiG = Math.round(255 - nb * 195);
    const hiB = Math.round(255 - nb * 175);
    for (const p of c.puffs) {
      ctx.fillStyle = `rgba(${hiR}, ${hiG}, ${hiB}, ${a * 0.5 * (1 - nb * 0.5)})`;
      ctx.beginPath();
      ctx.ellipse(bx + p.ox - p.rw * 0.12, by + p.oy - p.rh * 0.15, p.rw * 0.35, p.rh * 0.3, 0, 0, TAU);
      ctx.fill();
    }
  }

  // Green lightning flash overlay (during night)
  if (greenLightningAlpha > 0.005) {
    ctx.fillStyle = `rgba(40, 255, 60, ${greenLightningAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// Lookup for jet draw functions
const JET_DRAW_FNS = {
  drawJetF14, drawJetF22, drawJetF35, drawJetSu57, drawJetA10, drawJetSR71
};

// Parameterized jet drawing: colorScheme 1 = P1 red, 2 = P2 pink
function drawPlayerJetGeneric(x, y, bank, p, colorScheme) {
  if (!p.alive) return;
  if (p.invulnTimer > 0 && p.barrelRollTimer <= 0 && Math.floor(gameTime / 3) % 2 === 0) return; // Flash (not during barrel roll)

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(bank);

  // Barrel roll visual: simulate 3D spin by oscillating scaleX through cos()
  let rollScaleX;
  if (p.barrelRollTimer > 0) {
    rollScaleX = Math.cos(p.barrelRollAngle);
  } else {
    rollScaleX = 1 - Math.abs(bank) * 1.5;
  }
  ctx.scale(rollScaleX, 1);

  // Color palette from picker
  const c = colorScheme === 2 ? JET_COLORS[p2ColorIndex] : JET_COLORS[p1ColorIndex];
  const shieldColor = c.shield, abInner = c.abI, abMid = c.abM, abOuter = c.abO;

  // Determine jet type
  const jetIdx = colorScheme === 2 ? p2JetIndex : p1JetIndex;
  const jetType = JET_TYPES[jetIdx];

  // Shield glow
  if (p.shield > 0) {
    ctx.strokeStyle = shieldColor + `${0.4 + Math.sin(gameTime * 0.1) * 0.2})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 28, 30, 0, 0, TAU);
    ctx.stroke();
  }

  // Afterburner glow
  const abIntensity = p.afterburner;
  if (abIntensity > 0.2) {
    const flameLen = 12 + abIntensity * 20 + Math.random() * 6;
    // Left engine
    const g1 = ctx.createRadialGradient(-6, 20, 2, -6, 20 + flameLen / 2, flameLen / 2);
    g1.addColorStop(0, `rgba(${abInner}, ${abIntensity * 0.8})`);
    g1.addColorStop(0.3, `rgba(${abMid}, ${abIntensity * 0.6})`);
    g1.addColorStop(0.7, `rgba(${abOuter}, ${abIntensity * 0.4})`);
    g1.addColorStop(1, 'rgba(255, 60, 0, 0)');
    ctx.fillStyle = g1;
    ctx.beginPath();
    ctx.moveTo(-9, 18);
    ctx.lineTo(-6, 18 + flameLen);
    ctx.lineTo(-3, 18);
    ctx.fill();
    // Right engine
    const g2 = ctx.createRadialGradient(6, 20, 2, 6, 20 + flameLen / 2, flameLen / 2);
    g2.addColorStop(0, `rgba(${abInner}, ${abIntensity * 0.8})`);
    g2.addColorStop(0.3, `rgba(${abMid}, ${abIntensity * 0.6})`);
    g2.addColorStop(0.7, `rgba(${abOuter}, ${abIntensity * 0.4})`);
    g2.addColorStop(1, 'rgba(255, 60, 0, 0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.moveTo(3, 18);
    ctx.lineTo(6, 18 + flameLen);
    ctx.lineTo(9, 18);
    ctx.fill();
  }

  // Draw the jet type-specific shape
  const drawFn = JET_DRAW_FNS[jetType.drawFn];
  drawFn(ctx, c);

  ctx.restore();
}

// Convenience wrappers
function drawPlayerJet(x, y, bank) {
  drawPlayerJetGeneric(x, y, bank, player, 1);
}

function drawPlayer2Jet(x, y, bank) {
  drawPlayerJetGeneric(x, y, bank, player2, 2);
}

function drawEnemyJet(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(PI); // Face downward

  // Rotate based on horizontal velocity
  const bank = (e.vx || 0) * 3 * DEG;
  ctx.rotate(bank);

  const scale = e.type === 'boss' ? 1 : 1;
  ctx.scale(scale, scale);

  switch (e.type) {
    case 'scout':
      drawScoutJet();
      break;
    case 'fighter':
      drawFighterJet();
      break;
    case 'bomber':
      drawBomberJet();
      break;
    case 'ace':
      drawAceJet();
      break;
    case 'zombie':
      drawZombieJet(e);
      break;
    case 'boss':
      drawBossJet(e);
      break;
  }

  ctx.restore();
}

  ctx.beginPath();

  ctx.lineTo(12, 5); // jagged tear

  ctx.lineTo(-3, 16);

  // Tail fins
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.moveTo(-10, 28);
  ctx.lineTo(-22, 40);
  ctx.lineTo(-10, 35);
  ctx.closePath();

  ctx.beginPath();
  ctx.moveTo(10, 28);
  ctx.lineTo(22, 40);
  ctx.lineTo(10, 35);
  ctx.closePath();
  ctx.fill();

  // Red glow (more intense as damaged)
  const glowAlpha = 0.3 + (1 - hpRatio) * 0.5;
  ctx.fillStyle = `rgba(255, 0, 0, ${glowAlpha})`;
  ctx.beginPath();
  ctx.ellipse(0, -20, 6, 8, 0, 0, TAU);

  // Cockpit

  ctx.ellipse(-1, -27, 2, 3, 0, 0, TAU);

  // Damage marks
  if (hpRatio < 0.7) {
    ctx.fillStyle = '#333';

    ctx.arc(-8, 5, 4, 0, TAU);

    ctx.arc(12, -5, 5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ff4400';
    ctx.beginPath();
    ctx.arc(12, -5, 3, 0, TAU);
    ctx.fill();
  }
}

function drawBullets() {
  for (const b of bullets) {
    if (b.isMissile) {
      ctx.fillStyle = '#fff';
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx) + PI / 2);
      ctx.fillRect(-2, -8, 4, 16);
      ctx.fillStyle = '#ff4400';
      ctx.fillRect(-1.5, 4, 3, 6);
      ctx.restore();
    } else {
      // Tracer bullet
      const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.5, '#ffdd44');
      grad.addColorStop(1, 'rgba(255, 200, 50, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(b.x - b.w / 2, b.y, b.w, b.h);

      // Glow
      ctx.fillStyle = 'rgba(255, 255, 200, 0.3)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4, 0, TAU);
      ctx.fill();
    }
  }
}

function drawEnemyBullets() {
  for (const b of enemyBullets) {
    if (b.isHoming) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx) - PI / 2);
      ctx.fillStyle = '#ff2222';
      ctx.fillRect(-2.5, -6, 5, 12);
      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(-1.5, 4, 3, 5);
      ctx.restore();
    } else {
      // Brighter tracers during night
      if (isNightMode && nightBlend > 0.5) {
        ctx.fillStyle = '#ff6666';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.w / 2 + 0.5, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 150, 150, 0.5)';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.w * 1.3, 0, TAU);
        ctx.fill();
      } else {
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.w / 2, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 100, 100, 0.4)';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.w, 0, TAU);
        ctx.fill();
      }
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.5 + alpha * 0.5), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawExplosionRings() {
  for (const e of explosions) {
    ctx.strokeStyle = `rgba(255, 200, 100, ${e.alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, TAU);
    ctx.stroke();

    ctx.strokeStyle = `rgba(255, 255, 255, ${e.alpha * 0.5})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius * 0.7, 0, TAU);
    ctx.stroke();
  }
}

function drawPowerups() {
  for (const p of powerups) {
    const pulse = 1 + Math.sin(p.pulse) * 0.15;
    const s = p.size * pulse;

    // Glow
    ctx.fillStyle = getpowerupGlowColor(p.type);
    ctx.beginPath();
    ctx.arc(p.x, p.y, s + 4, 0, TAU);
    ctx.fill();

    // Background
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(p.x, p.y, s, 0, TAU);
    ctx.fill();

    // Icon
    ctx.fillStyle = getPowerupColor(p.type);
    ctx.font = `bold ${s}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(getPowerupIcon(p.type), p.x, p.y);
  }
}

function getPowerupColor(type) {
  switch (type) {
    case 'health': return '#44ff44';
    case 'rapidfire': return '#44aaff';
    case 'missile': return '#ff4444';
    case 'shield': return '#44ddff';
    case 'multiplier': return '#ffdd00';
  }
}

function getpowerupGlowColor(type) {
  switch (type) {
    case 'health': return 'rgba(68, 255, 68, 0.2)';
    case 'rapidfire': return 'rgba(68, 170, 255, 0.2)';
    case 'missile': return 'rgba(255, 68, 68, 0.2)';
    case 'shield': return 'rgba(68, 220, 255, 0.2)';
    case 'multiplier': return 'rgba(255, 220, 0, 0.2)';
  }
}

function getPowerupIcon(type) {
  switch (type) {
    case 'health': return '+';
    case 'rapidfire': return '\u26A1';
    case 'missile': return '\u25B2';
    case 'shield': return '\u25C6';
    case 'multiplier': return '\u2605';
  }
}

function drawFloatingTexts() {
  for (const t of floatingTexts) {
    const alpha = t.life / t.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = t.color;
    ctx.font = `bold ${t.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

  // Boss health bar
  for (const e of enemies) {

      ctx.fillStyle = bossRatio > 0.5 ? '#cc2200' : '#ff4400';

    ctx.textAlign = 'center';
    ctx.fillText('P2 RESPAWNING...', W * 0.7, H * 0.5);

  // Minimap
  drawMinimap();

function drawMinimap() {
  const mW = 80, mH = 100;
  const mX = W - mW - 15, mY = H - mH - 15;
  ctx.fillStyle = 'rgba(0, 10, 30, 0.6)';
  ctx.strokeStyle = 'rgba(100, 150, 200, 0.4)';
  ctx.lineWidth = 1;
  roundRect(mX, mY, mW, mH, 4);
  ctx.fill();
  roundRect(mX, mY, mW, mH, 4);
  ctx.stroke();

  // P1 dot
  if (player.alive) {
    const px = mX + (player.x / W) * mW;
    const py = mY + (player.y / H) * mH;
    ctx.fillStyle = JET_COLORS[p1ColorIndex].swatch;
    ctx.beginPath();
    ctx.arc(px, py, 2.5, 0, TAU);
    ctx.fill();
  }

  // P2 dot
  if (player2.alive) {
    const px2 = mX + (player2.x / W) * mW;
    const py2 = mY + (player2.y / H) * mH;
    ctx.fillStyle = JET_COLORS[p2ColorIndex].swatch;
    ctx.beginPath();
    ctx.arc(px2, py2, 2.5, 0, TAU);
    ctx.fill();
  }

  // Enemy dots
  for (const e of enemies) {
    const ex = mX + (e.x / W) * mW;
    const ey = mY + (e.y / H) * mH;
    if (ey < mY || ey > mY + mH) continue;
    ctx.fillStyle = e.type === 'boss' ? '#ff0000' : '#ff6644';
    const s = e.type === 'boss' ? 3 : 1.5;
    ctx.beginPath();
    ctx.arc(ex, ey, s, 0, TAU);
    ctx.fill();
  }

  // Power-up dots
  for (const p of powerups) {
    const ppx = mX + (p.x / W) * mW;
    const ppy = mY + (p.y / H) * mH;
    ctx.fillStyle = getPowerupColor(p.type);
    ctx.beginPath();
    ctx.arc(ppx, ppy, 1.5, 0, TAU);
    ctx.fill();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
