    const isP1Selected = (i === p1JetIndex);
    // Card background
    ctx.fillStyle = isP1Selected ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)';
    ctx.fillRect(p1cx, rowY, jetCardW, jetCardH);
    if (isP1Selected) {
      ctx.strokeStyle = JET_COLORS[p1ColorIndex].swatch;
      ctx.lineWidth = 2;
      ctx.strokeRect(p1cx, rowY, jetCardW, jetCardH);
    }
    // Draw jet preview
    ctx.save();
    ctx.translate(p1cx + jetCardW / 2, rowY + 22);
    ctx.scale(0.6, 0.6);
    const drawFnP1 = JET_DRAW_FNS[jt.drawFn];
    drawFnP1(ctx, JET_COLORS[p1ColorIndex]);
    ctx.restore();
    // Name below preview
    ctx.fillStyle = isP1Selected ? '#fff' : '#888';
    ctx.font = '7px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(jt.name.split(' ')[0], p1cx + jetCardW / 2, rowY + jetCardH - 3);
    jetPickerAreas.push({ x: p1cx, y: rowY, w: jetCardW, h: jetCardH, player: 1, jetIndex: i });

    // ── P2 card ──
    const p2cx = jpX + jetCardW + jetGap;
    const isP2Selected = (i === p2JetIndex);
    ctx.fillStyle = isP2Selected ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)';
    ctx.fillRect(p2cx, rowY, jetCardW, jetCardH);
    if (isP2Selected) {
      ctx.strokeStyle = JET_COLORS[p2ColorIndex].swatch;
      ctx.lineWidth = 2;
      ctx.strokeRect(p2cx, rowY, jetCardW, jetCardH);
    }
    // Draw jet preview
    ctx.save();
    ctx.translate(p2cx + jetCardW / 2, rowY + 22);
    ctx.scale(0.6, 0.6);
    const drawFnP2 = JET_DRAW_FNS[jt.drawFn];
    drawFnP2(ctx, JET_COLORS[p2ColorIndex]);
    ctx.restore();
    ctx.fillStyle = isP2Selected ? '#fff' : '#888';
    ctx.font = '7px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(jt.name.split(' ')[0], p2cx + jetCardW / 2, rowY + jetCardH - 3);
    jetPickerAreas.push({ x: p2cx, y: rowY, w: jetCardW, h: jetCardH, player: 2, jetIndex: i });

    // ── Stats & info (right of cards) ──
    const infoX = p2cx + jetCardW + 12;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ccc';
    ctx.font = 'bold 10px Arial';
    ctx.fillText(jt.name, infoX, rowY + 12);
    ctx.fillStyle = '#888';
    ctx.font = '9px Arial';
    ctx.fillText(jt.desc, infoX, rowY + 24);

    // Stat bars
    const barX = infoX;
    const barW = 80;
    const barH = 5;
    const stats = [
      { label: 'SPD', value: jt.speed, max: 10, color: '#44aaff' },
      { label: 'HP',  value: jt.maxHp, max: 180, color: '#44ff44' },
      { label: 'FPW', value: 10 - jt.fireRate + 1, max: 10, color: '#ff8844' }, // Lower fireRate = faster = higher bar
      { label: 'MSL', value: jt.missiles, max: 10, color: '#ff4444' },
    ];
    stats.forEach((s, si) => {
      const sy = rowY + 32 + si * 9;
      ctx.fillStyle = '#666';
      ctx.font = '7px Arial';
      ctx.textAlign = 'left';
      ctx.fillText(s.label, barX, sy + 4);
      // Bar background
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(barX + 24, sy, barW, barH);
      // Bar fill
      ctx.fillStyle = s.color;
      ctx.fillRect(barX + 24, sy, barW * (s.value / s.max), barH);
    });
  }

  // High score
  if (highScore > 0) {
    ctx.fillStyle = '#ffdd44';
    ctx.font = `bold ${Math.min(18, W * 0.025)}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(`HIGH SCORE: ${highScore.toLocaleString()}`, W / 2, H * 0.92);
  }

  ctx.restore();
}

function drawGameOverScreen() {
  // Darken
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ff4444';
  ctx.font = `bold ${Math.min(56, W * 0.07)}px Arial`;
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 20;
  ctx.fillText('GAME OVER', W / 2, H * 0.3);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(28, W * 0.035)}px Arial`;
  ctx.fillText(`SCORE: ${score.toLocaleString()}`, W / 2, H * 0.42);

  ctx.font = `${Math.min(18, W * 0.025)}px Arial`;
  ctx.fillStyle = '#aaa';
  ctx.fillText(`Waves Survived: ${wave}`, W / 2, H * 0.50);
  ctx.fillText(`Enemies Destroyed: ${totalKills}`, W / 2, H * 0.55);

  if (score >= highScore && score > 0) {
    ctx.fillStyle = '#ffdd44';
    ctx.font = `bold ${Math.min(20, W * 0.028)}px Arial`;
    ctx.fillText('NEW HIGH SCORE!', W / 2, H * 0.62);
  }

  const pulse = 0.5 + Math.sin(gameTime * 0.06) * 0.5;
  ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
  ctx.font = `bold ${Math.min(20, W * 0.028)}px Arial`;
  ctx.fillText('CLICK OR PRESS SPACE TO RETRY', W / 2, H * 0.74);
}

function drawWaveIntro() {
  const t = 1 - introTimer / 120;
  const alpha = t < 0.2 ? t / 0.2 : t > 0.7 ? (1 - t) / 0.3 : 1;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(48, W * 0.06)}px Arial`;
  ctx.textAlign = 'center';
  ctx.shadowColor = '#4488ff';
  ctx.shadowBlur = 20;
  ctx.fillText(`WAVE ${wave}`, W / 2, H * 0.4);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function drawBossIntro() {
  const t = 1 - introTimer / 180;
  const alpha = t < 0.15 ? t / 0.15 : t > 0.7 ? (1 - t) / 0.3 : 1;

  // Red flash
  if (introTimer > 120 && Math.floor(introTimer / 10) % 2 === 0) {
    ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ff2200';
  ctx.font = `bold ${Math.min(40, W * 0.05)}px Arial`;
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 30;
  ctx.fillText('WARNING', W / 2, H * 0.35);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(52, W * 0.065)}px Arial`;
  ctx.fillText('BOSS INCOMING!', W / 2, H * 0.45);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function drawNightAnnouncement() {
  const maxTimer = 120;
  const t = 1 - nightAnnouncementTimer / maxTimer;
  const alpha = t < 0.15 ? t / 0.15 : t > 0.6 ? (1 - t) / 0.4 : 1;

  // Screen flash at the start
  if (nightAnnouncementTimer > maxTimer - 10) {
    const flashAlpha = (nightAnnouncementTimer - (maxTimer - 10)) / 10;
    if (nightAnnouncementText === 'NIGHT FALLS...') {
      ctx.fillStyle = `rgba(0, 40, 0, ${flashAlpha * 0.3})`;
    } else {
      ctx.fillStyle = `rgba(60, 50, 20, ${flashAlpha * 0.3})`;
    }
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalAlpha = alpha;
  ctx.fillStyle = nightAnnouncementColor;
  ctx.font = `bold ${Math.min(52, W * 0.065)}px Arial`;
  ctx.textAlign = 'center';

  if (nightAnnouncementText === 'NIGHT FALLS...') {
    ctx.shadowColor = '#44ff44';
    ctx.shadowBlur = 30;
  } else {
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 30;
  }

  ctx.fillText(nightAnnouncementText, W / 2, H * 0.4);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function drawPauseScreen() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(48, W * 0.06)}px Arial`;
  ctx.textAlign = 'center';
  ctx.fillText('PAUSED', W / 2, H * 0.45);
  ctx.font = `${Math.min(18, W * 0.025)}px Arial`;
  ctx.fillStyle = '#aaa';
  ctx.fillText('Press P to Resume', W / 2, H * 0.53);
}

// ─── Main Render ────────────────────────────────────────────────
function render() {
  ctx.save();

  // Screen shake
  if (shakeAmount > 0.5) {
    const sx = (Math.random() - 0.5) * shakeAmount;
    const sy = (Math.random() - 0.5) * shakeAmount;
    ctx.translate(sx, sy);
  }

  drawBackground();

  if (gameState === STATE.TITLE) {
    ctx.restore();
    drawTitleScreen();
    return;
  }

  if (gameState === STATE.TAKEOFF) {
    drawRunway();
    drawParticles();
    ctx.restore();
    drawCockpitView();
    drawTakeoffHUD();
    return;
  }

  // Game objects
  drawPowerups();
  drawBullets();
  drawEnemyBullets();

  for (const e of enemies) drawEnemyJet(e);

  drawPlayerJet(player.x, player.y, player.bankAngle);
  drawPlayer2Jet(player2.x, player2.y, player2.bankAngle);
  drawParticles();
  drawExplosionRings();
  drawFloatingTexts();

  ctx.restore();

  // HUD (not shaken)
  drawHUD();

  if (gameState === STATE.WAVE_INTRO) drawWaveIntro();
  if (gameState === STATE.BOSS_INTRO) drawBossIntro();
  if (gameState === STATE.PAUSED) drawPauseScreen();
  if (gameState === STATE.GAMEOVER) drawGameOverScreen();

  // Night/Dawn announcement overlay
  if (nightAnnouncementTimer > 0) {
    drawNightAnnouncement();
  }
}

// ─── Game Loop ──────────────────────────────────────────────────
function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  dt = Math.min((timestamp - lastTime) / 16.667, 2); // cap at 2x speed
  lastTime = timestamp;

  if (gameState !== STATE.PAUSED) {
    // Run update potentially multiple times for consistent physics
    // but typically once per frame
    update();
  }

  // Always update title animations
  if (gameState === STATE.TITLE || gameState === STATE.GAMEOVER) {
    gameTime++;
  }

  render();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>
