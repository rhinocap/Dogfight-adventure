<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dogfight Adventures</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

// ─── Canvas & Context ───────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Constants ──────────────────────────────────────────────────
const PI = Math.PI;
const TAU = PI * 2;
const DEG = PI / 180;

// ─── Game State ─────────────────────────────────────────────────
const STATE = { TITLE: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3, WAVE_INTRO: 4, BOSS_INTRO: 5, TAKEOFF: 6 };
let gameState = STATE.TITLE;
let takeoffTimer = 0;
let takeoffPhase = 0; // 0=spool, 1=roll, 2=rotate, 3=climb
let takeoffSpeed = 0;
let runwayY = 0;
let score = 0;
let highScore = parseInt(localStorage.getItem('dogfight_highscore') || '0');
let wave = 1;
let waveTimer = 0;
let waveEnemiesLeft = 0;
let waveSpawnTimer = 0;
let totalKills = 0;
let comboCount = 0;
let comboTimer = 0;
let scoreMultiplier = 1;
let multiplierTimer = 0;
let rapidFireTimer = 0;
let shakeAmount = 0;
let shakeDecay = 0.9;
let introTimer = 0;
let bossWarningTimer = 0;
let gameTime = 0;
let dt = 0;
let lastTime = 0;
let paused = false;

// ─── Object Pools ───────────────────────────────────────────────
const bullets = [];
const enemyBullets = [];
const enemies = [];
const particles = [];
const powerups = [];
const floatingTexts = [];
const explosions = [];

const POOL_MAX_BULLETS = 200;
const POOL_MAX_PARTICLES = 600;
const POOL_MAX_ENEMY_BULLETS = 150;

// ─── Input ──────────────────────────────────────────────────────
const keys = {};
let inputFrame = 0;
let mouseX = 0, mouseY = 0;
let mouseDown = false;

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});
canvas.addEventListener('mousedown', e => {
  if (e.button === 0) { // left click
    if (gameState === STATE.TITLE || gameState === STATE.GAMEOVER) {
      startGame();
      mouseDown = false;
    } else {
      mouseDown = true;
    }
  }
  if (e.button === 2 && gameState === STATE.PLAYING) { // right click
    fireMissile();
  }
});
canvas.addEventListener('mouseup', e => {
  if (e.button === 0) mouseDown = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyP' && gameState === STATE.PLAYING) {
    gameState = STATE.PAUSED;
    e.preventDefault();
  } else if (e.code === 'KeyP' && gameState === STATE.PAUSED) {
    gameState = STATE.PLAYING;
    e.preventDefault();
  }
  // Barrel roll: Q = roll left, E = roll right
  if (gameState === STATE.PLAYING && player.alive && player.barrelRollTimer <= 0) {
    if (e.code === 'KeyQ') startBarrelRoll(-1);
    if (e.code === 'KeyE') startBarrelRoll(1);
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── Audio System ───────────────────────────────────────────────
let audioCtx = null;
let masterGain = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.3;
  masterGain.connect(audioCtx.destination);
}

function playNoise(duration, freq, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = freq;
  osc.type = type || 'sawtooth';
  osc.frequency.value = freq * 0.5;
  gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playGunSound() {
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * 0.04;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.06;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 800;
  src.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  src.start();
}

function playMissileSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 400;
  filter.Q.value = 2;
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);

  // Noise whoosh
  const bufSize = audioCtx.sampleRate * 0.3;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
  const ns = audioCtx.createBufferSource();
  ns.buffer = buf;
  const ng = audioCtx.createGain();
  ng.gain.value = 0.08;
  const nf = audioCtx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = 1200;
  ns.connect(nf);
  nf.connect(ng);
  ng.connect(masterGain);
  ns.start();
}

function playExplosionSound(big) {
  if (!audioCtx) return;
  const dur = big ? 0.8 : 0.4;
  const bufSize = audioCtx.sampleRate * dur;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) {
    d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.3));
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const gain = audioCtx.createGain();
  gain.gain.value = big ? 0.2 : 0.12;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(big ? 600 : 900, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + dur);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  src.start();

  // Sub bass
  const osc = audioCtx.createOscillator();
  const og = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(80, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + dur);
  og.gain.setValueAtTime(big ? 0.25 : 0.12, audioCtx.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(og);
  og.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function playPowerupSound() {
  if (!audioCtx) return;
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f;
    gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.06);
    gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + i * 0.06 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.06 + 0.15);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(audioCtx.currentTime + i * 0.06);
    osc.stop(audioCtx.currentTime + i * 0.06 + 0.15);
  });
}

function playHitSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = 1200;
  gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

function playBossWarning() {
  if (!audioCtx) return;
  for (let i = 0; i < 4; i++) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = i % 2 === 0 ? 440 : 220;
    const t = audioCtx.currentTime + i * 0.25;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.1, t + 0.05);
    gain.gain.setValueAtTime(0.1, t + 0.15);
    gain.gain.linearRampToValueAtTime(0, t + 0.25);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.25);
  }
}

// Engine hum (looping)
let engineOsc = null;
function startEngineHum() {
  if (!audioCtx || engineOsc) return;
  engineOsc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 55;
  filter.type = 'lowpass';
  filter.frequency.value = 120;
  gain.gain.value = 0.03;
  engineOsc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  engineOsc.start();
}

// ─── Barrel Roll ────────────────────────────────────────────────
const BARREL_ROLL_DURATION = 24; // frames (~0.4s)
const BARREL_ROLL_COOLDOWN = 40; // frames cooldown after roll

function startBarrelRoll(dir) {
  if (player.barrelRollCooldown > 0) return;
  player.barrelRollTimer = BARREL_ROLL_DURATION;
  player.barrelRollDir = dir;
  player.barrelRollAngle = 0;
  player.barrelRollCooldown = BARREL_ROLL_DURATION + BARREL_ROLL_COOLDOWN;
  player.invulnTimer = Math.max(player.invulnTimer, BARREL_ROLL_DURATION); // invulnerable during roll
  playBarrelRollSound();
}

function updateBarrelRoll() {
  if (player.barrelRollCooldown > 0) player.barrelRollCooldown--;
  if (player.barrelRollTimer > 0) {
    player.barrelRollTimer--;
    const progress = 1 - (player.barrelRollTimer / BARREL_ROLL_DURATION);
    player.barrelRollAngle = player.barrelRollDir * progress * TAU;

    // Lateral dodge boost during roll
    player.vx += player.barrelRollDir * 3.5;

    // Sparkle trail during roll
    for (let i = 0; i < 3; i++) {
      spawnParticle(
        player.x + (Math.random() - 0.5) * 30,
        player.y + (Math.random() - 0.5) * 30,
        (Math.random() - 0.5) * 2,
        Math.random() * 2 + 1,
        `hsl(${200 + Math.random() * 60}, 100%, ${70 + Math.random() * 30}%)`,
        2 + Math.random() * 3,
        10 + Math.random() * 8
      );
    }
  } else {
    player.barrelRollAngle = 0;
  }
}

function playTakeoffSound() {
  if (!audioCtx) return;
  // Rising turbine whine over ~5 seconds
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(80, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 1.3);
  osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 3.5);
  osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 5.5);
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(200, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 3.5);
  filter.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 5.5);
  gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 1.3);
  gain.gain.linearRampToValueAtTime(0.09, audioCtx.currentTime + 3.5);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 5.5);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 5.5);
}

function playBarrelRollSound() {
  if (!audioCtx) return;
  // Swoosh: filtered noise sweep
  const bufferSize = audioCtx.sampleRate * 0.35;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(400, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 0.15);
  filter.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.35);
  filter.Q.value = 3;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.2);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  src.start();
  src.stop(audioCtx.currentTime + 0.35);
}

// ─── Parallax Layers ────────────────────────────────────────────
const stars = [];
for (let layer = 0; layer < 3; layer++) {
  const count = layer === 0 ? 60 : layer === 1 ? 40 : 20;
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * 2000,
      y: Math.random() * 2000,
      size: 0.5 + layer * 0.6 + Math.random() * 0.5,
      speed: 0.3 + layer * 0.5,
      brightness: 0.3 + layer * 0.25 + Math.random() * 0.2,
      twinkle: Math.random() * TAU
    });
  }
}

const clouds = [];
for (let i = 0; i < 8; i++) {
  clouds.push({
    x: Math.random() * 2000 - 200,
    y: Math.random() * 2000,
    w: 100 + Math.random() * 200,
    h: 40 + Math.random() * 60,
    speed: 0.8 + Math.random() * 1.2,
    alpha: 0.03 + Math.random() * 0.04
  });
}

// ─── Player ─────────────────────────────────────────────────────
const player = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  w: 36, h: 50,
  hp: 100, maxHp: 100,
  missiles: 5,
  shield: 0,
  fireTimer: 0,
  fireRate: 8, // frames between shots
  bankAngle: 0,
  alive: true,
  invulnTimer: 0,
  speed: 5.5,
  afterburner: 0,
  barrelRollTimer: 0,
  barrelRollDir: 0,
  barrelRollAngle: 0,
  barrelRollCooldown: 0
};

function resetPlayer() {
  player.x = W / 2;
  player.y = H - 120;
  mouseX = W / 2;
  mouseY = H - 120;
  player.vx = 0;
  player.vy = 0;
  player.hp = 100;
  player.maxHp = 100;
  player.missiles = 5;
  player.shield = 0;
  player.fireTimer = 0;
  player.fireRate = 8;
  player.bankAngle = 0;
  player.alive = true;
  player.invulnTimer = 0;
  player.afterburner = 0;
  player.barrelRollTimer = 0;
  player.barrelRollDir = 0;
  player.barrelRollAngle = 0;
  player.barrelRollCooldown = 0;
}

// ─── Start Game ─────────────────────────────────────────────────
function startGame() {
  initAudio();
  startEngineHum();
  resetPlayer();
  // Position jet at bottom center for takeoff
  player.x = W / 2;
  player.y = H - 80;
  mouseX = W / 2;
  mouseY = H - 80;
  bullets.length = 0;
  enemyBullets.length = 0;
  enemies.length = 0;
  particles.length = 0;
  powerups.length = 0;
  floatingTexts.length = 0;
  explosions.length = 0;
  score = 0;
  wave = 1;
  waveTimer = 0;
  waveEnemiesLeft = 0;
  waveSpawnTimer = 0;
  totalKills = 0;
  comboCount = 0;
  comboTimer = 0;
  scoreMultiplier = 1;
  multiplierTimer = 0;
  rapidFireTimer = 0;
  shakeAmount = 0;
  gameTime = 0;
  takeoffTimer = 0;
  takeoffPhase = 0;
  takeoffSpeed = 0;
  runwayY = 0;
  gameState = STATE.TAKEOFF;
  playTakeoffSound();
}

// ─── Wave System ────────────────────────────────────────────────
function startWave(n) {
  wave = n;
  const isBoss = n % 5 === 0;
  if (isBoss) {
    waveEnemiesLeft = 1;
    gameState = STATE.BOSS_INTRO;
    introTimer = 180;
    bossWarningTimer = 180;
    playBossWarning();
  } else {
    const baseCount = 4 + Math.floor(n * 1.5);
    waveEnemiesLeft = Math.min(baseCount, 25);
    gameState = STATE.WAVE_INTRO;
    introTimer = 120;
  }
  waveSpawnTimer = 0;
}

function spawnWaveEnemy() {
  if (waveEnemiesLeft <= 0) return;
  waveEnemiesLeft--;

  const isBoss = wave % 5 === 0;
  if (isBoss) {
    spawnEnemy('boss');
    return;
  }

  // Pick enemy type based on wave
  const types = ['scout', 'fighter'];
  if (wave >= 2) types.push('bomber');
  if (wave >= 3) types.push('ace');
  // Weight toward harder enemies in later waves
  const r = Math.random();
  let type;
  if (wave < 3) {
    type = r < 0.5 ? 'scout' : 'fighter';
  } else if (wave < 6) {
    type = r < 0.3 ? 'scout' : r < 0.6 ? 'fighter' : r < 0.8 ? 'bomber' : 'ace';
  } else {
    type = r < 0.2 ? 'scout' : r < 0.45 ? 'fighter' : r < 0.7 ? 'bomber' : 'ace';
  }
  spawnEnemy(type);
}

function spawnEnemy(type) {
  const e = {
    type,
    x: 60 + Math.random() * (W - 120),
    y: -60,
    vx: 0, vy: 0,
    w: 0, h: 0,
    hp: 0, maxHp: 0,
    fireTimer: 60 + Math.random() * 60,
    fireRate: 60,
    phase: Math.random() * TAU,
    age: 0,
    scoreValue: 0,
    smoking: false
  };

  switch (type) {
    case 'scout':
      e.w = 22; e.h = 26;
      e.hp = e.maxHp = 2 + Math.floor(wave * 0.3);
      e.vy = 2.5 + Math.random() * 1;
      e.fireRate = 80;
      e.scoreValue = 100;
      break;
    case 'fighter':
      e.w = 28; e.h = 34;
      e.hp = e.maxHp = 4 + Math.floor(wave * 0.5);
      e.vy = 1.8 + Math.random() * 0.8;
      e.fireRate = 50;
      e.scoreValue = 200;
      break;
    case 'bomber':
      e.w = 40; e.h = 46;
      e.hp = e.maxHp = 10 + wave;
      e.vy = 1 + Math.random() * 0.5;
      e.fireRate = 100;
      e.scoreValue = 350;
      break;
    case 'ace':
      e.w = 26; e.h = 32;
      e.hp = e.maxHp = 6 + Math.floor(wave * 0.5);
      e.vy = 2 + Math.random() * 1;
      e.fireRate = 70;
      e.scoreValue = 500;
      break;
    case 'boss':
      e.w = 80; e.h = 90;
      e.hp = e.maxHp = 60 + wave * 15;
      e.vy = 1;
      e.fireRate = 30;
      e.scoreValue = 2000 + wave * 500;
      e.x = W / 2;
      e.bossPhase = 0;
      e.bossTimer = 0;
      e.targetY = 100;
      break;
  }
  enemies.push(e);
}

// ─── Bullet Spawning ────────────────────────────────────────────
function firePlayerBullet() {
  if (bullets.length >= POOL_MAX_BULLETS) return;
  const spread = rapidFireTimer > 0 ? 3 : 0;
  bullets.push({
    x: player.x - 8, y: player.y - player.h / 2 - 4,
    vx: -spread * 0.3, vy: -10, w: 3, h: 10,
    damage: 1, isMissile: false
  });
  bullets.push({
    x: player.x + 8, y: player.y - player.h / 2 - 4,
    vx: spread * 0.3, vy: -10, w: 3, h: 10,
    damage: 1, isMissile: false
  });
  if (rapidFireTimer > 0) {
    bullets.push({
      x: player.x, y: player.y - player.h / 2 - 8,
      vx: 0, vy: -12, w: 3, h: 10,
      damage: 1, isMissile: false
    });
  }
  playGunSound();

  // Bullet casing particles
  for (let i = 0; i < 2; i++) {
    spawnParticle(player.x + (i === 0 ? -10 : 10), player.y - 5,
      (Math.random() - 0.5) * 3 + (i === 0 ? -1 : 1), Math.random() * 2,
      '#c8a84e', 2, 15);
  }
}

function fireMissile() {
  if (player.missiles <= 0 || bullets.length >= POOL_MAX_BULLETS) return;
  player.missiles--;

  // Find nearest enemy
  let target = null;
  let minDist = Infinity;
  for (const e of enemies) {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < minDist) { minDist = d; target = e; }
  }

  bullets.push({
    x: player.x, y: player.y - player.h / 2,
    vx: 0, vy: -6, w: 5, h: 16,
    damage: 8, isMissile: true,
    target, turnRate: 0.08, speed: 7
  });
  playMissileSound();
}

function fireEnemyBullet(e, angle, speed) {
  if (enemyBullets.length >= POOL_MAX_ENEMY_BULLETS) return;
  speed = speed || 4;
  enemyBullets.push({
    x: e.x, y: e.y + (e.h || 20) / 2,
    vx: Math.sin(angle) * speed,
    vy: Math.cos(angle) * speed,
    w: 4, h: 4,
    isHoming: false
  });
}

function fireHomingMissile(e) {
  if (enemyBullets.length >= POOL_MAX_ENEMY_BULLETS) return;
  enemyBullets.push({
    x: e.x, y: e.y + e.h / 2,
    vx: 0, vy: 2,
    w: 5, h: 12,
    isHoming: true,
    speed: 4,
    turnRate: 0.04,
    life: 300
  });
}

// ─── Particle System ────────────────────────────────────────────
function spawnParticle(x, y, vx, vy, color, size, life) {
  if (particles.length >= POOL_MAX_PARTICLES) return;
  particles.push({ x, y, vx, vy, color, size, life, maxLife: life, active: true });
}

function spawnExplosion(x, y, size, count) {
  playExplosionSound(size > 30);
  shakeAmount = Math.min(shakeAmount + size * 0.3, 20);

  // Shockwave ring
  explosions.push({ x, y, radius: 0, maxRadius: size * 2, alpha: 0.8, life: 20, maxLife: 20 });

  count = count || 20;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * TAU;
    const speed = 1 + Math.random() * (size * 0.15);
    const colors = ['#ff6622', '#ff4400', '#ffaa00', '#ffdd44', '#ff2200', '#ffffff'];
    spawnParticle(x, y,
      Math.cos(angle) * speed, Math.sin(angle) * speed,
      colors[Math.floor(Math.random() * colors.length)],
      2 + Math.random() * (size * 0.1),
      20 + Math.random() * 30
    );
  }
  // Debris
  for (let i = 0; i < Math.floor(count * 0.3); i++) {
    const angle = Math.random() * TAU;
    const speed = 2 + Math.random() * 4;
    spawnParticle(x, y,
      Math.cos(angle) * speed, Math.sin(angle) * speed,
      '#888', 1.5 + Math.random() * 2, 30 + Math.random() * 30);
  }
  // Smoke
  for (let i = 0; i < Math.floor(count * 0.4); i++) {
    const angle = Math.random() * TAU;
    const speed = 0.3 + Math.random() * 1.5;
    spawnParticle(x, y + Math.random() * 10,
      Math.cos(angle) * speed, Math.sin(angle) * speed - 0.5,
      '#555', 4 + Math.random() * 6, 40 + Math.random() * 40);
  }
}

function spawnEngineTrail(x, y, intensity) {
  const count = intensity > 0.5 ? 2 : 1;
  for (let i = 0; i < count; i++) {
    const colors = intensity > 0.7 ? ['#44aaff', '#66ccff', '#ffffff'] : ['#ff6600', '#ff4400', '#ffaa22'];
    spawnParticle(
      x + (Math.random() - 0.5) * 6,
      y + Math.random() * 4,
      (Math.random() - 0.5) * 0.5,
      1.5 + Math.random() * 2,
      colors[Math.floor(Math.random() * colors.length)],
      2 + Math.random() * 3,
      10 + Math.random() * 15
    );
  }
}

function spawnSmokeTrail(x, y) {
  spawnParticle(
    x + (Math.random() - 0.5) * 8, y,
    (Math.random() - 0.5) * 0.5, -0.5 + Math.random() * 0.5,
    '#666', 3 + Math.random() * 4, 30 + Math.random() * 20
  );
}

// ─── Floating Text ──────────────────────────────────────────────
function spawnFloatingText(x, y, text, color, size) {
  floatingTexts.push({ x, y, text, color: color || '#fff', size: size || 18, life: 60, maxLife: 60, vy: -1.5 });
}

// ─── Power-up Spawning ──────────────────────────────────────────
function maybeDropPowerup(x, y) {
  const r = Math.random();
  if (r > 0.25) return; // 25% drop rate
  const types = ['health', 'rapidfire', 'missile', 'shield', 'multiplier'];
  const weights = [0.3, 0.2, 0.25, 0.15, 0.1];
  let roll = Math.random(), type;
  let cumulative = 0;
  for (let i = 0; i < types.length; i++) {
    cumulative += weights[i];
    if (roll < cumulative) { type = types[i]; break; }
  }
  if (!type) type = 'health';
  powerups.push({ x, y, type, vy: 1.5, life: 600, size: 14, pulse: 0 });
}

// ─── Collision ──────────────────────────────────────────────────
function rectCollide(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax - aw / 2 < bx + bw / 2 && ax + aw / 2 > bx - bw / 2 &&
         ay - ah / 2 < by + bh / 2 && ay + ah / 2 > by - bh / 2;
}

// ─── Takeoff Sequence ───────────────────────────────────────────
function updateTakeoff() {
  takeoffTimer++;
  gameTime++;

  // Phase 0: Engine spool-up (0–80 frames, ~1.3s) — jet shakes, engines get loud
  if (takeoffPhase === 0) {
    takeoffSpeed = 0;
    // Vibration increases
    shakeAmount = Math.min(takeoffTimer * 0.04, 2.5);
    player.afterburner = takeoffTimer / 80;
    spawnEngineTrail(player.x - 6, player.y + player.h / 2, player.afterburner);
    spawnEngineTrail(player.x + 6, player.y + player.h / 2, player.afterburner);
    if (takeoffTimer >= 80) {
      takeoffPhase = 1;
      takeoffTimer = 0;
    }
  }

  // Phase 1: Runway roll (0–120 frames, ~2s) — accelerating down the runway
  else if (takeoffPhase === 1) {
    const t = takeoffTimer / 120;
    takeoffSpeed = t * t * 18; // quadratic acceleration
    runwayY += takeoffSpeed;
    shakeAmount = 2.5 - t * 1.5; // vibration decreases as speed picks up
    player.afterburner = 0.8 + t * 0.2;
    // Heavy engine trails
    spawnEngineTrail(player.x - 6, player.y + player.h / 2, 1);
    spawnEngineTrail(player.x + 6, player.y + player.h / 2, 1);
    if (takeoffTimer >= 120) {
      takeoffPhase = 2;
      takeoffTimer = 0;
    }
  }

  // Phase 2: Rotate — nose pitches up, wheels leave ground (0–40 frames)
  else if (takeoffPhase === 2) {
    const t = takeoffTimer / 40;
    takeoffSpeed = 18 + t * 4;
    runwayY += takeoffSpeed;
    player.y -= t * 2.5; // jet lifts off screen center
    player.afterburner = 1;
    shakeAmount = Math.max(0, 1 - t * 2);
    spawnEngineTrail(player.x - 6, player.y + player.h / 2, 1);
    spawnEngineTrail(player.x + 6, player.y + player.h / 2, 1);
    // Spray particles from wheels lifting
    if (takeoffTimer < 10) {
      for (let i = 0; i < 2; i++) {
        spawnParticle(
          player.x + (Math.random() - 0.5) * 20,
          player.y + player.h / 2 + 5,
          (Math.random() - 0.5) * 3, Math.random() * 2 + 1,
          'rgba(200,200,200,0.5)', 2 + Math.random() * 2, 15
        );
      }
    }
    if (takeoffTimer >= 40) {
      takeoffPhase = 3;
      takeoffTimer = 0;
    }
  }

  // Phase 3: Climb — runway shrinks away, transition to gameplay (0–90 frames)
  else if (takeoffPhase === 3) {
    const t = takeoffTimer / 90;
    takeoffSpeed = 22 - t * 18; // decelerate to cruise
    runwayY += takeoffSpeed;
    // Jet moves to gameplay position
    const targetY = H - 120;
    player.y += (targetY - player.y) * 0.04;
    player.afterburner = 1 - t * 0.6;
    spawnEngineTrail(player.x - 6, player.y + player.h / 2, player.afterburner);
    spawnEngineTrail(player.x + 6, player.y + player.h / 2, player.afterburner);
    if (takeoffTimer >= 90) {
      // Transition to gameplay
      mouseY = player.y;
      gameState = STATE.WAVE_INTRO;
      introTimer = 120;
      startWave(1);
      shakeAmount = 0;
    }
  }

  // Update particles during takeoff
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// Perspective helper: maps a world-space Z distance to screen Y and a horizontal scale factor
function perspProject(worldZ, vanishY, bottomY) {
  const depth = Math.max(worldZ, 0.1);
  const maxDepth = 6000;
  const t = Math.min(depth / maxDepth, 1);
  const screenY = bottomY - (1 - t) * (bottomY - vanishY);
  const scale = 1 - t;
  return { screenY, scale };
}

function drawRunway() {
  const cx = W / 2;
  const horizonY = H * 0.22;
  const vanishY = horizonY;
  const bottomY = H + 60;
  const rwHalfWidth = 150;
  const perspectiveFade = Math.max(0, 1 - runwayY / 4000);

  if (perspectiveFade <= 0.01) return;

  ctx.save();
  ctx.globalAlpha = perspectiveFade;

  // ── Horizon mountains/treeline ──
  ctx.fillStyle = '#1a5c10';
  ctx.beginPath();
  ctx.moveTo(0, horizonY);
  for (let x = 0; x <= W; x += 8) {
    const h = Math.sin(x * 0.005) * 12 + Math.sin(x * 0.013) * 8 + Math.sin(x * 0.031) * 4;
    ctx.lineTo(x, horizonY - 15 - h);
  }
  ctx.lineTo(W, horizonY);
  ctx.closePath();
  ctx.fill();
  // Lighter distant treeline
  ctx.fillStyle = '#2a7a20';
  ctx.beginPath();
  ctx.moveTo(0, horizonY);
  for (let x = 0; x <= W; x += 6) {
    const h = Math.sin(x * 0.008 + 1) * 8 + Math.sin(x * 0.02 + 2) * 5;
    ctx.lineTo(x, horizonY - 6 - h);
  }
  ctx.lineTo(W, horizonY);
  ctx.closePath();
  ctx.fill();

  // ── Ground plane: grass field ──
  const grassGrad = ctx.createLinearGradient(0, horizonY, 0, bottomY);
  grassGrad.addColorStop(0, '#2d6b1e');
  grassGrad.addColorStop(0.15, '#358024');
  grassGrad.addColorStop(0.4, '#3f9028');
  grassGrad.addColorStop(0.7, '#48a030');
  grassGrad.addColorStop(1, '#50aa35');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, horizonY, W, bottomY - horizonY);

  // Grass mowing stripes (darker/lighter alternating)
  for (let i = 0; i < 30; i++) {
    const z = i * 200;
    const p = perspProject(z, vanishY, bottomY);
    const p2 = perspProject(z + 100, vanishY, bottomY);
    if (p.screenY < vanishY) continue;
    if (i % 2 === 0) {
      ctx.fillStyle = `rgba(30, 70, 15, ${0.08 * p.scale})`;
      ctx.fillRect(0, p2.screenY, W, p.screenY - p2.screenY);
    }
  }

  // ── Parallel taxiway (right side) ──
  for (let z = 0; z < 6000; z += 30) {
    const p1 = perspProject(z, vanishY, bottomY);
    const p2 = perspProject(z + 30, vanishY, bottomY);
    if (p1.screenY < vanishY || p1.scale < 0.01) break;
    const taxiCenterX = cx + (rwHalfWidth + 180) * p1.scale;
    const taxiW = 50 * p1.scale;
    const taxiCenterX2 = cx + (rwHalfWidth + 180) * p2.scale;
    const taxiW2 = 50 * p2.scale;
    ctx.fillStyle = `rgba(55, 55, 55, ${p1.scale * 0.7})`;
    ctx.beginPath();
    ctx.moveTo(taxiCenterX - taxiW, p1.screenY);
    ctx.lineTo(taxiCenterX + taxiW, p1.screenY);
    ctx.lineTo(taxiCenterX2 + taxiW2, p2.screenY);
    ctx.lineTo(taxiCenterX2 - taxiW2, p2.screenY);
    ctx.closePath();
    ctx.fill();
  }
  // Taxiway yellow centerline
  const taxiDash = 100;
  for (let i = 0; i < 50; i++) {
    const z = i * taxiDash - ((runwayY * 0.1) % taxiDash);
    if (z < 0) continue;
    const p = perspProject(z, vanishY, bottomY);
    if (p.screenY < vanishY || p.scale < 0.02) continue;
    const tx = cx + (rwHalfWidth + 180) * p.scale;
    ctx.fillStyle = `rgba(220,180,30,${0.6 * p.scale})`;
    ctx.fillRect(tx - p.scale, p.screenY, 2 * p.scale, Math.max(1, 2 * p.scale));
  }

  // ── Buildings/hangars (right side, far) ──
  const structures = [
    { z: 1200, xOff: 350, w: 120, h: 40, color: '#556677' },
    { z: 1500, xOff: 380, w: 80, h: 55, color: '#667788' },
    { z: 2000, xOff: 330, w: 100, h: 35, color: '#4a5a6a' },
    { z: 800, xOff: -320, w: 90, h: 30, color: '#5a6a7a' },
    { z: 1800, xOff: -360, w: 70, h: 45, color: '#4d5d6d' },
  ];
  for (const s of structures) {
    const sz = s.z - runwayY * 0.05;
    if (sz < 0 || sz > 5000) continue;
    const p = perspProject(sz, vanishY, bottomY);
    if (p.screenY < vanishY || p.scale < 0.03) continue;
    const bx = cx + s.xOff * p.scale;
    const bw = s.w * p.scale;
    const bh = s.h * p.scale;
    // Building body
    ctx.fillStyle = s.color;
    ctx.fillRect(bx - bw / 2, p.screenY - bh, bw, bh);
    // Roof line
    ctx.fillStyle = `rgba(40,40,40,${p.scale * 0.5})`;
    ctx.fillRect(bx - bw / 2, p.screenY - bh, bw, bh * 0.15);
    // Windows
    ctx.fillStyle = `rgba(180,210,240,${p.scale * 0.5})`;
    const winCount = Math.max(1, Math.floor(bw / (12 * p.scale)));
    for (let wi = 0; wi < winCount; wi++) {
      const wx = bx - bw / 2 + (wi + 0.5) * (bw / winCount);
      ctx.fillRect(wx - 2 * p.scale, p.screenY - bh * 0.65, 4 * p.scale, bh * 0.25);
    }
  }

  // ── Control tower (left side) ──
  const towerZ = 1000 - runwayY * 0.05;
  if (towerZ > 0 && towerZ < 4000) {
    const p = perspProject(towerZ, vanishY, bottomY);
    if (p.screenY > vanishY && p.scale > 0.03) {
      const tx = cx - (rwHalfWidth + 260) * p.scale;
      const tw = 18 * p.scale;
      const th = 90 * p.scale;
      // Tower shaft
      ctx.fillStyle = `rgba(160,160,170,${p.scale})`;
      ctx.fillRect(tx - tw / 2, p.screenY - th, tw, th);
      // Cab (wider glass room at top)
      const cabW = 32 * p.scale;
      const cabH = 16 * p.scale;
      ctx.fillStyle = `rgba(80,90,100,${p.scale})`;
      ctx.fillRect(tx - cabW / 2, p.screenY - th - cabH, cabW, cabH);
      // Glass windows
      ctx.fillStyle = `rgba(140,200,220,${p.scale * 0.7})`;
      ctx.fillRect(tx - cabW / 2 + 2 * p.scale, p.screenY - th - cabH + 3 * p.scale, cabW - 4 * p.scale, cabH * 0.6);
      // Antenna
      ctx.strokeStyle = `rgba(100,100,100,${p.scale})`;
      ctx.lineWidth = Math.max(0.5, p.scale);
      ctx.beginPath();
      ctx.moveTo(tx, p.screenY - th - cabH);
      ctx.lineTo(tx, p.screenY - th - cabH - 15 * p.scale);
      ctx.stroke();
      // Red beacon
      const beacon = 0.5 + Math.sin(gameTime * 0.15) * 0.5;
      ctx.fillStyle = `rgba(255,30,30,${beacon * p.scale})`;
      ctx.beginPath();
      ctx.arc(tx, p.screenY - th - cabH - 15 * p.scale, 2 * p.scale, 0, TAU);
      ctx.fill();
    }
  }

  // ── Runway shoulder (worn dirt strip) ──
  for (let z = 0; z < 6000; z += 60) {
    const p = perspProject(z, vanishY, bottomY);
    const p2 = perspProject(z + 60, vanishY, bottomY);
    if (p.screenY < vanishY || p.scale < 0.01) break;
    const sW = 14 * p.scale;
    ctx.fillStyle = `rgba(130, 110, 70, ${0.4 * p.scale})`;
    ctx.fillRect(cx - (rwHalfWidth + sW) * p.scale, p2.screenY, sW * 2 * p.scale, p.screenY - p2.screenY + 1);
    ctx.fillRect(cx + (rwHalfWidth - sW * 0.3) * p.scale, p2.screenY, sW * 2 * p.scale, p.screenY - p2.screenY + 1);
  }

  // ── Runway surface (asphalt) ──
  ctx.beginPath();
  const pBot = perspProject(0, vanishY, bottomY);
  const pTop = perspProject(6000, vanishY, bottomY);
  ctx.moveTo(cx - rwHalfWidth * pBot.scale, pBot.screenY);
  ctx.lineTo(cx + rwHalfWidth * pBot.scale, pBot.screenY);
  ctx.lineTo(cx + rwHalfWidth * pTop.scale, pTop.screenY);
  ctx.lineTo(cx - rwHalfWidth * pTop.scale, pTop.screenY);
  ctx.closePath();
  const asphaltGrad = ctx.createLinearGradient(0, vanishY, 0, bottomY);
  asphaltGrad.addColorStop(0, '#2c2c2c');
  asphaltGrad.addColorStop(0.2, '#333');
  asphaltGrad.addColorStop(0.5, '#3a3a3a');
  asphaltGrad.addColorStop(0.8, '#424242');
  asphaltGrad.addColorStop(1, '#484848');
  ctx.fillStyle = asphaltGrad;
  ctx.fill();

  // Asphalt texture — cracks and wear
  for (let i = 0; i < 90; i++) {
    const z = i * 65 - (runwayY * 0.5 % 65);
    if (z < 0) continue;
    const p = perspProject(z, vanishY, bottomY);
    if (p.screenY < vanishY) continue;
    const hw = rwHalfWidth * p.scale;
    // Horizontal surface variation
    ctx.strokeStyle = `rgba(${45 + (i % 4) * 8}, ${45 + (i % 4) * 8}, ${45 + (i % 4) * 8}, ${0.12 * p.scale})`;
    ctx.lineWidth = Math.max(0.5, p.scale * 0.8);
    ctx.beginPath();
    ctx.moveTo(cx - hw * 0.97, p.screenY);
    ctx.lineTo(cx + hw * 0.97, p.screenY);
    ctx.stroke();
  }

  // Rubber tire marks (dark streaks near touchdown zone)
  const rubberZ = 350 - runwayY;
  if (rubberZ > -200 && rubberZ < 3000) {
    for (let r = 0; r < 6; r++) {
      const rz = rubberZ + r * 15;
      if (rz < 0) continue;
      const p = perspProject(rz, vanishY, bottomY);
      if (p.screenY < vanishY || p.scale < 0.02) continue;
      ctx.fillStyle = `rgba(15,15,15,${0.25 * p.scale})`;
      // Two parallel tire marks
      ctx.fillRect(cx - 20 * p.scale, p.screenY, 8 * p.scale, Math.max(1, 2 * p.scale));
      ctx.fillRect(cx + 12 * p.scale, p.screenY, 8 * p.scale, Math.max(1, 2 * p.scale));
    }
  }

  // ── Runway edge lines (solid white, thick) ──
  for (let z = 0; z < 6000; z += 25) {
    const p1 = perspProject(z, vanishY, bottomY);
    const p2 = perspProject(z + 25, vanishY, bottomY);
    if (p1.screenY < vanishY) break;
    ctx.fillStyle = `rgba(255,255,255,${0.85 * p1.scale})`;
    const lw = Math.max(1, 5 * p1.scale);
    // Left edge
    ctx.fillRect(cx - (rwHalfWidth - 2) * p1.scale - lw, p2.screenY, lw, p1.screenY - p2.screenY + 1);
    // Right edge
    ctx.fillRect(cx + (rwHalfWidth - 2) * p1.scale, p2.screenY, lw, p1.screenY - p2.screenY + 1);
  }

  // ── Centerline dashes ──
  const dashWorldLen = 60;
  const dashGap = 40;
  const dashCycle = dashWorldLen + dashGap;
  for (let i = -1; i < 60; i++) {
    const zStart = i * dashCycle - (runwayY % dashCycle);
    const zEnd = zStart + dashWorldLen;
    if (zEnd < 0 || zStart > 6000) continue;
    const p1 = perspProject(Math.max(zStart, 0), vanishY, bottomY);
    const p2 = perspProject(Math.min(zEnd, 6000), vanishY, bottomY);
    if (p1.screenY < vanishY) continue;
    const lineW = Math.max(1, 3.5 * p1.scale);
    ctx.fillStyle = `rgba(255,255,255,${0.75 * p1.scale})`;
    ctx.fillRect(cx - lineW / 2, p2.screenY, lineW, p1.screenY - p2.screenY);
  }

  // ── Touchdown zone markings ──
  const tdzOffset = 500 - runwayY;
  for (let row = 0; row < 4; row++) {
    const z = tdzOffset + row * 220;
    if (z < -50 || z > 5000) continue;
    const p = perspProject(z, vanishY, bottomY);
    const p2 = perspProject(z + 45, vanishY, bottomY);
    if (p.screenY < vanishY || p.scale < 0.02) continue;
    const barH = p.screenY - p2.screenY;
    const barsCount = 4 - row;
    ctx.fillStyle = `rgba(255,255,255,${0.7 * p.scale})`;
    for (let b = 0; b < barsCount; b++) {
      const offset = (32 + b * 20) * p.scale;
      const barW = 13 * p.scale;
      ctx.fillRect(cx - offset - barW / 2, p2.screenY, barW, barH);
      ctx.fillRect(cx + offset - barW / 2, p2.screenY, barW, barH);
    }
  }

  // ── Aiming point markers (bold rectangles 1000ft from threshold) ──
  const aimZ = 700 - runwayY;
  if (aimZ > -100 && aimZ < 4000) {
    const p = perspProject(Math.max(aimZ, 0), vanishY, bottomY);
    const p2 = perspProject(Math.max(aimZ + 80, 0), vanishY, bottomY);
    if (p.screenY > vanishY && p.scale > 0.02) {
      ctx.fillStyle = `rgba(255,255,255,${0.8 * p.scale})`;
      const barH = p.screenY - p2.screenY;
      ctx.fillRect(cx - 55 * p.scale, p2.screenY, 22 * p.scale, barH);
      ctx.fillRect(cx + 33 * p.scale, p2.screenY, 22 * p.scale, barH);
    }
  }

  // ── Threshold bars (piano keys) ──
  const threshZ = 100 - runwayY;
  if (threshZ > -150 && threshZ < 3000) {
    const p = perspProject(Math.max(threshZ, 0), vanishY, bottomY);
    const p2 = perspProject(Math.max(threshZ + 70, 0), vanishY, bottomY);
    if (p.screenY > vanishY && p.scale > 0.02) {
      ctx.fillStyle = `rgba(255,255,255,${0.85 * p.scale})`;
      const barH = p.screenY - p2.screenY;
      for (let b = -6; b <= 6; b++) {
        if (b === 0) continue;
        const bx = cx + b * 15 * p.scale;
        ctx.fillRect(bx - 4 * p.scale, p2.screenY, 8 * p.scale, barH);
      }
    }
  }

  // ── Runway designation "27L" ──
  const numZ = 220 - runwayY;
  if (numZ > -150 && numZ < 2500) {
    const p = perspProject(Math.max(numZ, 0), vanishY, bottomY);
    if (p.screenY > vanishY && p.scale > 0.04) {
      ctx.fillStyle = `rgba(255,255,255,${0.85 * p.scale})`;
      ctx.font = `bold ${Math.max(8, Math.round(55 * p.scale))}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText('27L', cx, p.screenY);
    }
  }

  // ── Edge lights ──
  const lightSpacing = 100;
  for (let i = 0; i < 55; i++) {
    const z = i * lightSpacing - (runwayY % lightSpacing);
    if (z < 0) continue;
    const p = perspProject(z, vanishY, bottomY);
    if (p.screenY < vanishY || p.scale < 0.015) continue;
    const lx = (rwHalfWidth + 6) * p.scale;
    const r = Math.max(1.2, 3.5 * p.scale);
    const isYellow = (i % 5 === 0);
    // Left
    ctx.fillStyle = isYellow ? `rgba(255,200,50,${0.25 * p.scale})` : `rgba(255,255,255,${0.15 * p.scale})`;
    ctx.beginPath(); ctx.arc(cx - lx, p.screenY, r * 3, 0, TAU); ctx.fill();
    ctx.fillStyle = isYellow ? `rgba(255,220,80,${0.9 * p.scale})` : `rgba(255,255,240,${0.8 * p.scale})`;
    ctx.beginPath(); ctx.arc(cx - lx, p.screenY, r, 0, TAU); ctx.fill();
    // Right
    ctx.fillStyle = isYellow ? `rgba(255,200,50,${0.25 * p.scale})` : `rgba(255,255,255,${0.15 * p.scale})`;
    ctx.beginPath(); ctx.arc(cx + lx, p.screenY, r * 3, 0, TAU); ctx.fill();
    ctx.fillStyle = isYellow ? `rgba(255,220,80,${0.9 * p.scale})` : `rgba(255,255,240,${0.8 * p.scale})`;
    ctx.beginPath(); ctx.arc(cx + lx, p.screenY, r, 0, TAU); ctx.fill();
  }

  // ── PAPI lights (left side, near touchdown) ──
  const papiZ = 600 - runwayY;
  if (papiZ > 0 && papiZ < 2500) {
    const p = perspProject(papiZ, vanishY, bottomY);
    if (p.screenY > vanishY && p.scale > 0.03) {
      const px = cx - (rwHalfWidth + 35) * p.scale;
      for (let li = 0; li < 4; li++) {
        const ly = p.screenY - li * 5 * p.scale;
        const isRed = li < 2; // 2 red 2 white = on glideslope
        const color = isRed ? `rgba(255,40,30,${p.scale})` : `rgba(255,255,255,${p.scale})`;
        const glow = isRed ? `rgba(255,40,30,${0.3 * p.scale})` : `rgba(255,255,220,${0.25 * p.scale})`;
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(px + li * 8 * p.scale, ly, 4 * p.scale, 0, TAU); ctx.fill();
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(px + li * 8 * p.scale, ly, 2 * p.scale, 0, TAU); ctx.fill();
      }
    }
  }

  // ── Approach lights (before threshold, centerline strobes) ──
  const approachStart = 20 - runwayY;
  if (approachStart > -200 && approachStart < 1500) {
    for (let al = 0; al < 6; al++) {
      const az = approachStart - al * 80;
      if (az < 0 || az > 5000) continue;
      const p = perspProject(az, vanishY, bottomY);
      if (p.screenY < vanishY || p.scale < 0.02) continue;
      // Strobe flash
      const flash = Math.sin(gameTime * 0.3 + al * 1.5) > 0.6 ? 1 : 0.3;
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.3 * p.scale})`;
      ctx.beginPath(); ctx.arc(cx, p.screenY, 6 * p.scale, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(255,255,240,${flash * p.scale})`;
      ctx.beginPath(); ctx.arc(cx, p.screenY, 2.5 * p.scale, 0, TAU); ctx.fill();
      // Crossbar at first two
      if (al < 2) {
        ctx.fillStyle = `rgba(255,255,240,${0.6 * p.scale})`;
        ctx.fillRect(cx - 25 * p.scale, p.screenY - p.scale, 50 * p.scale, 2 * p.scale);
      }
    }
  }

  // ── Taxiway signs ──
  const signs = [
    { z: 300, xOff: -1, label: 'A3', bg: '#cc9900' },
    { z: 900, xOff: 1, label: 'B1', bg: '#cc9900' },
    { z: 1600, xOff: -1, label: 'RWY 27L', bg: '#cc0000' },
  ];
  for (const s of signs) {
    const sz = s.z - runwayY * 0.1;
    if (sz < 0 || sz > 2500) continue;
    const p = perspProject(sz, vanishY, bottomY);
    if (p.screenY < vanishY || p.scale < 0.04) continue;
    const sx = cx + s.xOff * (rwHalfWidth + 45) * p.scale;
    const sw = (s.label.length * 8 + 12) * p.scale;
    const sh = 14 * p.scale;
    // Sign
    ctx.fillStyle = s.bg;
    ctx.globalAlpha = perspectiveFade * p.scale;
    ctx.fillRect(sx - sw / 2, p.screenY - sh - 4 * p.scale, sw, sh);
    // Border
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = Math.max(0.5, p.scale);
    ctx.strokeRect(sx - sw / 2, p.screenY - sh - 4 * p.scale, sw, sh);
    // Text
    ctx.fillStyle = s.bg === '#cc0000' ? '#fff' : '#000';
    ctx.font = `bold ${Math.max(5, Math.round(10 * p.scale))}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(s.label, sx, p.screenY - 5 * p.scale);
    // Post
    ctx.fillStyle = `rgba(90,90,90,${p.scale})`;
    ctx.fillRect(sx - p.scale, p.screenY - sh - 4 * p.scale, 2 * p.scale, sh + 8 * p.scale);
    ctx.globalAlpha = perspectiveFade;
  }

  // ── Windsock (right side near threshold) ──
  const wsZ = 250 - runwayY * 0.08;
  if (wsZ > 0 && wsZ < 2000) {
    const p = perspProject(wsZ, vanishY, bottomY);
    if (p.screenY > vanishY && p.scale > 0.04) {
      const wx = cx + (rwHalfWidth + 80) * p.scale;
      const poleH = 25 * p.scale;
      // Pole
      ctx.strokeStyle = `rgba(180,180,180,${p.scale})`;
      ctx.lineWidth = Math.max(1, 2 * p.scale);
      ctx.beginPath();
      ctx.moveTo(wx, p.screenY);
      ctx.lineTo(wx, p.screenY - poleH);
      ctx.stroke();
      // Sock (animated)
      const sockLen = 18 * p.scale;
      const wave1 = Math.sin(gameTime * 0.08) * 3 * p.scale;
      const wave2 = Math.sin(gameTime * 0.12 + 1) * 2 * p.scale;
      ctx.beginPath();
      ctx.moveTo(wx, p.screenY - poleH);
      ctx.quadraticCurveTo(wx + sockLen * 0.5 + wave1, p.screenY - poleH + 2 * p.scale, wx + sockLen + wave2, p.screenY - poleH + 4 * p.scale);
      ctx.lineTo(wx + sockLen + wave2, p.screenY - poleH + 8 * p.scale);
      ctx.quadraticCurveTo(wx + sockLen * 0.5 + wave1, p.screenY - poleH + 6 * p.scale, wx, p.screenY - poleH + 4 * p.scale);
      ctx.closePath();
      // Orange/white stripes
      ctx.fillStyle = `rgba(255,100,20,${p.scale})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(255,255,255,${p.scale * 0.7})`;
      ctx.lineWidth = Math.max(0.5, p.scale);
      ctx.stroke();
    }
  }

  // ── Heat shimmer (subtle during spool/roll phases) ──
  if (takeoffPhase <= 1 && takeoffSpeed < 12) {
    const shimmerIntensity = 0.03 + takeoffSpeed * 0.005;
    for (let sy = horizonY + 20; sy < H - 100; sy += 12) {
      const offset = Math.sin(sy * 0.1 + gameTime * 0.15) * 2 * shimmerIntensity;
      ctx.drawImage(canvas, 0, sy, W, 4, offset, sy + Math.sin(gameTime * 0.2 + sy * 0.05) * 0.5, W, 4);
    }
  }

  ctx.restore();
}

function drawTakeoffHUD() {
  ctx.save();
  ctx.textAlign = 'center';

  const speedKnots = Math.round(takeoffSpeed * 15);
  const altitude = Math.max(0, Math.round((H - 80 - player.y) * 2.5));

  // Airspeed tape (left side)
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(30, H / 2 - 100, 80, 200);
  ctx.strokeStyle = 'rgba(100,200,255,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(30, H / 2 - 100, 80, 200);
  // Speed readout
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(30, H / 2 - 14, 80, 28);
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(30, H / 2 - 14, 80, 28);
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(speedKnots, 70, H / 2 + 6);
  // Label
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '10px monospace';
  ctx.fillText('KTS', 70, H / 2 - 90);
  // Speed ticks
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '10px monospace';
  for (let s = -4; s <= 4; s++) {
    if (s === 0) continue;
    const tickY = H / 2 + s * 22;
    const tickVal = speedKnots - s * 10;
    if (tickVal < 0) continue;
    ctx.beginPath(); ctx.moveTo(90, tickY); ctx.lineTo(110, tickY); ctx.stroke();
    ctx.textAlign = 'right';
    ctx.fillText(tickVal, 108, tickY + 3);
  }

  // V-speeds
  const v1 = 130, vr = 155, v2 = 170;
  ctx.font = 'bold 10px monospace';
  for (const vs of [{ label: 'V1', val: v1, color: '#ff0' }, { label: 'VR', val: vr, color: '#0ff' }, { label: 'V2', val: v2, color: '#0f0' }]) {
    const tickOffset = (speedKnots - vs.val) / 10 * 22;
    const ty = H / 2 + tickOffset;
    if (ty > H / 2 - 95 && ty < H / 2 + 95) {
      ctx.fillStyle = vs.color;
      ctx.textAlign = 'left';
      ctx.fillText(vs.label, 33, ty + 3);
      ctx.strokeStyle = vs.color;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(30, ty); ctx.lineTo(110, ty); ctx.stroke();
    }
  }

  // Altitude tape (right side)
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W - 110, H / 2 - 100, 80, 200);
  ctx.strokeStyle = 'rgba(100,200,255,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(W - 110, H / 2 - 100, 80, 200);
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(W - 110, H / 2 - 14, 80, 28);
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(W - 110, H / 2 - 14, 80, 28);
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(altitude, W - 70, H / 2 + 6);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '10px monospace';
  ctx.fillText('ALT FT', W - 70, H / 2 - 90);

  // Heading
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W / 2 - 50, 15, 100, 28);
  ctx.strokeStyle = 'rgba(100,200,255,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(W / 2 - 50, 15, 100, 28);
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('HDG 270', W / 2, 35);

  // Flight director crosshair
  ctx.strokeStyle = 'rgba(0,255,0,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 40, H / 2);
  ctx.lineTo(W / 2 - 12, H / 2);
  ctx.moveTo(W / 2 + 12, H / 2);
  ctx.lineTo(W / 2 + 40, H / 2);
  ctx.moveTo(W / 2, H / 2 - 12);
  ctx.lineTo(W / 2, H / 2 + 12);
  ctx.stroke();

  // Phase text
  const phaseLabels = ['ENGINE SPOOL-UP', 'ROLLING', 'ROTATE — PULL UP', 'GEAR UP — AIRBORNE'];
  ctx.fillStyle = takeoffPhase >= 2 ? 'rgba(0,255,150,0.9)' : 'rgba(255,255,255,0.6)';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(phaseLabels[takeoffPhase], W / 2, H - 25);

  ctx.restore();
}

// ─── Update ─────────────────────────────────────────────────────
function update() {
  gameTime++;
  if (shakeAmount > 0.5) shakeAmount *= shakeDecay;
  else shakeAmount = 0;

  // ── Takeoff ──
  if (gameState === STATE.TAKEOFF) {
    updateTakeoff();
    return; // skip normal gameplay update
  }

  // Timers
  if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) comboCount = 0; }
  if (multiplierTimer > 0) { multiplierTimer--; if (multiplierTimer <= 0) scoreMultiplier = 1; }
  if (rapidFireTimer > 0) rapidFireTimer--;

  // ── Wave intro ──
  if (gameState === STATE.WAVE_INTRO || gameState === STATE.BOSS_INTRO) {
    introTimer--;
    if (introTimer <= 0) {
      gameState = STATE.PLAYING;
    }
    // Still let player move during intro
  }

  // ── Player ──
  inputFrame++;
  if (player.alive) {
    updateBarrelRoll();

    // Mouse-driven movement: smooth follow cursor
    const dx = mouseX - player.x;
    const dy = mouseY - player.y;
    const dist = Math.hypot(dx, dy);
    const followSpeed = 0.12; // lerp factor — smooth but responsive

    if (dist > 2) {
      player.vx = dx * followSpeed;
      player.vy = dy * followSpeed;
    } else {
      player.vx *= 0.8;
      player.vy *= 0.8;
    }

    player.x += player.vx;
    player.y += player.vy;

    // Clamp to screen
    player.x = Math.max(player.w, Math.min(W - player.w, player.x));
    player.y = Math.max(player.h, Math.min(H - player.h, player.y));

    // Bank angle based on horizontal velocity
    const targetBank = -player.vx * 4 * DEG;
    player.bankAngle += (targetBank - player.bankAngle) * 0.15;

    // Afterburner — more intense when moving fast
    const moveMag = Math.hypot(player.vx, player.vy);
    player.afterburner += ((0.3 + moveMag * 0.08) - player.afterburner) * 0.1;

    // Engine trail
    spawnEngineTrail(player.x - 6, player.y + player.h / 2, player.afterburner);
    spawnEngineTrail(player.x + 6, player.y + player.h / 2, player.afterburner);

    // Fire — hold left mouse button to shoot
    if (player.fireTimer > 0) player.fireTimer--;
    const rate = rapidFireTimer > 0 ? Math.max(3, player.fireRate - 4) : player.fireRate;
    if (mouseDown && player.fireTimer <= 0) {
      firePlayerBullet();
      player.fireTimer = rate;
    }

    if (player.invulnTimer > 0) player.invulnTimer--;
  }

  // ── Bullets ──
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.isMissile && b.target && b.target.hp > 0) {
      const dx = b.target.x - b.x;
      const dy = b.target.y - b.y;
      const angle = Math.atan2(dy, dx);
      const curAngle = Math.atan2(b.vy, b.vx);
      let diff = angle - curAngle;
      while (diff > PI) diff -= TAU;
      while (diff < -PI) diff += TAU;
      const turn = Math.sign(diff) * Math.min(Math.abs(diff), b.turnRate);
      const newAngle = curAngle + turn;
      b.vx = Math.cos(newAngle) * b.speed;
      b.vy = Math.sin(newAngle) * b.speed;
      // Missile trail
      spawnParticle(b.x, b.y, (Math.random() - 0.5) * 0.5, 1, '#ffaa00', 2, 10);
    }
    b.x += b.vx;
    b.y += b.vy;
    if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) {
      bullets.splice(i, 1);
    }
  }

  // ── Enemy Bullets ──
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    if (b.isHoming && player.alive) {
      b.life--;
      if (b.life <= 0) {
        spawnExplosion(b.x, b.y, 10, 5);
        enemyBullets.splice(i, 1);
        continue;
      }
      const dx = player.x - b.x;
      const dy = player.y - b.y;
      const angle = Math.atan2(dy, dx);
      const curAngle = Math.atan2(b.vy, b.vx);
      let diff = angle - curAngle;
      while (diff > PI) diff -= TAU;
      while (diff < -PI) diff += TAU;
      const turn = Math.sign(diff) * Math.min(Math.abs(diff), b.turnRate);
      const newAngle = curAngle + turn;
      b.vx = Math.cos(newAngle) * b.speed;
      b.vy = Math.sin(newAngle) * b.speed;
      spawnParticle(b.x, b.y, (Math.random() - 0.5) * 0.3, -0.5, '#ff4444', 2, 8);
    }
    b.x += b.vx;
    b.y += b.vy;
    if (b.y > H + 20 || b.y < -20 || b.x < -40 || b.x > W + 40) {
      enemyBullets.splice(i, 1);
    }
  }

  // ── Enemies ──
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.age++;

    // AI per type
    switch (e.type) {
      case 'scout':
        e.vx = Math.sin(e.age * 0.05 + e.phase) * 3;
        e.x += e.vx;
        e.y += e.vy;
        e.fireTimer--;
        if (e.fireTimer <= 0 && e.y > 0) {
          const angle = Math.atan2(player.y - e.y, player.x - e.x) - PI / 2;
          fireEnemyBullet(e, 0, 3.5);
          e.fireTimer = e.fireRate;
        }
        break;

      case 'fighter':
        e.x += Math.sin(e.age * 0.03 + e.phase) * 1;
        e.y += e.vy;
        e.fireTimer--;
        if (e.fireTimer <= 0 && e.y > 0) {
          // Burst fire — aim at player
          const aimDx = player.x - e.x;
          const aimDy = player.y - e.y;
          const aimAngle = Math.atan2(aimDx, aimDy);
          for (let b = 0; b < 3; b++) {
            setTimeout(() => {
              if (e.hp > 0) {
                fireEnemyBullet(e, aimAngle + (b - 1) * 0.05, 4);
              }
            }, b * 80);
          }
          e.fireTimer = e.fireRate;
        }
        break;

      case 'bomber':
        e.x += Math.sin(e.age * 0.02 + e.phase) * 0.5;
        e.y += e.vy;
        e.fireTimer--;
        if (e.fireTimer <= 0 && e.y > 0) {
          // Area bombs - spread aimed downward
          const baseAngle = Math.atan2(player.x - e.x, player.y - e.y);
          for (let a = -2; a <= 2; a++) {
            fireEnemyBullet(e, baseAngle + a * 0.25, 2.5);
          }
          e.fireTimer = e.fireRate;
        }
        break;

      case 'ace': {
        // Dodge bullets
        let dodgeX = 0;
        for (const b of bullets) {
          if (Math.abs(b.x - e.x) < 40 && b.y < e.y && b.y > e.y - 120) {
            dodgeX += (b.x < e.x ? 3 : -3);
          }
        }
        e.vx = Math.sin(e.age * 0.04 + e.phase) * 2.5 + dodgeX * 0.3;
        e.x += e.vx;
        e.y += e.vy;
        e.fireTimer--;
        if (e.fireTimer <= 0 && e.y > 0) {
          fireHomingMissile(e);
          e.fireTimer = e.fireRate;
        }
        break;
      }

      case 'boss': {
        // Move to target Y
        if (e.y < e.targetY) {
          e.y += e.vy;
        } else {
          e.vy = 0;
          e.bossTimer++;

          // Phase patterns
          const phase = Math.floor(e.bossTimer / 180) % 3;
          switch (phase) {
            case 0: // Sweep
              e.x += Math.sin(e.bossTimer * 0.02) * 3;
              if (e.bossTimer % 15 === 0) {
                for (let a = -3; a <= 3; a++) {
                  fireEnemyBullet(e, a * 0.15, 3);
                }
              }
              break;
            case 1: // Track player
              e.x += (player.x - e.x) * 0.02;
              if (e.bossTimer % 8 === 0) {
                const a = Math.atan2(player.x - e.x, player.y - e.y);
                fireEnemyBullet(e, a, 5);
              }
              break;
            case 2: // Burst + homing
              e.x += Math.sin(e.bossTimer * 0.015) * 2;
              if (e.bossTimer % 40 === 0) {
                for (let a = 0; a < 12; a++) {
                  fireEnemyBullet(e, a * TAU / 12 + e.bossTimer * 0.01, 2.5);
                }
              }
              if (e.bossTimer % 90 === 0) {
                fireHomingMissile(e);
              }
              break;
          }
        }
        e.x = Math.max(e.w, Math.min(W - e.w, e.x));

        // Boss smoke when damaged
        if (e.hp < e.maxHp * 0.5) {
          if (gameTime % 3 === 0) spawnSmokeTrail(e.x + (Math.random() - 0.5) * e.w, e.y);
        }

        // Engine trail
        if (gameTime % 2 === 0) {
          spawnEngineTrail(e.x - 20, e.y + e.h / 2, 0.5);
          spawnEngineTrail(e.x + 20, e.y + e.h / 2, 0.5);
        }
        break;
      }
    }

    // Clamp X
    e.x = Math.max(e.w / 2, Math.min(W - e.w / 2, e.x));

    // Engine trails for non-boss
    if (e.type !== 'boss' && gameTime % 3 === 0) {
      spawnEngineTrail(e.x, e.y + e.h / 2, 0.3);
    }

    // Smoking when damaged
    if (e.hp < e.maxHp * 0.4 && !e.smoking) e.smoking = true;
    if (e.smoking && gameTime % 4 === 0) {
      spawnSmokeTrail(e.x + (Math.random() - 0.5) * e.w * 0.5, e.y);
    }

    // Remove if offscreen
    if (e.y > H + 100) {
      enemies.splice(i, 1);
    }
  }

  // ── Bullet-Enemy Collisions ──
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (rectCollide(b.x, b.y, b.w, b.h, e.x, e.y, e.w, e.h)) {
        e.hp -= b.damage;
        bullets.splice(bi, 1);
        playHitSound();

        // Hit flash particle
        for (let p = 0; p < 3; p++) {
          spawnParticle(b.x, b.y, (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3,
            '#ffff88', 2, 5);
        }

        if (e.hp <= 0) {
          const pts = e.scoreValue * scoreMultiplier;
          score += pts;
          totalKills++;
          comboCount++;
          comboTimer = 90;

          if (comboCount >= 3) {
            spawnFloatingText(e.x, e.y - 20, `x${comboCount} COMBO!`, '#ffdd00', 22);
          }
          spawnFloatingText(e.x, e.y, `+${pts}`, '#fff', 16);

          const explosionSize = e.type === 'boss' ? 60 : e.type === 'bomber' ? 35 : 20;
          spawnExplosion(e.x, e.y, explosionSize, e.type === 'boss' ? 60 : 25);
          maybeDropPowerup(e.x, e.y);

          enemies.splice(ei, 1);

          // Check wave clear
          if (enemies.length === 0 && waveEnemiesLeft <= 0) {
            waveTimer = 120; // Calm before next wave
          }
        }
        break;
      }
    }
  }

  // ── Enemy Bullet-Player Collisions ──
  if (player.alive && player.invulnTimer <= 0) {
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      if (rectCollide(b.x, b.y, b.w, b.h, player.x, player.y, player.w * 0.6, player.h * 0.6)) {
        enemyBullets.splice(i, 1);
        if (player.shield > 0) {
          player.shield--;
          spawnFloatingText(player.x, player.y - 30, 'BLOCKED', '#44ddff', 16);
          for (let p = 0; p < 8; p++) {
            spawnParticle(player.x + (Math.random() - 0.5) * 20, player.y + (Math.random() - 0.5) * 20,
              (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3, '#44ddff', 3, 15);
          }
        } else {
          player.hp -= b.isHoming ? 15 : 8;
          shakeAmount = Math.min(shakeAmount + 5, 15);
          player.invulnTimer = 15;
          spawnExplosion(player.x + (Math.random() - 0.5) * 10, player.y, 8, 6);
          if (player.hp <= 0) {
            player.alive = false;
            spawnExplosion(player.x, player.y, 50, 50);
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('dogfight_highscore', String(highScore));
            }
            setTimeout(() => { gameState = STATE.GAMEOVER; }, 1500);
          }
        }
      }
    }
  }

  // ── Enemy-Player Collision ──
  if (player.alive && player.invulnTimer <= 0) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (rectCollide(player.x, player.y, player.w * 0.5, player.h * 0.5, e.x, e.y, e.w * 0.5, e.h * 0.5)) {
        player.hp -= 20;
        player.invulnTimer = 30;
        e.hp -= 5;
        shakeAmount = 10;
        spawnExplosion((player.x + e.x) / 2, (player.y + e.y) / 2, 15, 10);
        if (player.hp <= 0) {
          player.alive = false;
          spawnExplosion(player.x, player.y, 50, 50);
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('dogfight_highscore', String(highScore));
          }
          setTimeout(() => { gameState = STATE.GAMEOVER; }, 1500);
        }
        if (e.hp <= 0) {
          spawnExplosion(e.x, e.y, 20, 15);
          totalKills++;
          score += e.scoreValue;
          enemies.splice(i, 1);
        }
      }
    }
  }

  // ── Power-ups ──
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy;
    p.pulse += 0.08;
    p.life--;
    if (p.life <= 0 || p.y > H + 20) {
      powerups.splice(i, 1);
      continue;
    }
    if (player.alive && rectCollide(player.x, player.y, player.w, player.h, p.x, p.y, p.size * 2, p.size * 2)) {
      playPowerupSound();
      switch (p.type) {
        case 'health':
          player.hp = Math.min(player.maxHp, player.hp + 30);
          spawnFloatingText(p.x, p.y, '+30 HP', '#44ff44', 18);
          break;
        case 'rapidfire':
          rapidFireTimer = 480;
          spawnFloatingText(p.x, p.y, 'RAPID FIRE!', '#44aaff', 18);
          break;
        case 'missile':
          player.missiles += 3;
          spawnFloatingText(p.x, p.y, '+3 MISSILES', '#ff4444', 18);
          break;
        case 'shield':
          player.shield = 3;
          spawnFloatingText(p.x, p.y, 'SHIELD x3', '#44ddff', 18);
          break;
        case 'multiplier':
          scoreMultiplier = 2;
          multiplierTimer = 600;
          spawnFloatingText(p.x, p.y, 'SCORE x2!', '#ddaa00', 18);
          break;
      }
      powerups.splice(i, 1);
    }
  }

  // ── Particles ──
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // ── Explosions (shockwaves) ──
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i];
    e.life--;
    e.radius += (e.maxRadius - e.radius) * 0.15;
    e.alpha = (e.life / e.maxLife) * 0.6;
    if (e.life <= 0) explosions.splice(i, 1);
  }

  // ── Floating Texts ──
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y += t.vy;
    t.life--;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }

  // ── Wave spawning ──
  if (gameState === STATE.PLAYING && waveEnemiesLeft > 0) {
    waveSpawnTimer--;
    if (waveSpawnTimer <= 0) {
      spawnWaveEnemy();
      waveSpawnTimer = wave % 5 === 0 ? 10 : 30 + Math.random() * 40;
    }
  }

  // ── Wave completion ──
  if (gameState === STATE.PLAYING && enemies.length === 0 && waveEnemiesLeft <= 0 && waveTimer > 0) {
    waveTimer--;
    if (waveTimer <= 0) {
      startWave(wave + 1);
    }
  }

  // ── Background scrolling ──
  for (const s of stars) {
    s.y += s.speed;
    s.twinkle += 0.05;
    if (s.y > H + 10) { s.y = -10; s.x = Math.random() * W; }
  }
  for (const c of clouds) {
    c.y += c.speed;
    if (c.y > H + 100) { c.y = -c.h - 50; c.x = Math.random() * W - 100; }
  }
}

// ─── Drawing Functions ──────────────────────────────────────────

function drawBackground() {
  // Daytime sky gradient — bright blue atmosphere
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a6dd4');    // deep blue zenith
  grad.addColorStop(0.25, '#3a8ee6'); // mid sky
  grad.addColorStop(0.5, '#62aaf0');  // lighter blue
  grad.addColorStop(0.75, '#8ec5f6'); // pale blue near horizon
  grad.addColorStop(1, '#c4dff7');    // hazy horizon
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Sun glow (upper right area)
  const sunX = W * 0.78;
  const sunY = H * 0.08;
  const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, H * 0.4);
  sunGlow.addColorStop(0, 'rgba(255, 255, 230, 0.9)');
  sunGlow.addColorStop(0.05, 'rgba(255, 250, 200, 0.5)');
  sunGlow.addColorStop(0.15, 'rgba(255, 240, 180, 0.15)');
  sunGlow.addColorStop(0.4, 'rgba(255, 230, 160, 0.04)');
  sunGlow.addColorStop(1, 'rgba(255, 230, 160, 0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, W, H);

  // Sun disc
  ctx.fillStyle = 'rgba(255, 255, 240, 0.95)';
  ctx.beginPath();
  ctx.arc(sunX, sunY, 18, 0, TAU);
  ctx.fill();

  // Clouds — white/grey puffy clouds
  for (const c of clouds) {
    // Cloud shadow
    ctx.fillStyle = `rgba(140, 170, 200, ${c.alpha * 0.4})`;
    ctx.beginPath();
    ctx.ellipse(c.x % (W + 400) + 3, c.y % (H + 200) + 3, c.w / 2, c.h / 2, 0, 0, TAU);
    ctx.fill();
    // Cloud body
    ctx.fillStyle = `rgba(255, 255, 255, ${c.alpha * 0.7})`;
    ctx.beginPath();
    ctx.ellipse(c.x % (W + 400), c.y % (H + 200), c.w / 2, c.h / 2, 0, 0, TAU);
    ctx.fill();
    // Cloud highlight
    ctx.fillStyle = `rgba(255, 255, 255, ${c.alpha * 0.3})`;
    ctx.beginPath();
    ctx.ellipse(c.x % (W + 400) - c.w * 0.15, c.y % (H + 200) - c.h * 0.15, c.w * 0.35, c.h * 0.35, 0, 0, TAU);
    ctx.fill();
  }
}

function drawPlayerJet(x, y, bank) {
  if (!player.alive) return;
  if (player.invulnTimer > 0 && player.barrelRollTimer <= 0 && Math.floor(gameTime / 3) % 2 === 0) return; // Flash (not during barrel roll)

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(bank);

  // Barrel roll visual: simulate 3D spin by oscillating scaleX through cos()
  let rollScaleX;
  if (player.barrelRollTimer > 0) {
    rollScaleX = Math.cos(player.barrelRollAngle);
  } else {
    rollScaleX = 1 - Math.abs(bank) * 1.5;
  }
  ctx.scale(rollScaleX, 1);

  // Shield glow
  if (player.shield > 0) {
    ctx.strokeStyle = `rgba(68, 220, 255, ${0.4 + Math.sin(gameTime * 0.1) * 0.2})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 28, 30, 0, 0, TAU);
    ctx.stroke();
  }

  // Afterburner glow
  const abIntensity = player.afterburner;
  if (abIntensity > 0.2) {
    const flameLen = 12 + abIntensity * 20 + Math.random() * 6;
    // Left engine
    const g1 = ctx.createRadialGradient(-6, 20, 2, -6, 20 + flameLen / 2, flameLen / 2);
    g1.addColorStop(0, `rgba(255, 255, 255, ${abIntensity * 0.8})`);
    g1.addColorStop(0.3, `rgba(100, 180, 255, ${abIntensity * 0.6})`);
    g1.addColorStop(0.7, `rgba(255, 120, 20, ${abIntensity * 0.4})`);
    g1.addColorStop(1, 'rgba(255, 60, 0, 0)');
    ctx.fillStyle = g1;
    ctx.beginPath();
    ctx.moveTo(-9, 18);
    ctx.lineTo(-6, 18 + flameLen);
    ctx.lineTo(-3, 18);
    ctx.fill();
    // Right engine
    const g2 = ctx.createRadialGradient(6, 20, 2, 6, 20 + flameLen / 2, flameLen / 2);
    g2.addColorStop(0, `rgba(255, 255, 255, ${abIntensity * 0.8})`);
    g2.addColorStop(0.3, `rgba(100, 180, 255, ${abIntensity * 0.6})`);
    g2.addColorStop(0.7, `rgba(255, 120, 20, ${abIntensity * 0.4})`);
    g2.addColorStop(1, 'rgba(255, 60, 0, 0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.moveTo(3, 18);
    ctx.lineTo(6, 18 + flameLen);
    ctx.lineTo(9, 18);
    ctx.fill();
  }

  // Main body — elongated for tandem two-seater
  ctx.fillStyle = '#3a6ea8';
  ctx.beginPath();
  ctx.moveTo(0, -26); // Nose (extended forward)
  ctx.lineTo(5, -18);
  ctx.lineTo(7, -6);
  ctx.lineTo(8, 8);
  ctx.lineTo(5, 20);
  ctx.lineTo(-5, 20);
  ctx.lineTo(-8, 8);
  ctx.lineTo(-7, -6);
  ctx.lineTo(-5, -18);
  ctx.closePath();
  ctx.fill();

  // Body highlight — center spine
  ctx.fillStyle = '#5090cc';
  ctx.beginPath();
  ctx.moveTo(0, -24);
  ctx.lineTo(3, -16);
  ctx.lineTo(3, 12);
  ctx.lineTo(-3, 12);
  ctx.lineTo(-3, -16);
  ctx.closePath();
  ctx.fill();

  // Canopy frame — runs between both seats
  ctx.fillStyle = '#2a5580';
  ctx.fillRect(-0.8, -18, 1.6, 18);

  // Front cockpit (pilot)
  ctx.fillStyle = '#88ccee';
  ctx.beginPath();
  ctx.ellipse(0, -15, 3.2, 4.5, 0, 0, TAU);
  ctx.fill();
  // Front glass glint
  ctx.fillStyle = 'rgba(200, 240, 255, 0.6)';
  ctx.beginPath();
  ctx.ellipse(-1, -16, 1.5, 2.2, -0.2, 0, TAU);
  ctx.fill();

  // Rear cockpit (weapons officer)
  ctx.fillStyle = '#77bbdd';
  ctx.beginPath();
  ctx.ellipse(0, -6, 3, 4, 0, 0, TAU);
  ctx.fill();
  // Rear glass glint
  ctx.fillStyle = 'rgba(200, 240, 255, 0.5)';
  ctx.beginPath();
  ctx.ellipse(-1, -7, 1.3, 2, -0.2, 0, TAU);
  ctx.fill();

  // Wings
  ctx.fillStyle = '#2a5580';
  // Left wing
  ctx.beginPath();
  ctx.moveTo(-7, -2);
  ctx.lineTo(-22, 8);
  ctx.lineTo(-20, 12);
  ctx.lineTo(-7, 8);
  ctx.closePath();
  ctx.fill();
  // Right wing
  ctx.beginPath();
  ctx.moveTo(7, -2);
  ctx.lineTo(22, 8);
  ctx.lineTo(20, 12);
  ctx.lineTo(7, 8);
  ctx.closePath();
  ctx.fill();

  // Wing tips
  ctx.fillStyle = '#ddeeff';
  ctx.beginPath();
  ctx.moveTo(-22, 8);
  ctx.lineTo(-20, 12);
  ctx.lineTo(-22, 11);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(22, 8);
  ctx.lineTo(20, 12);
  ctx.lineTo(22, 11);
  ctx.fill();

  // Tail fins
  ctx.fillStyle = '#2a5580';
  ctx.beginPath();
  ctx.moveTo(-4, 14);
  ctx.lineTo(-12, 20);
  ctx.lineTo(-10, 22);
  ctx.lineTo(-4, 18);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(4, 14);
  ctx.lineTo(12, 20);
  ctx.lineTo(10, 22);
  ctx.lineTo(4, 18);
  ctx.closePath();
  ctx.fill();

  // Engine nozzles
  ctx.fillStyle = '#1a3050';
  ctx.fillRect(-8, 16, 4, 4);
  ctx.fillRect(4, 16, 4, 4);

  // Nose detail
  ctx.fillStyle = '#ddeeff';
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(1.5, -18);
  ctx.lineTo(-1.5, -18);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawEnemyJet(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(PI); // Face downward

  // Rotate based on horizontal velocity
  const bank = (e.vx || 0) * 3 * DEG;
  ctx.rotate(bank);

  const scale = e.type === 'boss' ? 1 : 1;
  ctx.scale(scale, scale);

  switch (e.type) {
    case 'scout':
      drawScoutJet();
      break;
    case 'fighter':
      drawFighterJet();
      break;
    case 'bomber':
      drawBomberJet();
      break;
    case 'ace':
      drawAceJet();
      break;
    case 'boss':
      drawBossJet(e);
      break;
  }

  ctx.restore();
}

function drawBossJet(e) {
  // Massive boss jet

  // Main body
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.moveTo(0, -45);
  ctx.lineTo(12, -30);
  ctx.lineTo(18, -10);
  ctx.lineTo(20, 15);
