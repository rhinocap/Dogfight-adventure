  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath();
  ctx.moveTo(0, -42);
  ctx.lineTo(8, -28);
  ctx.lineTo(10, 0);
  ctx.lineTo(8, 25);
  ctx.lineTo(-8, 25);
  ctx.lineTo(-10, 0);
  ctx.lineTo(-8, -28);
  ctx.closePath();
  ctx.fill();

  // Wings
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.moveTo(-18, -5);
  ctx.lineTo(-40, 10);
  ctx.lineTo(-38, 22);
  ctx.lineTo(-16, 15);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(18, -5);
  ctx.lineTo(40, 10);
  ctx.lineTo(38, 22);
  ctx.lineTo(16, 15);
  ctx.closePath();
  ctx.fill();

  // Wing-mounted weapons
  ctx.fillStyle = '#880000';
  ctx.fillRect(-35, 10, 6, 10);
  ctx.fillRect(29, 10, 6, 10);

  // Tail fins
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.moveTo(-10, 28);
  ctx.lineTo(-22, 40);
  ctx.lineTo(-10, 35);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(10, 28);
  ctx.lineTo(22, 40);
  ctx.lineTo(10, 35);
  ctx.closePath();
  ctx.fill();

  // Red glow (more intense as damaged)
  const glowAlpha = 0.3 + (1 - hpRatio) * 0.5;
  ctx.fillStyle = `rgba(255, 0, 0, ${glowAlpha})`;
  ctx.beginPath();
  ctx.ellipse(0, -20, 6, 8, 0, 0, TAU);
  ctx.fill();

  // Cockpit
  ctx.fillStyle = '#cc2200';
  ctx.beginPath();
  ctx.ellipse(0, -25, 4, 7, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255, 100, 50, 0.5)';
  ctx.beginPath();
  ctx.ellipse(-1, -27, 2, 3, 0, 0, TAU);
  ctx.fill();

  // Damage marks
  if (hpRatio < 0.7) {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(-8, 5, 4, 0, TAU);
    ctx.fill();
  }
  if (hpRatio < 0.4) {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(12, -5, 5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ff4400';
    ctx.beginPath();
    ctx.arc(12, -5, 3, 0, TAU);
    ctx.fill();
  }
}

function drawBullets() {
  for (const b of bullets) {
    if (b.isMissile) {
      ctx.fillStyle = '#fff';
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx) + PI / 2);
      ctx.fillRect(-2, -8, 4, 16);
      ctx.fillStyle = '#ff4400';
      ctx.fillRect(-1.5, 4, 3, 6);
      ctx.restore();
    } else {
      // Tracer bullet
      const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.5, '#ffdd44');
      grad.addColorStop(1, 'rgba(255, 200, 50, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(b.x - b.w / 2, b.y, b.w, b.h);

      // Glow
      ctx.fillStyle = 'rgba(255, 255, 200, 0.3)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4, 0, TAU);
      ctx.fill();
    }
  }
}

function drawEnemyBullets() {
  for (const b of enemyBullets) {
    if (b.isHoming) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx) - PI / 2);
      ctx.fillStyle = '#ff2222';
      ctx.fillRect(-2.5, -6, 5, 12);
      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(-1.5, 4, 3, 5);
      ctx.restore();
    } else {
      ctx.fillStyle = '#ff4444';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.w / 2, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255, 100, 100, 0.4)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.w, 0, TAU);
      ctx.fill();
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.5 + alpha * 0.5), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawExplosionRings() {
  for (const e of explosions) {
    ctx.strokeStyle = `rgba(255, 200, 100, ${e.alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, TAU);
    ctx.stroke();

    ctx.strokeStyle = `rgba(255, 255, 255, ${e.alpha * 0.5})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius * 0.7, 0, TAU);
    ctx.stroke();
  }
}

function drawPowerups() {
  for (const p of powerups) {
    const pulse = 1 + Math.sin(p.pulse) * 0.15;
    const s = p.size * pulse;

    // Glow
    ctx.fillStyle = getpowerupGlowColor(p.type);
    ctx.beginPath();
    ctx.arc(p.x, p.y, s + 4, 0, TAU);
    ctx.fill();

    // Background
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(p.x, p.y, s, 0, TAU);
    ctx.fill();

    // Icon
    ctx.fillStyle = getPowerupColor(p.type);
    ctx.font = `bold ${s}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(getPowerupIcon(p.type), p.x, p.y);
  }
}

function getPowerupColor(type) {
  switch (type) {
    case 'health': return '#44ff44';
    case 'rapidfire': return '#44aaff';
    case 'missile': return '#ff4444';
    case 'shield': return '#44ddff';
    case 'multiplier': return '#ffdd00';
  }
}

function getpowerupGlowColor(type) {
  switch (type) {
    case 'health': return 'rgba(68, 255, 68, 0.2)';
    case 'rapidfire': return 'rgba(68, 170, 255, 0.2)';
    case 'missile': return 'rgba(255, 68, 68, 0.2)';
    case 'shield': return 'rgba(68, 220, 255, 0.2)';
    case 'multiplier': return 'rgba(255, 220, 0, 0.2)';
  }
}

function getPowerupIcon(type) {
  switch (type) {
    case 'health': return '+';
    case 'rapidfire': return '\u26A1';
    case 'missile': return '\u25B2';
    case 'shield': return '\u25C6';
    case 'multiplier': return '\u2605';
  }
}

function drawFloatingTexts() {
  for (const t of floatingTexts) {
    const alpha = t.life / t.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = t.color;
    ctx.font = `bold ${t.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // Health bar
  const hbW = 200, hbH = 14, hbX = 20, hbY = H - 40;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(hbX - 2, hbY - 2, hbW + 4, hbH + 4, 4);
  ctx.fill();

  const hpRatio = Math.max(0, player.hp / player.maxHp);
  const hpColor = hpRatio > 0.5 ? '#44ff44' : hpRatio > 0.25 ? '#ffaa00' : '#ff3333';
  ctx.fillStyle = '#333';
  roundRect(hbX, hbY, hbW, hbH, 3);
  ctx.fill();
  ctx.fillStyle = hpColor;
  roundRect(hbX, hbY, hbW * hpRatio, hbH, 3);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(`HP ${Math.ceil(player.hp)}/${player.maxHp}`, hbX + hbW / 2, hbY + hbH / 2 + 1);

  // Shield indicator
  if (player.shield > 0) {
    ctx.fillStyle = '#44ddff';
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`SHIELD x${player.shield}`, hbX, hbY - 10);
  }

  // Missiles
  ctx.fillStyle = '#ff6644';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'left';
  ctx.fillText(`MISSILES: ${player.missiles}`, hbX, hbY - (player.shield > 0 ? 28 : 12));

  // Score
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px Arial';
  ctx.textAlign = 'right';
  ctx.fillText(score.toLocaleString(), W - 20, 35);

  ctx.font = '12px Arial';
  ctx.fillStyle = '#aaa';
  ctx.fillText(`HI: ${highScore.toLocaleString()}`, W - 20, 52);

  // Wave
  ctx.fillStyle = '#88aacc';
  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'left';
  ctx.fillText(`WAVE ${wave}`, 20, 30);

  // Combo
  if (comboCount >= 3) {
    const comboAlpha = Math.min(1, comboTimer / 30);
    ctx.fillStyle = `rgba(255, 220, 0, ${comboAlpha})`;
    ctx.font = `bold ${18 + comboCount}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(`x${comboCount} COMBO`, W / 2, 35);
  }

  // Multiplier
  if (scoreMultiplier > 1) {
    ctx.fillStyle = '#ffdd00';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'right';
    ctx.fillText(`SCORE x${scoreMultiplier} [${Math.ceil(multiplierTimer / 60)}s]`, W - 20, 72);
  }

  // Rapid fire
  if (rapidFireTimer > 0) {
    ctx.fillStyle = '#44aaff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`RAPID FIRE [${Math.ceil(rapidFireTimer / 60)}s]`, 20, 52);
  }

  // Boss health bar
  for (const e of enemies) {
    if (e.type === 'boss') {
      const bbW = W * 0.5, bbH = 16;
      const bbX = (W - bbW) / 2, bbY = 60;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      roundRect(bbX - 2, bbY - 2, bbW + 4, bbH + 4, 4);
      ctx.fill();
      ctx.fillStyle = '#333';
      roundRect(bbX, bbY, bbW, bbH, 3);
      ctx.fill();
      const bossRatio = e.hp / e.maxHp;
      ctx.fillStyle = bossRatio > 0.5 ? '#cc2200' : '#ff4400';
      roundRect(bbX, bbY, bbW * bossRatio, bbH, 3);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS', W / 2, bbY + bbH / 2 + 1);
    }
  }

  // Minimap
  drawMinimap();
}

function drawMinimap() {
  const mW = 80, mH = 100;
  const mX = W - mW - 15, mY = H - mH - 15;
  ctx.fillStyle = 'rgba(0, 10, 30, 0.6)';
  ctx.strokeStyle = 'rgba(100, 150, 200, 0.4)';
  ctx.lineWidth = 1;
  roundRect(mX, mY, mW, mH, 4);
  ctx.fill();
  roundRect(mX, mY, mW, mH, 4);
  ctx.stroke();

  // Player dot
  const px = mX + (player.x / W) * mW;
  const py = mY + (player.y / H) * mH;
  ctx.fillStyle = '#44aaff';
  ctx.beginPath();
  ctx.arc(px, py, 2.5, 0, TAU);
  ctx.fill();

  // Enemy dots
  for (const e of enemies) {
    const ex = mX + (e.x / W) * mW;
    const ey = mY + (e.y / H) * mH;
    if (ey < mY || ey > mY + mH) continue;
    ctx.fillStyle = e.type === 'boss' ? '#ff0000' : '#ff6644';
    const s = e.type === 'boss' ? 3 : 1.5;
    ctx.beginPath();
    ctx.arc(ex, ey, s, 0, TAU);
    ctx.fill();
  }

  // Power-up dots
  for (const p of powerups) {
    const px2 = mX + (p.x / W) * mW;
    const py2 = mY + (p.y / H) * mH;
    ctx.fillStyle = getPowerupColor(p.type);
    ctx.beginPath();
    ctx.arc(px2, py2, 1.5, 0, TAU);
    ctx.fill();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// ─── Title Screen ───────────────────────────────────────────────
let titleJets = [];
for (let i = 0; i < 6; i++) {
  titleJets.push({
    x: Math.random() * 2000,
    y: 100 + Math.random() * 500,
    speed: 1 + Math.random() * 2,
    size: 0.5 + Math.random() * 0.5
  });
}

function drawTitleScreen() {
  drawBackground();

  // Animated jets in background
  for (const j of titleJets) {
    j.x -= j.speed;
    if (j.x < -50) { j.x = W + 50; j.y = 100 + Math.random() * (H - 200); }
    ctx.save();
    ctx.translate(j.x, j.y);
    ctx.scale(j.size, j.size);
    ctx.rotate(-PI / 2);
    ctx.globalAlpha = 0.3;
    drawScoutJet();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Title
  ctx.save();
  const titleY = H * 0.28;

  // Glow behind title
  ctx.shadowColor = '#4488ff';
  ctx.shadowBlur = 40;
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(64, W * 0.07)}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('DOGFIGHT', W / 2, titleY);
  ctx.font = `bold ${Math.min(48, W * 0.055)}px Arial`;
  ctx.fillStyle = '#88bbff';
  ctx.fillText('ADVENTURES', W / 2, titleY + Math.min(55, W * 0.06));
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.fillStyle = '#aaccee';
  ctx.font = `${Math.min(16, W * 0.02)}px Arial`;
  ctx.fillText('A Top-Down Jet Combat Game', W / 2, titleY + Math.min(95, W * 0.1));

  // Click to start (pulsing)
  const pulse = 0.5 + Math.sin(gameTime * 0.06) * 0.5;
  ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
  ctx.font = `bold ${Math.min(22, W * 0.03)}px Arial`;
  ctx.fillText('CLICK TO START', W / 2, H * 0.55);

  // Controls
  const ctrlY = H * 0.65;
  ctx.fillStyle = '#7799bb';
  ctx.font = `${Math.min(14, W * 0.018)}px Arial`;
  const controls = [
    'Mouse: Move',
    'Left Click (hold): Fire Machine Gun',
    'Right Click: Fire Missile',
    'Q / E: Barrel Roll Left / Right',
    'P: Pause'
  ];
  controls.forEach((line, i) => {
    ctx.fillText(line, W / 2, ctrlY + i * 24);
  });

  // High score
  if (highScore > 0) {
    ctx.fillStyle = '#ffdd44';
    ctx.font = `bold ${Math.min(18, W * 0.025)}px Arial`;
    ctx.fillText(`HIGH SCORE: ${highScore.toLocaleString()}`, W / 2, H * 0.88);
  }

  ctx.restore();
}

function drawGameOverScreen() {
  // Darken
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ff4444';
  ctx.font = `bold ${Math.min(56, W * 0.07)}px Arial`;
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 20;
  ctx.fillText('GAME OVER', W / 2, H * 0.3);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(28, W * 0.035)}px Arial`;
  ctx.fillText(`SCORE: ${score.toLocaleString()}`, W / 2, H * 0.42);

  ctx.font = `${Math.min(18, W * 0.025)}px Arial`;
  ctx.fillStyle = '#aaa';
  ctx.fillText(`Waves Survived: ${wave}`, W / 2, H * 0.50);
  ctx.fillText(`Enemies Destroyed: ${totalKills}`, W / 2, H * 0.55);

  if (score >= highScore && score > 0) {
    ctx.fillStyle = '#ffdd44';
    ctx.font = `bold ${Math.min(20, W * 0.028)}px Arial`;
    ctx.fillText('NEW HIGH SCORE!', W / 2, H * 0.62);
  }

  const pulse = 0.5 + Math.sin(gameTime * 0.06) * 0.5;
  ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
  ctx.font = `bold ${Math.min(20, W * 0.028)}px Arial`;
  ctx.fillText('CLICK TO RETRY', W / 2, H * 0.74);
}

function drawWaveIntro() {
  const t = 1 - introTimer / 120;
  const alpha = t < 0.2 ? t / 0.2 : t > 0.7 ? (1 - t) / 0.3 : 1;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(48, W * 0.06)}px Arial`;
  ctx.textAlign = 'center';
  ctx.shadowColor = '#4488ff';
  ctx.shadowBlur = 20;
  ctx.fillText(`WAVE ${wave}`, W / 2, H * 0.4);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function drawBossIntro() {
  const t = 1 - introTimer / 180;
  const alpha = t < 0.15 ? t / 0.15 : t > 0.7 ? (1 - t) / 0.3 : 1;

  // Red flash
  if (introTimer > 120 && Math.floor(introTimer / 10) % 2 === 0) {
    ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ff2200';
  ctx.font = `bold ${Math.min(40, W * 0.05)}px Arial`;
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 30;
  ctx.fillText('WARNING', W / 2, H * 0.35);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(52, W * 0.065)}px Arial`;
  ctx.fillText('BOSS INCOMING!', W / 2, H * 0.45);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function drawPauseScreen() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(48, W * 0.06)}px Arial`;
  ctx.textAlign = 'center';
  ctx.fillText('PAUSED', W / 2, H * 0.45);
  ctx.font = `${Math.min(18, W * 0.025)}px Arial`;
  ctx.fillStyle = '#aaa';
  ctx.fillText('Press P to Resume', W / 2, H * 0.53);
}

// ─── Main Render ────────────────────────────────────────────────
function render() {
  ctx.save();

  // Screen shake
  if (shakeAmount > 0.5) {
    const sx = (Math.random() - 0.5) * shakeAmount;
    const sy = (Math.random() - 0.5) * shakeAmount;
    ctx.translate(sx, sy);
  }

  drawBackground();

  if (gameState === STATE.TITLE) {
    ctx.restore();
    drawTitleScreen();
    return;
  }

  if (gameState === STATE.TAKEOFF) {
    drawRunway();
    drawPlayerJet(player.x, player.y, player.bankAngle);
    drawParticles();
    ctx.restore();
    drawTakeoffHUD();
    return;
  }

  // Game objects
  drawPowerups();
  drawBullets();
  drawEnemyBullets();

  for (const e of enemies) drawEnemyJet(e);

  drawPlayerJet(player.x, player.y, player.bankAngle);
  drawParticles();
  drawExplosionRings();
  drawFloatingTexts();

  ctx.restore();

  // HUD (not shaken)
  drawHUD();

  if (gameState === STATE.WAVE_INTRO) drawWaveIntro();
  if (gameState === STATE.BOSS_INTRO) drawBossIntro();
  if (gameState === STATE.PAUSED) drawPauseScreen();
  if (gameState === STATE.GAMEOVER) drawGameOverScreen();
}

// ─── Game Loop ──────────────────────────────────────────────────
function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  dt = Math.min((timestamp - lastTime) / 16.667, 2); // cap at 2x speed
  lastTime = timestamp;

  if (gameState !== STATE.PAUSED) {
    // Run update potentially multiple times for consistent physics
    // but typically once per frame
    update();
  }

  // Always update title animations
  if (gameState === STATE.TITLE || gameState === STATE.GAMEOVER) {
    gameTime++;
  }

  render();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>
